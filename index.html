ns show that combining pretrained MOFid language representations with structural descriptors outperforms using either the pretrained MOFid representations or the structural descriptors alone, while cross-attention generally performs better than concatenation under matched conditions. Representation strengths are property-specific: structurally pretrained models perform best on QMOF and CH$_4$, whereas our multimodal framework achieves the best results on all three CO$_2$ targets. Bond Connectivity descriptors are most effective for QMOF, and Pore Structure descriptors are effective to HMOF. The two modalities remain complementary in low-data settings, demonstrating that compact structural grounding can effectively enhance MOFid-based language representations.","keywords":"MOF; CO2; CH4; Fusion; LLM; multimodal; Sustainability; descriptors; Metal-organic frameworks","topics":["properties"]},{"note_id":"rPD7JoNuMU","number":"49080","title":"Breaking Observable Degeneracy in Diffusion Models of Amorphous Matter","abstract":"Diversity in conditional samples from a generative model can reflect either creativity or hallucination. In the physical sciences, this ambiguity is critical when inverting an experimental measurement, since choosing among the solutions requires an intractable ground truth that the generative model is meant to replace. Using disordered materials as a challenging case study, we show that a score-based denoiser systematically produces samples of high configurational entropy that the conditional input cannot distinguish from the reference. This amounts to a residual excess temperature, raising the concentration of outliers in the system and compromising the physical behavior of the samples. To break this degeneracy, we implement four modifications to the sampling routine that suppress this residual noise: a gate interpolating between the reverse SDE and the probability-flow ODE; guidance on the low-frequency bands that the experimental observable leaves undetermined; a structural relaxation projected onto the null space of the observable's Jacobian; and a ladder of partial restarts. Together, these measures halve the excess entropy on benchmark systems and allow reaching amorphous configurations that quench kinetics have kept out of reach of direct simulation for decades.","keywords":"generative modeling; probabilistic methods; sampling; physical sciences; materials science","topics":["generation"]},{"note_id":"Kryd7MYvKJ","number":"49971","title":"GEODE: Symmetry-Preserving Cartesian Diffusion for Crystal Generation","abstract":"Most known inorganic crystals exhibit symmetric atomic arrangements, yet generative models often fail to reproduce them.\nExplicitly enforcing these symmetries has so far yielded fewer stable and novel structures than unconstrained generation.\nWe introduce Generative Equivariant Orbit Diffusion Engine (GEODE), to our knowledge the first model to combine coordinate and lattice diffusion in Cartesian space.\nGEODE first samples symmetry templates, then jointly generates the lattice, atomic coordinates and atom types while preserving the specified symmetry with a novel Wyckoff-constrained loss.\nCartesian diffusion gives coordinate noise a consistent physical scale that we empirically demonstrate improves performance.\nUnconditional generation achieves a metastable, unique and novel (mSUN) rate of 11.9\\%, compared with 7.7\\% for the next best symmetry-aware model.\nWe also introduce sampling time template filtering, which increases mSUN by $\\sim$6\\% without retraining, making GEODE competitive with leading symmetry-agnostic models.\nTemplate selection also enables joint symmetry and property guidance, which we demonstrate through classifier-free guidance of permittivity.","keywords":"diffusion models; materials discovery; crystallographic symmetry; crystal structure generation","topics":["generation"]},{"note_id":"tTXRxvhgHm","number":"50043","title":"Ghost Atoms: Flexible Crystal Generation With Voronoi Tessellations","abstract":"Generative models for materials discovery fix the number of atoms per unit cell before generation, so the model never chooses how many atoms its crystal contains and cannot add or remove them. We restore this degree of freedom by padding every cell to a fixed number of atoms with fictitious ghost atoms, placed at well-spaced interstitial sites. We place them by iterative Voronoi maximin selection, so the padded training structures contain no unphysical atomic overlaps. Training the OMatG stochastic-interpolant model on an augmented MP-20 with Voronoi-placed ghosts improves the combined rate of stable or metastable, unique, and novel structures (SUN+MSUN) by 2.6 percentage points over a matched control that places ghosts uniformly at random, and by 6.0 points over the published OMatG model. The Voronoi-trained model learns to keep ghosts out of occupied space, placing far fewer near real atoms, so that converting a ghost into a real atom happens at a vacant site. Our best run reaches a 25.27% SUN+MSUN rate on LeMat-GenBench, a new state of the art.","keywords":"crystal generation; ghost atoms; Voronoi tessellation; stochastic interpolants; materials discovery","topics":["generation"]},{"note_id":"Vjmz8sCDFf","number":"50096","title":"The Materials Scientist Agent: Reinforcement Learning for Crystal Discovery","abstract":"Discovering new inorganic crystals can be seen as a search problem, where the evaluation reveals if a candidate is stable, but not how to improve it. For this purpose, we develop an LLM-based agent and train a 4B model to do targeted materials search. We give the model computational tools, have it propose candidates in a Wyckoff representation, check their novelty, and evaluate their stability and properties over multiple turns. To stop the agent from resubmitting one good material, we score a group of attempts together and split credit between repeated structures. We evaluate on in-domain compositions from MP-20, out-of-domain from WBM, and band-gap targets, judging every structure with MLIPs not used in training. Reinforcement learning nearly doubles the rate of stable, unique, and novel (S.U.N.) structures over supervised fine-tuning, on known and unknown compositions, and the resulting 4B agent outperforms GLM-5.3 Flash and nearly matches Gemini 3.1 Pro, the teacher model. For band-gap targets, it finds up to $7\\times$ more S.U.N. wide-gap materials than a state-of-the-art language model for crystal generation. We also show how the agent can be used to search for lead-free perovskites for solar cells.","keywords":"LLM agents; reinforcement learning; tool use; materials discovery; crystal structure generation; AI for science","topics":["discovery"]},{"note_id":"q0dtylmvfc","number":"50883","title":"Information Present, Pathway Shut: A Conditional Flow Model That Never Used Its Diffraction Pattern","abstract":"When conditioning fails to improve a conditional generative model, the null is usually read as a limit of the data or the task. We show that it can instead mean the model never used its condition, and we give inexpensive diagnostics that tell the two apart. Our case study is rigid-body flow matching for molecular crystal structure determination from powder X-ray diffraction (PXRD). The pattern enters through zero-initialised, tanh-gated cross-attention. In every trained checkpoint the gate stayed near 5e-5. The pattern changed the predicted velocity by about one part in a million, classifier-free guidance was an identity, and our earlier guided-versus-unguided comparisons had been measuring prior-sampling noise. The gate's gradient was not vanishing. Forcing the gate fully open changed the loss identically for a crystal's own pattern and for another crystal's, because the attention weights behind the closed gate had never learned. An ideal-observer information-ceiling test shows that the pattern resolves 0.05 Å molecular displacements in all 200 held-out crystals tested, even at the lowest training count level. The flat conditioning is therefore a learning failure, not an information limit. We then test, under a pre-registered protocol with a deranged-pattern control, whether fine-tuning with the pathway forced open learns crystal-specific use of the pattern. It does not: even with the pathway open and the information present, the own-pattern advantage is confidently below a small effect (rank-biserial r \u003c 0.15 on every head) and indistinguishable from the deranged-pattern control. That confident null is the full-corpus analysis; on the subset our representation defect provably cannot reach (Sohncke groups, n = 1,116) the pre-registered outcome is instead inconclusive, with the orientation bound at 0.152. We also identify an orientation target that is unlearnable in principle and a rigid-body representation defect that rebuilds improper symmetry copies with the wrong hand and, through a rigidity filter, leaves a corpus in which the two most common organic space groups are under-represented by close to an order of magnitude. We distil the diagnostics into a checklist for conditional generative models in the sciences.","keywords":"conditional flow matching; gated cross-attention; classifier-free guidance; conditioning collapse; powder X-ray diffraction; molecular crystal structure prediction; pre-registration; negative results","topics":["generation","characterization"]},{"note_id":"ZS5frw4I9w","number":"51362","title":"CompMat-Bench: Benchmarking AI Agents for Computational Materials Science","abstract":"Evaluating AI agents on scientific research tasks is constrained by the time and resources required for the underlying experiments or calculations. In computational materials research, repeating the same expensive simulations across agents and trials can make evaluation impractical. We introduce CompMat-Bench, a benchmark of 94 tasks derived from recently published computational materials studies, each asking agents to complete a step toward achieving the study's scientific goal. We reproduce the research steps in advance and assess agents on preparing inputs and analyzing outputs for expensive simulations, so expensive simulations can be avoided during evaluation. The reproduced inputs and results serve as ground truth for grading agents with fixed rules, without an LLM judge. The benchmark supports four evaluation conditions: single tasks and workflows composed of related tasks, each with full or reduced methodological guidance. With full guidance on single tasks, agents based on three LLMs demonstrate the ability to complete individual materials research steps, with pass rates of 66.0–90.4% across 94 tasks. Both longer workflows and reduced guidance can limit agent performance, but in different ways for different agents: they lower the pass rates of the weaker agents, whereas the strongest agent falls only when a long workflow is combined with reduced guidance. Failure analysis attributes most failures to scientific errors rather than to errors in software usage. CompMat-Bench provides a basis for comparing agents on the steps of real materials research and for analyzing agent failure modes.","keywords":"AI agents; computational materials science; scientific benchmarks","topics":["discovery","benchmarks"]},{"note_id":"8dPblNkCHj","number":"51407","title":"MPMWorlds: A Dataset of Executable Material-Point-Method Simulations for Inferring and Extrapolating Physical Dynamics","abstract":"To study the ability to infer physical dynamics from videos and extrapolate them forward in time, we assemble a dataset of 2D Material Point Method (MPM) physical simulations covering rich physical phenomena such as deformable objects, fluids, kinematic objects, and emitters. Every simulation pairs executable source code, a structured scene configuration, and a rendered video, which lets code generation and video generation be trained and conditioned on the same scene and evaluated on the same video.\nWe study code generation and video diffusion approaches on this dataset, identifying their strengths and weaknesses by varying the amount of physically relevant side information. Our contributions are the dataset and this study. The study does not rank the two approaches; it characterizes how each one fails. The code generation models, beyond giving a working demonstration of automatic synthesis of MPM simulations, reveal that such an approach struggles with inferring physical parameters from visual input, but relative to video diffusion, produces physically and temporally stable extrapolations forward in time, while the video diffusion models more strongly identify geometric properties from visual input but produce physically implausible extrapolations. We test the main findings across three VLMs and three VDMs, including a sample-matched comparison and physically grounded metrics.","keywords":"Physical simulation; program synthesis; intuitive physics; world models; multimodal models","topics":["mechanics","benchmarks"]},{"note_id":"Vj7w5LiBae","number":"51543","title":"Do Learned Particle Dynamics Transfer Across Battery Operating Conditions?","abstract":"Machine-learned simulators of physical systems are usually trained and tested under similar conditions, yet for batteries what matters is how electrode particles behave when the charging rate, temperature or cell age changes, and such measurements are scarce. We introduce a benchmark of operando optical microscopy movies, recorded while the batteries run, in which the same particles are filmed under different conditions: 22 graphite particles at slow (C/20) and faster (C/2) charging over 6–45 °C (about 300 hours of recording), 24 particles of a nickel manganese cobalt oxide (NMC) cathode at three rates, and four further cells. Forecasters predict a particle's future image from its recent frames and the known current, and are compared with baselines that replay the same particle's earlier behaviour. First, with one training rate, a network that steps forward in charge passed rather than in time transfers far better from slow to fast charging (graphite: skill gains of 0.42 and 0.51 over matched time steps at short and long horizons), because charge builds in the known speed-up. Second, same-particle baselines largely catch up with a step-by-step network at long horizons, whereas a U-Net that predicts each horizon directly stays ahead on six graphite rate and temperature splits but does not clearly beat NMC's best baselines. Third, particles first convert during lithiation in a reproducible order at one rate and temperature but not detectably across rates, and forecasts from slow to fast charging miss when and where particles convert, relative to a repeat experiment. For the foundation model Poseidon, performance depends strongly on how the output is scaled; Poseidon beats the direct U-Net at short horizons when data are scarce, but under the tested recipes neither Poseidon nor Walrus beats it at long horizons.","keywords":"operando microscopy; battery materials; scientific machine learning; spatiotemporal dynamics prediction; generalization under distribution shift; physics-informed baselines; experimental data; electrochemistry","topics":["characterization","mechanics","benchmarks"]},{"note_id":"5dTjdAyZTN","number":"51957","title":"From Prediction to Measurement: The Protocol Boundary for Material Parameters from Video","abstract":"Video-based inverse-physics systems increasingly report material parameters in physical units, yet\npredicting physical motion and measuring physical parameters are different tasks. For the continuum\nmodels these systems use, jointly scaling density and every stress-dimensioned parameter leaves the\nobserved mechanics unchanged, so the observations determine gauge-invariant combinations such as the\nelastic speed scale $c=\\sqrt{E\\rho}$ but not the absolute mass--stress scale. We turn this\nclassical symmetry into a criterion for \\emph{when an observation protocol supports an absolute\nmeasurement}: the surviving gauge is exactly the subgroup that leaves invariant every exogenous datum\nthe inference holds fixed. Kinematic and density-proportional forcing---passive motion, gravity,\nself-weight, and even displacement-controlled actuation---therefore preserve the gauge, while a fixed\ndatum carrying an absolute mass or force scale removes it; with known geometry, a weighed mass\nsuffices. The boundary governs evaluation as well. If every validation protocol preserves the gauge,\nevery score computed from its observations is gauge-invariant, so held-out views, frames and kinematic\ninteractions can validate predicted dynamics without validating the absolute parameters behind them: a\ncandidate whose modulus is wrong by $100\\times$, with density co-scaled, still attains silhouette IoU\n$1.0000$, and one weighed mass exposes it. Across seven protocols, four constitutive families and\nreleased systems from two independent lineages, we find that when the mechanics leave the absolute\nscale undetermined it is supplied elsewhere---by an assumed density, a prior, an initialization or\noptimizer geometry---even where density is genuinely optimized. We state what to report, and how to\nvalidate, instead.","keywords":"video; physics; gauge-invariant","topics":["mechanics"]},{"note_id":"8NIfou0DkK","number":"52141","title":"CataPath: Expert-Augmented Path Search for Constraint-Aware Scientific Reasoning in Catalyst Design","abstract":"Large Language Models (LLMs) have shown promise as scientific assistants, yet their use in open-ended material design remains limited by violations of domain-specific constraints. We study rational catalyst design as a challenging testbed for scientific reasoning, where an agent must generate chemically coherent intermediate decisions. We propose CataPath, an expert-augmented LLM agent that formulates catalyst design as search over a chemically informed action space. CataPath uses Monte Carlo Tree Search to explore design trajectories and a hybrid reward mechanism that combines property-prediction signals with an Expert Preference Reward Model trained from domain feedback. To support this framework, we curate CataDesignQR, a dataset of literature-grounded design goals, verified solutions, and expert-scored reasoning trajectories. We evaluate CataPath on two catalyst-related material-design settings, CO$_2$ reduction electrocatalyst generation and organic structure-directing agent optimization. Experiments show that CataPath improves generation validity, proxy effectiveness, and expert alignment over other baselines. These results suggest that process-level search with expert-informed rewards can improve the reliability of LLM agents for scientific design tasks.","keywords":"Large Language Models; Scientific Reasoning; LLM Agents; Material Discovery","topics":["discovery"]},{"note_id":"jjnBHtB7zK","number":"52364","title":"CrysTune: Crystal Generation via Fine-Tuning of Large Language Models on Wyckoff Representations","abstract":"The discovery of novel materials is essential for driving scientific and technological breakthroughs. Recent work has explored fine-tuning large language models (LLMs) for autoregressive crystal generation, but the ideal representation and training strategies for symmetry-based inductive biases remain unclear. We propose CrysTune, a class of LLMs fine-tuned on Wyckoff representations of crystals with two auxiliary tasks: canonicalization and template prediction. CrysTune shows competitive performance and improved stability-related metrics relative to LLMs trained on standard string-encoded representations. We further use these models as initial policies for reinforcement learning (RL) fine-tuning to optimize stability, validity, uniqueness, novelty, and diversity. RL-trained policies produce more valid and metastable crystals, while introducing novelty and diversity trade-offs. We also explore crystal system conditioning, showing that RL-trained policies produce a higher proportion of crystals matching the target condition.","keywords":"materials discovery; generative modeling; large language models; reinforcement learning; Wyckoff positions","topics":["generation"]},{"note_id":"UhnzBwTnkb","number":"52899","title":"MatLoom: Layered Text-to-Material Generation in a Compact Program Space","abstract":"Material generation should produce not only an appearance, but also the rules that construct it.\nWe introduce MatLoom, a compact, layer-oriented language for text-to-material generation with pretrained language models.\nEach program composes alpha-masked layers whose shared spatial expressions define coverage and physically based rendering (PBR) channels, making dependencies between patterns, color, and relief explicit.\nA standalone interpreter evaluates the program into material maps, while the source retains named fields and layer parameters for subsequent authoring.\nWithout task-specific fine-tuning, our pipeline uses parser-guided repair and preview-based critique to revise material designs, then searches noise seeds while keeping each candidate's remaining source fixed.\nOn a curated benchmark of 141 prompts evaluated with six backbones, our best-performing configuration achieves higher mean scores than three diffusion baselines on all four flat-layout prompt-alignment metrics.\nIts initial programs already exceed all three baselines on mean BLIPScore, before critique or seed search.\nRetained programs have a median length of 21 lines when pooled across backbones.\nIn a blind four-way comparison involving 30 participants and 20 prompts, our renders receive 59.2% of choices, compared with 19.3% for the most-preferred baseline.\nCompact executable programs thus offer a way to generate prompt-aligned materials while retaining their construction as part of the asset.","keywords":"material generation; procedural materials; physically based rendering; domain-specific languages; program synthesis; large language models","topics":["graphics"]},{"note_id":"YfGyct6cE6","number":"53260","title":"SLayerGen: a Crystal Generative Model for all Space and Layer Groups","abstract":"Crystal generative models have shown rapid progress for accelerating the discovery of bulk, periodic materials. However, many material systems such as 2D superconductors, thin film semiconductors, and catalytic surfaces are diperiodic, i.e., aperiodic along one of the lattice directions. These systems are invariant under the layer groups, which are known to influence materials properties yet not considered by existing models. In this paper, we propose SLayerGen, a generative model that produces crystals constrained to be invariant to any space or layer group. SLayerGen consists of coarse-to-fine discrete autoregressive lattice generation; transformer-based autoregressive sampling of Wyckoff positions, elements, and numbers of symmetrically unique atoms; and space or layer group equivariant diffusion of atomic coordinates. To facilitate progress in generative modeling of diperiodic materials, we assembled and filtered datasets of monolayers and bilayers, propose relevant evaluation metrics, and developed novel representations for layer group symmetries. For de novo generation of diperiodic materials, SLayerGen achieves consistent performance gains over bulk crystal generative models and is competitive when training jointly on bulk and diperiodic materials.","keywords":"space group; layer group; crystal; diperiodic; 2D material; diffusion; generative; autoregressive; equivariant","topics":["generation"]},{"note_id":"HKljbVg01v","number":"53604","title":"Physics-Routed MoE with Crystallographic Priors for Long-Tailed Space-Group Recognition","abstract":"Determining a crystal's space group from a powder X-ray diffraction (PXRD) pattern is a 230-way fine-grained classification problem characterized by severe class imbalance and substantial similarity among diffraction patterns. Many rare space groups have fewer than 20 training examples and are easily confused with frequent groups in the same crystal system. We present Phys-MoE, a Mixture-of-Experts classifier that incorporates crystallographic priors into routing and representation learning. Phys-MoE consists of three components: a hierarchical router that masks space groups inconsistent with the predicted crystal system, a rule-biased gating mechanism that encourages expert specialization across symmetry blocks, and a rule-semantic contrastive objective based on the Jaccard similarity between symmetry-operation sets. Experiments on CCDC, CoREMOF, and an inorganic distribution-shift benchmark demonstrate the effectiveness and generalizability of Phys-MoE. On CCDC, Phys-MoE achieves 81.70% overall Top-1 accuracy and 26.19% accuracy for space groups with fewer than 20 training examples, establishing a new state of the art for long-tailed space-group recognition from PXRD patterns. Ablation studies demonstrate that the three crystallographic components work jointly to improve recognition, while error and oracle analyses identify crystal-system prediction as a remaining bottleneck for rare classes. These results show that incorporating crystallographic structure into expert routing and representation learning provides an effective approach to accurate and reliable space-group recognition under long-tailed data distributions.","keywords":"powder X-ray diffraction; space-group recognition; long-tailed recognition; mixture of experts; crystallographic priors; hierarchical routing; contrastive learning","topics":["characterization"]},{"note_id":"PHmABJP69Q","number":"54675","title":"From Fragments to Functions: Evidence-Linked Trajectories for Tracing Scientific Recombination","abstract":"Scientific designs often combine functional relations first reported in separate papers, yet literature extraction rarely distinguishes a new local mechanism from a new arrangement of established ones. We ask how such recombination appears in the scientific record and whether historically supported but unreported paths precede later complete reports. To study these questions, we construct source-linked Material–Sensor–Signal–System trajectories from full-text conductive-fibre flexible-sensor papers. A paper-disjoint evaluation on 200 gold papers assesses source fidelity and record coverage. Of 1,302 complete trajectories first observed in 2022–2025, 78.4% combine three relations already observed before 2022. In four rolling-origin tests, a source-linked relation-support score places 29–36 future complete reports among its top 100 candidates, versus 19–29 for term popularity and 2.5–3.0 expected under random ranking. These temporal analyses make functional recombination observable and test whether local precedent anticipates complete-path reports.","keywords":"scientific literature mining; evidence-grounded information extraction; scientific discovery; temporal backtesting; materials informatics; flexible sensors","topics":["discovery"]},{"note_id":"nXcc3oX6VN","number":"54916","title":"KnockGS: Interaction-Grounded Calibration of Physical Gaussian Representations","abstract":"Physics-integrated 3D Gaussian representations now allow reconstructed deformable objects to be simulated and rendered under explicit material models. Existing pipelines, however, assume that material parameters are known or manually specified, limiting their applicability when these parameters must be inferred from observed object dynamics. We propose KnockGS, an interaction-response PhysicalGS framework that estimates the elasticity and density scales of a 3D Gaussian object from its dynamics under a known applied force. Rather than treating physical simulation only as a forward process, we turn the force-induced response into a calibration signal: temporal response features are extracted from the observed dynamics, the two material scales are estimated from those features, and the estimate is then frozen and written back into the same simulator so that it can be tested on an interaction it was never fitted to. We evaluate the framework on both parameter recovery and response-level fidelity. The estimated scales are compared against hidden ground truth, and the re-simulated object is measured against the target using 3D particle trajectories, response-curve statistics, and rendered-frame quality. Across five held-out material targets, our method recovers the scales substantially more accurately than response retrieval, global regression, or a fixed default material, and the frozen estimate remains predictive under interactions that differ in direction and in magnitude. Interaction response therefore carries enough information to calibrate material scales in physically grounded 3D Gaussian representations. Our study is a first step toward interactive PhysicalGS systems that calibrate a Gaussian asset whose rendered appearance and simulated response are consistent.","keywords":"Physical AI; 3D Gaussian Splatting; material parameter calibration; active interaction; material point method","topics":["mechanics","graphics"]},{"note_id":"ZlgDCbUTRP","number":"55000","title":"PhysForge: Material-Controllable 3D Reconstruction with Separable Components","abstract":"Recent advances in physical 3D generation have enabled visually faithful assets\nwith simulatable mechanical behavior. However, existing methods provide\nlimited control over material behavior beyond appearance-based inference and\nstruggle to estimate physical properties from complex interactions between objects\nand semantic parts. Therefore, we present PhysForge, a Video Diffusion\nModel (VDM)-based framework for addressing these challenges, comprising two\ncomplementary modules for material-controllable physical fitting and componentlevel\ninteraction modeling. The first, PhysFit, leverages material-conditioned\nVDM dynamics as references for physical-property fitting, introducing windowed\nfitting to focus on material-revealing interactions and Hallucinated Forcing to disentangle\nnonphysical motion hallucinated by the VDM from material responses.\nThe second, PhysComp decomposes complex interactions into individual objects\nand semantic components, enabling their physical parameters to be optimized independently\nand flexibly composed for joint simulation. Experiments on PhysAssets\nand Google Scanned Objects demonstrate that, compared with existing methods,\nPhysForge provides stronger control over material-dependent physical responses\nwhile supporting component-level physical modeling for complex interactions.\nIt achieves the best CLIP and physical controllability scores on both common\nand uncommon materials, with qualitative comparisons, component-level ablations,\nand a user study further supporting these improvements.","keywords":"material-controllable; component separable; 3D reconstruction","topics":["mechanics","graphics"]},{"note_id":"NS0MIuwgrg","number":"55815","title":"Enhancing Robustness through Repair-Oriented Honeypots and Selective Knowledge Aggregation","abstract":"A model with established adversarial robustness can remain vulnerable to an encountered attack. Targeted improvement requires useful repair data and a learning procedure that limits damage to existing capabilities. We introduce HoneyTeacher, a general framework that couples repair-oriented honeypot induction with selective knowledge aggregation. The production model's estimated repair benefit guides honeypot configuration, shaping attack interactions to yield training material with greater downstream learning value. A material teacher learns from these data; aggregation then selects supervision from this teacher and the original model according to their joint correctness, consolidating complementary corrections while retaining existing strengths. We evaluate score-based black-box and gradient-based white-box instantiations on all 10,000 CIFAR-10 test images. Under Square and PGD attacks, respectively, target robust accuracy improves by 12.4% and 8.7% relative to the original model, and by 17.1% and 13.5% relative to ordinary-material direct learning. On the secondary Square evaluation, the white-box model improves accuracy by 24.0% relative to the original model and 34.2% relative to ordinary-material direct learning. Clean accuracy changes by +0.17 and −1.26 percentage points relative to the original model in the black-box and white-box settings, respectively, with all monitored capabilities meeting the adopted retention criteria. Induced material improves robustness under matched direct learning, and aggregation adds further gains; together, they reverse the net target-robustness losses observed with ordinary direct learning in both settings.","keywords":"Adversarial Robustness; Repair-Oriented Honeypots; Adversarial Material Acquisition; Selective Knowledge Aggregation; Capability Retention.","topics":["other"]},{"note_id":"J4Bt3A8fqi","number":"55891","title":"Zero-Shot Compositional Generalization in Neural PDE Solvers via Conservative Material-Guided Routing","abstract":"Neural PDE solvers have shown strong generalization across new geometries and parameter regimes, but a distinct question remains less explored: if a model has seen different physical constituents separately during training, can it correctly combine that knowledge when those familiar constituents appear together for the first time? In this setting, the individual constituents are not new; what is new is their composition. We study this problem as zero-shot compositional generalization in heterogeneous PDEs. For latent-state transformer PDE solvers, providing material information as input features alone does not necessarily ensure that this information is used appropriately when forming latent physical states.\nTo address this, we introduce Material-Interface Guided Transolver with Conservative Compositional Routing (CCR-MIG), which allows constituent information not only to be represented as input, but also to influence latent-state formation. Rather than perturbing the learned routing logits, CCR-MIG composes constituent-specific routing distributions with the original data-driven routing through a bounded convex mixture, and a conflict-aware gate reduces this intervention where constituent influences overlap. We evaluate the method on heterogeneous linear elasticity and steady thermal conduction. Across six seeded training runs, CCR-MIG reduces the mean relative error of the original Transolver from 0.08456 to 0.05818 in elasticity and from 0.03775 to 0.02323 in thermal conduction. Compared with a feature-matched baseline that receives the same constituent information but leaves latent-state formation unchanged, CCR-MIG further reduces error by 23.4% and 18.9%, respectively. Effect sizes favor CCR-MIG in all four primary comparisons, though six paired runs do not support a conclusive significance claim.","keywords":"neural PDE solvers; operator learning; compositional generalization; transformers; attention; heterogeneous materials; scientific machine learning; zero-shot generalization","topics":["mechanics"]},{"note_id":"fyI3wb0Fnh","number":"55924","title":"AtomSteer: Test-Time Constraint Steering for Atomistic Generative Models","abstract":"Diffusion and flow matching models offer scalable approaches to generating molecular conformers, protein-ligand complexes, and crystalline materials. However, satisfying structural geometry, accurate stereochemistry, and crystallographic symmetry remains challenging. Satisfying these requirements calls for corrections that also preserve the geometry already captured by the pretrained model. In this work, we propose AtomSteer, a test-time inference framework for steering pretrained atomistic generative models with structural constraints. During sampling, AtomSteer corrects intermediate structure predictions with bounded local projections, graph-rigid stereochemical transformations, and projections over periodic symmetries, accepting updates that improve constraint satisfaction while limiting changes to the rest of the structure. We demonstrate AtomSteer across three pretrained backbones, ET-Flow, Boltz-2, and FlowMM, spanning molecular conformer generation, protein-ligand complex structure prediction, and de novo crystal generation and crystal structure prediction. AtomSteer improves molecular validity and E/Z stereochemical accuracy while retaining conformer ensemble fidelity. For protein-ligand complexes, AtomSteer reduces ligand E/Z errors relative to experimental reference structures while achieving competitive docking success and PoseBusters validity. AtomSteer improves space-group distribution coverage in de novo crystal generation and improves target space-group recovery in crystal structure prediction. Our method provides a unified framework for adding chemical and crystallographic control to existing atomistic generative models without retraining or architectural changes.","keywords":"Atomistic generative models; test-time steering; constrained generation; diffusion models; flow matching; molecular generation; protein–ligand structure prediction; materials generation","topics":["generation"]},{"note_id":"hMUB8xrbwx","number":"56366","title":"Learning what to preserve: Grammar constrained search across scientific domains","abstract":"Scientific strings encode structure directly in their notation. A chemical formula such as $\\mathrm{LiMn_2O_4}$ specifies elemental identities and stoichiometric quantities, while a protein mutation such as \\tc{M105K} specifies residues and a positional coordinate. Yet pretrained models typically process such inputs using tokenizers learned from corpus statistics rather than from the structure of the notation itself. Existing solutions often introduce domain-specific parsers, vocabularies, or tokenizers, requiring a new representation strategy for each scientific domain. We ask whether a shared input representation rule can instead be discovered from downstream tasks across domains with different structural requirements. We introduce GCMS, a grammar-constrained multi-domain search framework that uses a policy gradient search over interpretable input rewrites. Joint search on crystal-system classification and protein mutation fitness discovers a common representation without an element inventory, residue classifier, or domain-specific parser. The learned rule transfers across unseen tasks and notation systems, including held-out materials properties, additional protein assays, modified peptides, and genomic variants. GCMS reduces band-gap MAE from $0.6161$ to $0.4918$ relative to WordPiece and reaches $0.8789$ Spearman on the held-out ProteinGym BLAT assay. These results show that transferable structure in scientific notation can be discovered from task supervision rather than engineered separately for each domain.","keywords":"AI for Science; Multi-domain learning; Materials informatics; Domain-specific tokenization; Life sciences","topics":["properties"]},{"note_id":"ODFL7DgcmW","number":"56980","title":"MetaGround: Physics-Grounded Conditional Diffusion for Nonlinear Metamaterial Inverse Design","abstract":"Generative models for nonlinear metamaterial inverse design are typically confined to a single mechanical property, overlooking the physical coupling between the stress-strain (SS) response and volume fraction (VF). These generators rely on surrogate proxies to rapidly pre-screen candidate geometries, yet evaluating with proxies not validated against physical ground truth produces an optimistic bias that inflates apparent performance, and low-accuracy pre-screening in turn requires more inference candidates for compensation.\n\nWe present MetaGround, a DBTL-style framework in which conditional diffusion designs SDF candidate geometries, FEM simulation builds physical ground truth, a surrogate proxy tests candidate quality, and residual-guided adaptation learns to recalibrate the proxy. Within this loop, MetaGround introduces multi-physics conditioning architectures for SS and VF, a VF extrapolation protocol probing the generalization boundary, FEM-supervised adaptation driven by residual-guided selection, and finally an independent test set sampled from the full design space to anchor evaluation in FEM ground truth. Experiments show that the cross-attention + FiLM configuration (B2-PD) outperforms the baseline and is the most robust under deep VF extrapolation; the independent test set systematically confirms the optimistic bias of the proxy, and residual-guided selection improves proxy accuracy, raising the downstream screening pass rate from 34.4% to 39.6% at a fixed FEM budget.","keywords":"Conditional diffusion; nonlinear metamaterial; inverse design; SDF; FEM; surrogate proxy; DBTL loop; volume fraction extrapolation","topics":["characterization","mechanics"]},{"note_id":"Y1NLuaSLPC","number":"57358","title":"Retro-Forge: A Multi-Step Pairwise Retrosynthesis Framework for Solid-State Materials Synthesis","abstract":"AI-driven materials discovery has made remarkable strides in generating\nstable, unique, and novel structures at unprecedented scale, yet a\ncritical gap remains between generation and realization: without valid\nsynthesis routes, proposed materials stay in silico. Existing approaches\nto precursor prediction (PP)---the first and most consequential step of\nmaterials synthesis planning (MSP)---formulate it as a single-step\nproblem, overlooking the established domain knowledge that solid-state\nreactions proceed pairwise. We introduce Retro-Forge, a multi-step\npairwise retrosynthesis framework that for the first time casts PP as a\nsequence of learnable pairwise reactions. A single-step pairwise reactant\nprediction model is trained on a curated pairwise reaction dataset,\nexpanded through synthetic data augmentation to address data scarcity.\nThis model is composed recursively within a tree search to produce\ncomplete synthesis routes, and further optimized for this task via\nmulti-step tree-RL. We construct a clean benchmark of 857 novel targets\nverified absent from all training data, on which Retro-Forge achieves\nstate-of-the-art performance. Beyond precursor prediction accuracy, we\nindependently corroborate that the large majority of its predicted\npairwise steps are stoichiometrically balanced and thermodynamically\nfavorable under DFT-derived reaction energies---demonstrating that the\nmulti-step pairwise formulation is not only learnable \nbut also chemically valid.","keywords":"Precursor Prediction; Pairwise Reaction; Retrosynthesis; Data Augmentation; Material Science","topics":["synthesis"]},{"note_id":"D6x9fAEEXt","number":"57367","title":"Learning Material Decisions from Heterogeneous Evidence","abstract":"Materials decisions combine incomplete composition ranges, property tables, response curves, processing histories, and text. We propose a query-conditioned framework that retains each observation's value type, role, conditions, and provenance, learns to reconstruct whole withheld evidence views, and applies typed constraints to the completed responses. Existing corpus observations provide supervision without new manual labels for every task. The implemented interface composes trained tree-based, neural, and donor specialists for\nproperty completion, joint requirement selection, and response-to-region inference; a fully shared heterogeneous encoder remains an extension. The organizing principle is decision sufficiency: a unique material state is unnecessary when compatible states support the same action. The decision layer preserves joint constraints, nonzero composition or process ranges, and unresolved applicability, distinguishing source-supported conclusions from model-conditional recommendations without autoregressive text generation. Evaluations show that complementary evidence improves completion against strong context-only controls and that learned functional responses support non-zero operating windows. Useful coverage and requirement violations expose tradeoffs that regression error alone misses. Matched controls separate these gains from general parameter transfer and show that joint-decision training does not improve every seed. The result connects fragmented materials knowledge to evaluated decisions over ranges rather than isolated property predictions.","keywords":"materials prediction; applications","topics":["properties"]},{"note_id":"0TYMLp5JR6","number":"58133","title":"HeteroPhys: Heterogeneous Physical Property Identification from Videos","abstract":"Recovering physical properties from videos is essential for predicting object dynamics beyond observed interactions, yet direct identification of spatially heterogeneous physical fields remains underexplored. We present HeteroPhys, a framework for recovering heterogeneous physical parameter fields from multi-view videos of deformable objects. HeteroPhys extracts Lagrangian motion and local deformation histories and represents material properties in constitutive coordinates separating volumetric and deviatoric responses. A hierarchical conditional diffusion model reconstructs fields from coarse structure to fine spatial variation, while permutation-invariant fusion integrates evidence from multiple interactions. The predicted dense fields are further refined through differentiable MPM optimization. We construct a benchmark with ground-truth heterogeneous fields across elastic and plasticine materials. Experiments show that HeteroPhys generalizes to unseen geometries, benefits from additional interaction evidence, and remains predictive under unseen interaction conditions.","keywords":"visual system identification; heterogeneous physical property fields; inverse physics; multi-interaction inference; material property estimation","topics":["mechanics"]},{"note_id":"mS7J36xbKx","number":"58240","title":"CrystalJTF: Jacobian-Pulled Gradient Guidance with Atom-Adaptive Gradient Scaling for Crystal Diffusion Models","abstract":"Diffusion models offer a promising route to crystal discovery, but generating\nthermodynamically stable and novel structures remains challenging. Integrat-\ning physical signals from pretrained interatomic potentials into sampling tra-\njectories could improve generation quality without additional training. Effec-\ntive feedback, however, must address two challenges: the coordinate-space mis-\nmatch between predicted-endpoint forces and current sampling coordinates, and\ndifferences in local response scales across atoms in periodic systems. We pro-\npose CrystalJTF, a plug-and-play, training-free guidance framework for crystal\ndiffusion models. Point Q-JTF pulls endpoint forces back to the current sam-\npling coordinates through the predicted clean endpoint map’s Jacobian trans-\npose. Relative-BB uses sampling history to adapt atom-wise relative update\nscales, while a shared periodic geometry cap limits displacement magnitudes.\nCrystalJTF freezes both the generator and potential and retains native lattice\nand element-type sampling rules, supporting composition-conditioned and un-\nconditional generation. Across six benchmark settings involving CrysLLM-\nGen, DiffCSP, and MatterGen, CrystalJTF consistently improves the fractions\nof stable or metastable, unique, and novel structures (SUN/MSUN). Under\nCHGNet 0.3.0 evaluation, SUN and MSUN increase by an average of 1.28 and\n4.78 percentage points on MP-20, respectively, while MatterGen’s MSUN in-\ncreases by 13.8 percentage points on Alex-MP-20. Sensitivity analyses across\nevaluation-potential versions and matching tolerances further support the robust-\nness of these results.","keywords":"Crystal Structure Generation; Diffusion Models; Physics-Guided Sampling; Jacobian-Transported Force Guidance; Atom-Wise Adaptive Step Sizes; Training-Free Guidance.","topics":["generation"]},{"note_id":"AyNWIEghR0","number":"58368","title":"HiFi3D: High-Fidelity 3D Asset Editing for Sparse Voxel Representations","abstract":"Existing 3D editing methods suffer from two critical limitations: optimization-based approaches require lengthy per-instance tuning, while recent flow-based methods struggle to preserve fine geometric structures and material details during editing. We introduce HiFi3D, a training-free 3D editing framework built upon TRELLIS2's factored O-Voxel representation, enabling precise instruction-guided modifications without model retraining. Our method overcomes two fundamental challenges: fragility of sparse voxel topology under stochastic perturbations, and the entanglement between geometric structure and surface appearance in joint editing pipelines. For geometry manipulation, we propose Dual-Space Geometry-Preserving Flow Editing, which combines mask-free regional dynamics with dual-level preservation, maintaining trajectory stability while voxel-supervised alignment ensures decoded geometric consistency through a differentiable decoder. For appearance control, we introduce Geometry-Conditioned Material Editing with PBR consistency constraints, reformulating texture editing as a geometry-aware process where multi-sample velocity estimation stabilizes material flow and decoded-space regularization enforces physically plausible PBR attributes. Extensive experiments demonstrate that HiFi3D achieves accurate instruction-following modifications while outperforming state-of-the-art baselines in both visual quality and geometric fidelity.","keywords":"3D Asset Editing; Material Editing; 3D Generative Models","topics":["graphics"]},{"note_id":"4LaYArhYvS","number":"59462","title":"The NNP Score Completeness Boundary: Physics Decomposition for Crystal Structure Prediction with Neural Network Potentials","abstract":"Crystal structure prediction (CSP) faces a trade-off between data-driven generative models, which need substantial training data, and physics-based sampling, which is computationally expensive. \nPre-trained neural network interatomic potentials (NNPs) offer a middle ground: their energy gradients define conservative scores, so they can in principle sample the Boltzmann distribution without training a generative model. \nWe show that using them directly exposes a fundamental limitation. \nNNPs are not uniformly complete: they capture long-range chemistry and equilibrium forces accurately, but their training data contain no deep-overlap configurations, leaving short-range Pauli repulsion unconstrained and driving noise-dependent trajectories into an out-of-distribution (OOD) regime. \nWe introduce a physics decomposition that pairs learned long-range chemistry with analytically specified short-range universality. \nThe augmented score is exactly conservative and needs no generative training. \nExperiments show that the augmented score holds the induced rate to at most a few percent across the entire scan. \nThe frontier where the score stops being complete---the NNP score completeness boundary---is a property of the training data that any machine-learned potential inherits, not an architectural defect. Supplying the missing short-range physics analytically is what makes a pre-trained potential a usable generative score. Our code is available at \\url{https://anonymous.4open.science/r/MaterialGen_anoy-3A8B}.","keywords":"crystal structure generation; neural network interatomic potentials; score completeness boundary","topics":["generation","potentials"]},{"note_id":"S2aUVjgtIt","number":"59884","title":"Do Candidate-Pool Benchmarks Faithfully Evaluate LLM Optimizers?","abstract":"A benchmark for a generative optimizer should evaluate the designs that the optimizer proposes. In scientific optimization, however, new measurements are often unavailable, and an optimizer is instead scored by Selecting from a pool of measured candidates or by Mapping its proposals to the nearest stored design. We ask whether these candidate-pool protocols preserve conclusions about prospective optimization. Across four materials benchmarks, larger search steps by large language model (LLM) optimizers are associated with fewer evaluations to reach the target region. In a controlled prompt experiment, a one-line instruction changes this reaching time without changing the underlying model. These observations motivate the trajectory-imprinting hypothesis: a pool can inherit geometric structure from the optimization runs that produced it. To test fidelity beyond the pool, we directly evaluate optimizer-proposed designs using physics-based simulations of planar MOSFETs and GaAs deposition. In GaAs deposition, Gaussian-process (GP) optimizers reach lower nonuniformity under Generation, whereas LLM optimizers reach the pool optimum first under Selection. Direct evaluation of mapped proposals reveals changes in measured-and-feasible status in 38.4% of MOSFET and 19.0% of deposition pairs. Among pairs feasible on both sides, mean projection credit is larger for GP optimizers than for LLM optimizers. We construct core-set pools from designs collected during previous optimization runs, keeping the initial design and the best candidate fixed. These pools have different measured geometric properties, but optimizer orderings under Selection still differ from those under Generation. Proxy fidelity must therefore be assessed for the optimizer set, pool, protocol, and metric rather than assumed from pool geometry alone.","keywords":"Large Language Models; Bayesian Optimization; Materials Optimization; Physics-Based Simulation; Benchmark","topics":["discovery","benchmarks"]},{"note_id":"xDewwIEoKL","number":"60345","title":"CrystalDLM: Feedback Learning of Periodic Diffusion Language Models for Crystal Generation","abstract":"Crystal generation requires compatible periodic arrangements of atoms, yet geometric validity alone does not guarantee physical quality. We introduce CrystalDLM, a framework built on pretrained masked diffusion language models whose conditional prediction supports both crystal construction and reference-conditioned reconstruction. A lattice-conditioned periodic head couples coordinate candidates in a tractable joint distribution, making periodic compatibility an intrinsic part of draft construction. After diffusion refinement, structured records linking reference structures, executed modifications, and their physical outcomes train a reconstruction diffusion language model to propose targeted replacements and a relative verifier to assess candidates against their references. This feedback stage turns physical evaluations into reusable supervision for subsequent structural decisions. Experiments on MP-20, Perov-5, and MPTS-52 demonstrate higher draft structural validity than existing language-model constructors. On MP-20, the complete framework achieves a stable, unique, and novel (S.U.N.) rate of 10.50\\%, with component comparisons showing that periodic construction improves structural validity under a common diffusion refiner while feedback learning further increases discovery yield.","keywords":"Material Generation; Crystal Generation; Diffusion Language Models; Diffusion Models","topics":["generation"]},{"note_id":"k0DQPiBjDy","number":"61137","title":"Beyond In-Domain Evaluation: Benchmarking Experimental Generalization in Disordered Crystal Generation","abstract":"Crystal generation models are commonly trained and evaluated on open databases that combine experimentally measured and computationally generated structures. This creates a distribution-shift blind spot: strong in-domain performance may reflect database fit rather than generalization to laboratory materials. We introduce Disorder-Bench, a multi-source benchmark for measuring experimental generalization in disordered crystal generation. It contains 91,704 structures from COD, ICSD, AMCSD, and Springer Materials, organized into positional, site, and mixed positional–site disorder. The benchmark provides a unified evaluation protocol covering structural and compositional validity, distributional fidelity, occupancy statistics, Wyckoff-site diversity, and space-group preservation. Across representative diffusion, flow-matching, equivariant, and language-model generators, models trained on COD degrade substantially when evaluated on experimentally curated sources. MatterGen reaches 69.5% overall validity, whereas CrystaLLM drops to 0.0%; mixed positional–site disorder is consistently the most challenging regime. Failure analysis identifies occupancy handling, multiplicity and space-group inconsistencies, and CIF representation errors as major sources of failure. Disorder-Bench provides a reproducible testbed for separating database fit from empirical fidelity in crystal generation.","keywords":"disorderd crystal structure generation; materials generation; benchmark; cross-domain evaluation; generative models","topics":["generation","benchmarks"]},{"note_id":"sonwIRt9hV","number":"61957","title":"AMHSTrafficLab: An Industrial Benchmark for Routing and Regional Traffic Control in Large-Scale Resource-Competitive Transport Networks","abstract":"In industrial settings, such as automated material handling systems (AMHS) in modern semiconductor manufacturing, transport networks must serve uneven, continuously arriving demand with large vehicle fleets and limited track space. Routing decisions interact with rules that control resource competition, including vehicle-following rules, right-of-way mechanisms, and regional admission control; together, they shape traffic flow and affect the risks of congestion, deadlock and throughput collapse. However, comparisons across industrial routing studies are difficult to reproduce when simulator implementations and accompanying control policies are incompletely documented. We introduce AMHSTrafficLab, an industrial benchmark for reproducibly evaluating and developing routing and regional traffic control in large-scale AMHS: it provides industrially grounded vehicle dynamics, track layouts, workloads, and standardized interfaces for classical, heuristic, and learning-based policies. Using the benchmark, we evaluate 13 routing methods across 7 fleet--workload scenarios and 3 regional-control settings. Our results show that without regional-control, the system deadlocks frequently regardless of the routing algorithm used, demonstrating that routing performance cannot be interpreted independently of the accompanying traffic-control policy. A proposed regional admission-control baseline reduces throughput-collapse runs from 265/910 to 9/910 and substantially suppresses local deadlocks. With regional control, we further compare different routing methods and find that learning-based methods do not consistently outperform congestion-aware heuristics, and their relative performance varies with workload and fleet density. These findings highlight the benchmark's value for evaluating routing and traffic control together and for developing future algorithms.","keywords":"industrial benchmark; multi-agent routing; traffic control; automated material handling systems; lifelong pickup and delivery; deadlock prevention; reinforcement learning.","topics":["other"]}]}</script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let bundle=JSON.parse($('paper-data').textContent),filter='all',query='',sort='original',page=1;
const pageSize=12;
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s??'').normalize('NFKC').toLowerCase();
function filtered(){const terms=normalize(query).trim().split(/\s+/).filter(Boolean);const result=bundle.records.filter(p=>(filter==='all'||(p.topics||[]).includes(filter))&&terms.every(t=>normalize([p.title,p.abstract,p.keywords,p.note_id].join(' ')).includes(t)));if(sort==='title')result.sort((a,b)=>a.title.localeCompare(b.title,'en'));if(sort==='number')result.sort((a,b)=>(Number(a.number)||0)-(Number(b.number)||0));return result;}
function card(p){const tags=(p.topics||[]).map(id=>bundle.taxonomy.categories.find(c=>c.id===id)).filter(Boolean).map(c=>`<span class="topic-tag">${escape(c.label)}</span>`).join('');const words=String(p.keywords||'').split(';').map(s=>s.trim()).filter(Boolean).slice(0,3).join(' · ');return `<article class="paper"><div class="paper-main"><h2 class="title">${escape(p.title)}</h2>${words?`<p class="keywords" title="${escape(p.keywords)}">${escape(words)}</p>`:''}${tags?`<div class="topic-tags">${tags}</div>`:''}<details class="abstract-toggle"><summary>Abstract</summary><p class="abstract">${escape(String(p.abstract||'No abstract provided.').replace(/\\n/g,'\n'))}</p><p class="full-keywords"><b>Keywords:</b> ${escape(p.keywords||'—')}</p></details></div><div class="links"><a class="pdf" href="https://openreview.net/pdf?id=${encodeURIComponent(p.note_id)}" target="_blank" rel="noopener noreferrer">PDF ↗</a><a class="openreview" href="https://openreview.net/forum?id=${encodeURIComponent(p.note_id)}" target="_blank" rel="noopener noreferrer">OpenReview ↗</a></div></article>`;}
function render(){$('total').textContent=bundle.records.length;const dt=new Date(bundle.generated_at);$('updated').textContent=Number.isNaN(dt.getTime())?'':new Intl.DateTimeFormat('en',{year:'numeric',month:'short',day:'numeric',timeZone:'Asia/Shanghai'}).format(dt);$('updated').dateTime=bundle.generated_at;const categories=[{id:'all',label:'All'},...bundle.taxonomy.categories.filter(c=>bundle.records.some(p=>(p.topics||[]).includes(c.id)))];$('filters').innerHTML=categories.map(c=>{const n=c.id==='all'?bundle.records.length:bundle.records.filter(p=>(p.topics||[]).includes(c.id)).length;return `<button class="filter${filter===c.id?' active':''}" data-filter="${escape(c.id)}" aria-pressed="${filter===c.id}">${escape(c.label)} <span>${n}</span></button>`;}).join('');const results=filtered(),pages=Math.max(1,Math.ceil(results.length/pageSize));page=Math.min(page,pages);$('count').textContent=`${results.length} results`;$('papers').innerHTML=results.length?results.slice((page-1)*pageSize,page*pageSize).map(card).join(''):'<div class="empty">No matching papers.<br><button class="button" id="reset-filter">Clear filters</button></div>';$('pager').hidden=results.length<=pageSize;$('page-label').textContent=`${page} / ${pages}`;$('prev').disabled=page===1;$('next').disabled=page===pages;}
function reset(){filter='all';query='';page=1;$('search').value='';render();}
function parseCSV(text){text=String(text).replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false,closed=false;const pushCell=()=>{row.push(cell);cell='';closed=false;};const pushRow=()=>{pushCell();if(row.some(v=>v!==''))rows.push(row);row=[];};for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else{quoted=false;closed=true;}}else cell+=c;continue;}if(c==='"'){if(cell||closed)throw Error('Invalid CSV quote');quoted=true;}else if(c===',')pushCell();else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;pushRow();}else{if(closed)throw Error('Unexpected content after CSV quote');cell+=c;}}if(quoted)throw Error('Unclosed CSV quote');if(cell||row.length||closed)pushRow();if(!rows.length)throw Error('Empty CSV');const headers=rows.shift().map(s=>s.trim());if(new Set(headers).size!==headers.length)throw Error('Duplicate CSV headers');for(const f of ['note_id','title','abstract','keywords'])if(!headers.includes(f))throw Error(`Missing column: ${f}`);const seen=new Set();return rows.map((r,i)=>{if(r.length!==headers.length)throw Error(`Invalid column count at row ${i+2}`);const obj=Object.fromEntries(headers.map((h,j)=>[h,r[j]]));const id=obj.note_id.trim();if(!/^[A-Za-z0-9_-]+$/.test(id)||seen.has(id))throw Error(`Invalid or duplicate note ID: ${id}`);seen.add(id);return {note_id:id,number:obj.number||'',title:obj.title,abstract:obj.abstract,keywords:obj.keywords,...(obj.topics?.trim()?{topics:obj.topics.split(';').map(s=>s.trim()).filter(Boolean)}:{})};});}
function applyRecords(records,name){const taxonomy=bundle.taxonomy,allowed=new Set(taxonomy.categories.map(c=>c.id));const next=records.map(p=>{const topics=p.topics||taxonomy.papers[p.note_id]||['uncategorized'];if(!Array.isArray(topics)||!topics.length||topics.some(t=>!allowed.has(t)))throw Error(`Unknown topic for ${p.note_id}`);return {...p,topics:[...new Set(topics)]};});bundle={schema_version:2,taxonomy,records:next,source_name:name,generated_at:new Date().toISOString()};reset();$('message').classList.remove('error');$('message').textContent=`Updated ${records.length} papers. Export HTML to save.`;}
function exportedHTML(){return '<!doctype html>\n'+document.documentElement.outerHTML.replace(/<script id="paper-data" type="application\/json">[\s\S]*?<\/script>/,()=>'<script id="paper-data" type="application/json">'+JSON.stringify(bundle).replace(/</g,'\\u003c')+'<\/script>');}
function downloadHTML(){const url=URL.createObjectURL(new Blob([exportedHTML()],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('search').addEventListener('input',e=>{query=e.target.value;page=1;render();});$('clear-search').addEventListener('click',reset);$('sort').addEventListener('change',e=>{sort=e.target.value;page=1;render();});$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;page=1;render();}});$('papers').addEventListener('click',e=>{if(e.target.id==='reset-filter')reset();});$('prev').addEventListener('click',()=>{page--;render();$('papers').scrollIntoView({block:'start'});});$('next').addEventListener('click',()=>{page++;render();$('papers').scrollIntoView({block:'start'});});$('choose-csv').addEventListener('click',()=>$('csv-input').click());$('csv-input').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>8*1024*1024)throw Error('CSV exceeds 8 MiB');applyRecords(parseCSV(await f.text()),f.name);}catch(error){$('message').classList.add('error');$('message').textContent=error.message;}finally{e.target.value='';}});$('export-html').addEventListener('click',downloadHTML);
window.PaperGuide=Object.freeze({parseCSV,applyRecords,exportedHTML,getState:()=>({bundle,filter,query,page,filtered:filtered()})});render();
})();
</script>
