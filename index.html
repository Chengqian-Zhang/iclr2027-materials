ge this gap, we introduce CrystalGPD (Crystal Generation, Prediction, and Design), a unified benchmark for characterizing crystal LLM capability boundaries across de novo generation, crystal structure prediction, composition- and symmetry-constrained design, and symmetry-constrained design.\nCrystalGPD preserves native model interfaces while standardizing task instances, generation protocols, representation-specific parsing, and downstream evaluation.\nOur evaluation reveals recurring limitations in jointly achieving physical feasibility and novelty, maintaining validity and structural recovery as complexity increases, satisfying exact crystallographic symmetry, and generalizing from MP20 to MP52.\nIn particular, composition is preserved more reliably than exact symmetry, and symmetry controllability degrades for lower-frequency space groups.\nMotivated by these findings, we further study CrystalReAct, a benchmark-driven agentic case study that provides on-demand crystallographic knowledge and verification during generation.\nCrystalReAct substantially improves physical validity and crystallographic constraint satisfaction, demonstrating that external knowledge can alleviate several limitations exposed by CrystalGPD.\nTogether, CrystalGPD provides a unified framework for evaluating crystal LLMs and, more importantly, a systematic characterization of where their current capabilities succeed and break down, providing actionable guidance for developing more reliable crystal-generation systems.\nAnonymous code is available at https://anonymous.4open.science/r/CrystalGPD.","keywords":"Crystal Structure Generation; Large Language Model","topics":["generation","benchmarks"]},{"note_id":"M961fLpERN","number":"18923","title":"F2: Offline Reinforcement Learning for Hamiltonian Simulation via Free-Fermionic Subroutine Compilation","abstract":"Compiling shallow and accurate quantum circuits for Hamiltonian simulation is challenging due to hardware constraints and the combinatorial complexity of minimizing gate count and circuit depth. Existing compilers rely on hand-engineered heuristics and cannot adapt to input-dependent structure, limiting optimization opportunities. We introduce F2, an offline reinforcement learning framework that exploits free-fermionic structure for quantum simulation. Across benchmarks spanning lattice models, protein fragments, and crystalline materials (12–222 qubits), F2—using a single trained model—reduces $R_Z$ count by 28.8\\% on average relative to strong industry and academic baselines (IBM Qiskit, Google Cirq/OpenFermion, Berkeley BQSKit), while maintaining errors on the order of $10^{-7}$. These results demonstrate that aligning reinforcement learning with algebraic structure can substantially improve scalable quantum circuit synthesis.","keywords":"Quantum Computing; Reinforcement Learning; Drug Discovery; Material Discovery","topics":["other"]},{"note_id":"JxQbLU2EiN","number":"18924","title":"The Steering Budget: Examples beat Knobs","abstract":"Generative models are steered by turning knobs — prompts, guidance scales — but every knob saturates: push it far enough and it stops moving the property you care about. This ceiling is a budget fixed by the training data before the model exists — no knob can push past it. We introduce showing, which reaches any value the whole budget allows, not just what a knob can reach, by partitioning outputs into easy-to-compute bins, auditing each, and combining bins in the proportions needed. This audit makes the split exact: a target property's variance divides into a within-bin part (telling's reach) and a between-bin part (showing's reach), both computable from data alone, before a model exists. A second, model-facing diagnostic then confirms this split carries over to a trained model: on crystals, it correctly forecasts the carry-over order of three properties before the model was ever audited. Across two unrelated domains — image and crystal-structure generation — showing out-reaches the strongest knob baselines we could build by 4.8-26x on crystal properties and 3x on image targets, with no fine-tuning: only a different choice of examples. The same two numbers also say, in advance, when telling remains the better choice. Given showing wins, a property's curvature determines the shape of the fix: concentrate on one bin for an average goal, spread across bins for coverage. Showing further brings expressiveness a knob cannot: because the specification lives in the examples, it can steer toward a target recognized but never named.","keywords":"steerable generative models; controllable generation; exemplar-based conditioning; in-context learning; diffusion models; classifier-free guidance; crystal structure generation; mode collapse and diversity","topics":["generation"]},{"note_id":"uIO57iRdYr","number":"19237","title":"Where Should Physics Enter a Molecular Crystal Generator?","abstract":"Generative models make molecular crystal structure prediction fast, but their samples still exhibit geometric and packing violations. Physics can be introduced during training, post-training, or inference, yet these choices are rarely compared with the generator and physical signal held fixed. We introduce CrystAF, an all-atom crystal flow-map generation model, and use it with the UMA interatomic potential to systematically study where physics should enter. Post-training learns physical preferences directly into CrystAF, improving molecular validity and crystal packing while leaving sampling unchanged: physics is paid for once during training rather than repeatedly at deployment. In contrast, UMA relaxation is effective at repairing local clashes but makes generation 6--26$\\times$ slower, while learning from relaxed targets provides little benefit. These routes are complementary rather than competing. Physics-informed post-training first shifts the generated distribution toward more physically reasonable structures, after which inexpensive inference-time corrections further remove clashes and restore stereochemistry that the generator cannot represent. Importantly, the same post-training strategy also improves the multi-step all-atom Clari-M and rigid-body MolCrystalFlow generators, demonstrating transfer across architectures and representations. Together, our results suggest a simple principle: learn reusable physical alignment into the generator, and reserve inference-time physics for residual constraints that are better corrected than learned.","keywords":"MeanFlow; Drug; Generation Models; Reinforcement Learning; AI for Science","topics":["generation"]},{"note_id":"DoRDFC1Iwg","number":"19413","title":"TritonDFT: An Agentic Framework and Benchmark for Automated DFT Workflows","abstract":"Density Functional Theory (DFT) is a cornerstone of materials science, yet executing DFT in practice requires coordinating a complex, multi-step workflow. Existing tools and LLM-based solutions automate parts of the steps, but lack support for full workflow automation, diverse task adaptation, and accuracy–cost trade-off optimization in DFT parameter choices. To this end, we present TritonDFT, an agentic framework adopting an expert-curated, extensible workflow design, with Pareto-aware parameter inference and automated parallelization, to enable efficient and accurate DFT execution. We further introduce DFTBench, a benchmark for evaluating the agent's multi-dimensional capabilities, spanning accuracy-cost trade-off optimization, high-performance computing  knowledge, and monetary cost efficiency. Our code and benchmark suite can be found at https://anonymous.4open.science/r/TritonDFT-43C7/.","keywords":"AI for Science; Material Science; LLM Agent; DFT; Scientific Benchmark","topics":["electronic","discovery"]},{"note_id":"f9WALAgwxY","number":"19436","title":"Physical-Field-Bridged Material Parameter Inference from Multi-View Deformation Videos","abstract":"Estimating simulation-ready material parameters from visual observations is crucial for deformable-object manipulation, yet remains challenging because material properties are only indirectly expressed through physical responses such as contact, deformation, recovery, and stress concentration. We introduce \\emph{physical-field-bridged material inference}, a single-pass framework that treats dense physical responses as intermediate evidence between RGB deformation videos and a discrete constitutive type together with continuous material parameters. This design addresses a practical limitation of existing inverse-physics methods, which often rely on per-scene reconstruction, online tuning, or simulation-in-the-loop optimization, while feed-forward visual estimators can exploit appearance or category shortcuts. Given multi-view RGB videos, our model predicts force/contact masks, projected motion-flow fields, and projected stress-response maps, then conditions constitutive-type classification and parameter regression on these fields. To train and evaluate this formulation, we construct \\textbf{DeformFieldBench}, a 3DGS--MPM learning environment with 5,000 simulations over 100 object shapes, five mechanically informative loading modes, and dense pixel-aligned physical supervision. Our method achieves the best median errors on all four continuous parameters, raises stress-hotspot recall from 0.0762 to 0.5121, and reaches 0.8676 SSIM/36.82 dB PSNR in same-simulator replay on unseen objects. Under a protocol-matched GSO evaluation, it performs inference and future-state prediction in approximately 30 seconds rather than the 15--120 minutes required by per-scene optimization; it also produces measurable replay agreement on five real-world sequences. These results support dense physical fields as an effective bridge for fast material inference, while cross-simulator and real-world tests expose remaining domain and identifiability gaps. The dataset is anonymously released at https://www.kaggle.com/datasets/anonymous336/physical-field-material-parameter-5000","keywords":"Deformable Object Material Inference; Dense Physical Field Supervision; Feed-forward Inverse Physics; 3D Gaussian Splatting and Material Point Method Simulation","topics":["mechanics","graphics"]},{"note_id":"9HErabu14l","number":"19662","title":"The Underdetermined Stream: What a Single-Gold Score Actually Measures on Contested Material","abstract":"Benchmarks for mathematical reasoning compare a model's answer with a single gold string, and on material where several forms of the same answer are equally correct that comparison is measuring something other than capability. The field treats the mismatch as a data-quality bug for a better normaliser to repair, which presupposes that one of the two golds is wrong; when both are correct there is nothing to fix, and what the score measures instead has never been derived. The obvious remedy — publish a correction factor beside the score — presupposes that the multiplier is a property of the corpus, and latent-variable estimators of a hidden true label cannot price their own error. We derive the identity: an exact-match score on contested material is capability multiplied by the rate at which the model writes the one form this corpus shipped as gold, a product whose second factor belongs to the model-corpus pair rather than to either alone. Capability is nonetheless exactly recoverable without retraining, by scoring the same generations against each convention's gold in turn and summing, under two premises that are measured rather than assumed. On four arms of one corpus differing only in the order training data reached the optimiser, capability holds inside the 0.0270 measurement floor while the allocation moves 0.4621 — the policy at F=612.18 against the capability sum's 1.63 — so a single-gold benchmark reports the same capability 4.75x apart depending only on how the model was taught to write. The estimator returns an estimated capability of 0.4452 against a directly measured 0.4522, and that 0.0070 gap is exactly the support leak the identity predicts (0.00705), so its error is always downward and always priced by a quantity the same run reports. The correction-factor shortcut is registered, run and rejected: the model's policy correlates with per-item solvability at r=-0.257 on 24 of 24 arms, so the multiplier is a property of the model as well, and the effective enumeration it hides runs 1.149 to 1.811. The rule is to publish the summed score, which costs extra scoring passes over generations already produced and no new training.","keywords":"evaluation methodology; benchmark evaluation; exact match; answer equivalence; construct validity; measurement theory; mathematical reasoning; capability estimation; pre-registration; underdetermination","topics":["other"]},{"note_id":"oHyVTHnPte","number":"20597","title":"Developing a Crystal Structure Prediction Algorithm with Agent-Guided Search","abstract":"Language-model agents show promise for machine learning research, but evidence that agent-guided research can advance the state of the art on established tasks remains limited. We investigate this possibility in crystal structure prediction (CSP), a central task in materials discovery that combines affordable experimentation with a comparatively underexplored generative modeling landscape. An agent-guided search explores eighteen generative framework--architecture pairs and identifies masked generative modeling as the strongest approach under the initial training budget. Subsequent experimentation, combined with four targeted human interventions, produces MaskGXT, a masked generative crystal transformer that jointly predicts crystallographic symmetry, lattice parameters, and atomic coordinates. MaskGXT incorporates circular ordinal label smoothing, sub-bin coordinate refinement, and space-group-stratified sampling to address periodic geometry, coordinate precision, and polymorph coverage. Our experiments show that MaskGXT achieves the highest match rates compared to an extensive set of CSP baselines on MP-20 and MPTS-52 benchmarks.","keywords":"Crystal generative model; Crystal structure prediction; AI-guided search; generative model; masked diffusion model","topics":["generation","discovery"]},{"note_id":"iYPGjL79Qx","number":"20726","title":"Packora: Systematic Design for Generative Molecular Crystal Structure Prediction","abstract":"Molecular crystal structure prediction (CSP) is important in pharmaceuticals, agrochemicals, and organic electronics, where subtle differences in molecular conformation and packing can strongly affect material properties. \nWe present Packora, a generative model for molecular CSP that jointly predicts atomic coordinates and the lattice from molecular graphs. To accommodate diverse crystal compositions and available structural information,  Packora offers greater conditioning flexibility than existing approaches, accepting any subset of molecular conformers, stereochemical labels, and space-group information while supporting multi-component and organometallic crystals. Beyond this conditioning flexibility, Packora integrates effective design choices for atomistic generative modeling: cacheable pairwise refinement, effective training objectives and numerical solvers, conditioning dropout, and balanced scaling of pairwise and single representations. We also report systematic studies of architecture, training, conditioning, inference, and scaling that we conducted to make the design choices. Finally, we introduce a new evaluation suite for generative molecular CSP that separates generation and ranking, following the CCDC CSP blind test protocol. Packora outperforms baselines in both settings, achieving the highest coverage across all six generation benchmarks, higher experimental-form recovery, lower experimental-form ranks, and faster convergence in ranking.","keywords":"generative models; molecular crystals; material discovery; crystal structure prediction","topics":["generation"]},{"note_id":"31xyfNbQlw","number":"21492","title":"MorphTwin: Discovering and Morphing Material Responses from Videos for Interactive Physical Twins","abstract":"Reconstructing interactive physical twins from videos holds promise for virtual reality and embodied intelligence, but existing methods face a trade-off among simulation efficiency, material modeling accuracy, and explicit material control. Spring-mass models support efficient explicit simulation through simple discrete structures, providing an attractive foundation for real-time, interactive physical twins. However, their native spring parameters depend on graph structure, hindering cross-object reuse, while bulk-shear coupling in conventional central-force springs limits material expressiveness. Our key insight is to represent material behavior through standardized responses to volume and shape changes, separating a reusable material description from differences in spring geometry and connectivity across objects. Based on this insight, we propose **MorphTwin**, which augments explicit spring graphs with internally relaxable response carriers and performs offline energy calibration to compile shared material-response changes into graph-specific stiffness adjustments. This design supports material identification, interpretable editing, and cross-graph reuse while retaining efficient explicit dynamics. On synthetic scenes with known material parameters, MorphTwin reduces the mean absolute Poisson-ratio error and mean relative Young's-modulus error by 75.8% and 22.1%, respectively, compared with PhysTwin under the same inverse protocol. Real-world video experiments demonstrate improved reconstruction and future prediction and support reconstructing interactive physical twins from egocentric observations. With offline material calibration, online rollout advances the calibrated explicit spring graph without material identification or calibration optimization, preserving the real-time interaction capabilities of explicit spring-mass methods.","keywords":"Physical Twins; Physics-Based Simulation; Interactive World Models; Physics-Informed Methods","topics":["mechanics","graphics"]},{"note_id":"jzk6dJLzb6","number":"21502","title":"StrainPair: Learning Elastic Response in Pretrained Interatomic Potentials","abstract":"Elastic moduli measure how stress changes under deformation. Yet interatomic potentials are typically fine-tuned to match stresses one configuration at a time. We find that these two objectives can diverge: an adapted potential can predict elastic moduli more accurately even as its common stress-offset error increases. Motivated by this distinction, we introduce StrainPair, which augments conventional fine-tuning with a simple paired loss that matches stress differences between deformations of the same material. The loss uses existing labels and leaves the potential architecture and inference procedure unchanged. In our evaluation, StrainPair reduces shear- and bulk-modulus errors by 20.00\\% and 17.52\\% over matched pointwise fine-tuning across 10,987 materials. Three-seed experiments on 224 external materials confirm the gains. Stronger pointwise supervision, cross-material pairing, and affine output calibration do not recover the same improvements. Instead, the gains accompany a reduction in deformation-response error, despite larger common stress offsets. Our analysis explains this separation: stress differences cancel shared offsets and constrain variation along deformation paths. These results identify response accuracy as a distinct target for adapting pretrained potentials. They also reveal a tradeoff: better elasticity does not necessarily preserve energy, force, and stress accuracy on other configurations.","keywords":"pretrained interatomic potentials; fine-tuning; paired supervision; elastic properties; materials machine learning","topics":["properties","potentials","mechanics"]},{"note_id":"OZNDo04U7I","number":"22293","title":"LEAP-Bench: Turning Raw Data into Scientific Claims","abstract":"Scientific discovery depends on turning raw experimental data into defensible claims through quantitative analysis and physical interpretation. Whether AI agents can carry out this process reliably remains unclear. We introduce LEAP-Bench, a benchmark of end-to-end experimental analysis in materials science. We construct 64 tasks from 12 papers spanning multiple instrument modalities, each task targeting a central scientific claim. Agents analyze raw experimental files without seeing the papers' conclusions or procedures. Using reference answers from the source papers, 475 questions assess whether agents extract the required quantities, correctly reason through the analysis, and justify their scientific conclusions. Across three evaluation rounds, Claude Code with Opus~5 achieves the highest task success rate among the six evaluated agents, at $59.4\\%\\pm7.2\\%$ (mean $\\pm$ standard deviation). Even when agents correctly answer questions about numerical results and intermediate reasoning, their scientific interpretations can remain incomplete. Twelve tasks remain unsolved by all six agents across all three rounds, including eight requiring model fitting or comparison across measurements. These findings highlight persistent difficulties in completing experimental analyses and connecting the results to scientific conclusions. By evaluating the reasoning from experimental data to scientific claims, LEAP-Bench provides a basis for training AI co-scientists with feedback on their numerical estimates, analytical reasoning, and physical interpretations.","keywords":"benchmark; coding agents; scientific reasoning; raw instrument data;  materials science; agent benchmark; experimental analysis;  autonomous discovery; LLM agents","topics":["discovery","characterization","benchmarks"]},{"note_id":"DMJ4oD8MJ8","number":"22682","title":"FamilySpace: From Emergent Chemical Semantics to Controllable Crystal Generation","abstract":"Latent crystal generative models typically combine a variational autoencoder (VAE) for learning atom-wise representations with a flow model that transports a simple source distribution to the learned latent distribution. However, previous studies have mainly focused on the quality of generated crystals, leaving the structure and generative utility of the atom-wise latent space largely unexplored. \nIn this work, we show that even a vanilla crystal VAE implicitly organizes atom-wise latent representations according to elemental families, with different families occupying largely separated regions of the latent space. We term this phenomenon emergent chemical semantics. This structure suggests that sampling from a family-specific latent region can bias the decoder toward atoms from the corresponding elemental family. Building on this insight, we propose FamilySpace, a framework for controlling the elemental-family composition of generated crystals. FamilySpace assigns each elemental family a distinct source component, forming a family-indexed multi-source distribution, and trains a flow model using source-target pairs matched by family. In inference, a user-specified family template selects the source component for each atom-wise representation, enabling direct control over the family composition of generated crystals. Experiments on MP-20 and MPTS-52 show that FamilySpace achieves competitive crystal-generation performance while matching prescribed elemental-family compositions. Moreover, selected family templates increase the fraction of generated crystals predicted to be stable or metastable, demonstrating that latent-space composition control can support targeted exploration of promising chemical regions without additional optimization techniques such as reinforcement learning.","keywords":"Controllable crystal generation; Emergent chemical semantics; Crystal variational autoencoder","topics":["generation"]},{"note_id":"tijcxSftsc","number":"22827","title":"RECOB: Reliable Benchmarking of Experimental Optimization in Chemistry and Materials Science","abstract":"Optimization methods for experimental science are often evaluated on synthetic functions that are reproducible but omit important characteristics of real experiments. We introduce RECOB (REliable Chem Optimization Benchmark), a black-box optimization benchmark constructed exclusively from data generated through physical experiments in chemistry and materials science. The suite contains 14 single-objective and two multi-objective tasks spanning chemical reactions, material formulations, electrochemical systems, continuous-flow processes, and automated laboratories. Each task provides a machine-readable specification of its decision variables, feasible domain, physical constraints, objective direction, and experimental provenance. Continuously queryable learned oracles are screened using repeated holdout validation and prespecified admission criteria, while measured-table replay enables evaluation using the original experimental responses. Under a common paired evaluation protocol, we compare ten single-objective and eight multi-objective optimization methods. HEBO achieves the best aggregate single-objective rank, while qNEHVI leads the multi-objective comparison. Model-based methods generally outperform non-adaptive baselines, although their computational overhead varies substantially. We further assess benchmark reliability using independent oracle retraining and measured-table replay. Aggregate optimizer rankings remain highly consistent across retrained oracles, while replay preserves the broad performance hierarchy using only physically measured responses. Together, these results show that RECOB can reproducibly distinguish optimizer performance as an experimentally grounded and reliability-tested benchmark for black-box optimization in chemistry and materials science.","keywords":"Optimization; Benchmarking; AI for science; Surrogate modeling; Reproducibility","topics":["discovery","synthesis","benchmarks"]},{"note_id":"OgdYVTkpVM","number":"22834","title":"Tego: Symmetry‑Preserving Local Editing for Targeted Inorganic Materials Design","abstract":"The inverse design of inorganic crystalline materials is generally regarded as an end-to-end, property-to-structure generation task, giving rise to a series of *ab initio* methods such as diffusion models. However, such methods overlook an inherent contradiction at the information level: properties can be viewed as a lossy compressed representation of structures, and the property-to-structure mapping follows a one-to-many non-functional relation. Reconstructing complete structures merely from properties constraints essentially attempts to recover high-dimensional full structural information from low-dimensional lossy representations, which inherently suffers from the theoretical bound of information asymmetry and constrains the structural stability and property accuracy of outputs from ab initio methods.  To address these challenges, we propose the **Tiny-Edit-Good-Outcome (Tego)** framework. Tego initiates inference from an existing stable structure, thereby performing localized inverse editing to approximate target material properties, circumventing the complexity of full structure reconstruction in *ab initio* methods. Evaluations demonstrate that Tego is capable of generating undiscovered, thermodynamically stable crystalline candidates, while achieving higher property achievement rate and computational efficiency across material inverse design scenarios.","keywords":"crystal inverse design; materials informatics; large language model; local structure editing; material property optimization; inorganic crystals","topics":["generation"]},{"note_id":"fmxPpZ81S0","number":"22938","title":"Adaptive LLM-Diffusion Integration for Robust Crystal Generation","abstract":"Text-guided generative models have shown strong promise for crystal generation by incorporating natural-language metadata into the generative process to produce valid and stable materials conditioned on textual descriptions. However, they have some inherent limitations: their LLM backbones are sensitive to the ordering of conditions within the prompt, the LLM and generative model are coupled through a fixed, sample-agnostic diffusion timestep $\\tau$, and their effectiveness has largely been demonstrated using only a limited set of LLM architectures. In this work, we introduce \\our{}, a robust and adaptive LLM-diffusion framework for crystal generation. First, we improve robustness to prompt ordering through order-invariant training augmentation and auxiliary condition-specific objectives that encourage consistent generation across different permutations of the conditioning information. Second, we replace the fixed diffusion timestep with a lightweight per-sample policy network $\\pi_\\phi$ that adaptively determines the amount of diffusion refinement required for each LLM-generated structure.  Finally, we benchmark \\our{} across a diverse collection of open-source LLMs spanning multiple model families and scales, and observe that \\our{}, across all backbones, consistently outperforms existing baselines in generating valid, novel, and stable materials, providing a broad assessment of the generality and robustness of LLM-diffusion integration for crystal generation.","keywords":"ML4Materials; LLMs; Diffusion Models; Crystal Materials; Material Generation; AI4Science","topics":["generation"]},{"note_id":"PC9VcIgdvQ","number":"23337","title":"Same Scene, Different Decisions: Material Sensitivity in Embodied Models","abstract":"Embodied models must connect visual appearance to task-relevant decisions. We study their material sensitivity: how those decisions change when scene geometry is retained but materials are converted to a different representation. In 99 paired navigation episodes, success falls from 52.5% to 48.5%, yet 30 episodes change success status: gains and losses largely cancel in the average. We investigate this hidden turnover through paired visual grounding and navigation experiments. A readout study across six vision-language model configurations separates localization from response-format and coordinate-scale effects. Controlled two-view tests then require models to follow a queried object across positions, and target-window crossovers reveal that changes to the target and its surroundings can shift grounding in opposite directions. In navigation, 17 previously successful episodes fail while 13 previously failed episodes succeed under converted materials. These results put the identity of successful decisions alongside mean accuracy as a central object of evaluation. Material representation is therefore more than an asset-format choice: it is an input variable through which we can study the visual dependence of embodied models.","keywords":"vision-language models; visual grounding; embodied navigation; material sensitivity; material conversion; controlled visual interventions","topics":["graphics"]},{"note_id":"yPJOOg0yaD","number":"23722","title":"FieldForge: A Pretraining and Post-Training Framework for Flow-Based Crystal Generation","abstract":"Generating thermodynamically competitive crystals while retaining novelty remains a central challenge in materials discovery. To address this challenge, we present FieldForge, a flow-based training framework that unifies pretraining (PT), supervised fine-tuning (SFT), and reinforcement learning (RL) within a single crystal generator. Pretraining combines a Transformer supporting variable atom counts with flow matching, while respecting crystal geometry throughout the generative process. SFT then adapts the pretrained generative distribution through controlled data selection, preparing the generator for RL without introducing additional training structures. RL uses a GRPO-inspired critic-free policy update to refine the same velocity field using stability, novelty, and diversity rewards, with stability estimates provided by an interatomic potential. On the MP-20 track of LeMat-GenBench, the pretrained FieldForge model achieves state-of-the-art stable-unique-novel (SUN) and metastable-unique-novel (MSUN) rates, combining thermodynamic quality with uniqueness and novelty. SFT followed by RL further improves generation performance on both MP-20 and Alex-MP-20, demonstrating the effectiveness of the complete training framework.","keywords":"Crystal Generation; Flow Matching; Pretraining; Post-Training; Reinforcement Learning; Materials Discovery","topics":["generation"]},{"note_id":"htgw3ZGZ3b","number":"23872","title":"Representations from Pretrained Machine-Learning Interatomic Potentials as Coarse Coordinates for Material Generation and Evaluation","abstract":"Generative machine learning is increasingly tested for inorganic materials generation. Most models and the corresponding evaluation approaches thereby rely on simple forms of crystal structure representations. In this paper, we showcase the power of integrating atom-averaged features from pretrained Machine-Learning Interatomic Potentials (MLIPs), such as MACE, into these tasks. We first introduce the Coarse-Fine Transport Distance (CFTD), a distance measure that captures both quality and novelty of materials created with generative models in a single distribution-based evaluation framework. It uses two different featurizers, directly deriving the quality component from coarse MACE representations. We showcase CFTD's versatility in capturing crystal structure quality while also detecting memorization and compare it with the recently introduced continuous SUN metrics. We further illustrate the power of MLIP representations by directly adding them to the generation process itself and show that coarse MACE features can be used as helpful guidance for a material generative model.","keywords":"Machine Learning Interatomic Potentials; Materials Generation; Generative Models; Optimal Transport","topics":["generation","potentials"]},{"note_id":"UEs5jAGDGR","number":"23999","title":"Average Accuracy Does Not Certify Topology in Learned Hamiltonians","abstract":"Learned electronic Hamiltonians are commonly evaluated by errors in matrix\nelements, band energies, or occupied subspaces, but when do these metrics\ncertify topology?  We show that no strictly positive finite-\\(p\\)\nintegrated-error threshold universally certifies topology over unrestricted\nsmooth gapped families: a topology-changing discrepancy can be confined to\narbitrarily small support while retaining finite pointwise amplitude.\nConversely, topologically distinct, well-defined rank-\\(r\\) occupied bundles\nmust attain subspace infidelity at least \\(1/r\\) somewhere, motivating\nuniform, gap-aware control.  Learned four-band models realize this mismatch:\nlower band MAE ranks a family with \\(0/15\\) correct topologies ahead of one\nwith \\(15/15\\) correct.  In realistic settings, a structured perturbation\nchanges the Chern number of a \\(32\\)-orbital NaRuO$_2$ Wannier Hamiltonian at\n\\(8.074\\) meV near-Fermi band MAE, while a released neural Hamiltonian\nundergoes gap collapse that invalidates a raw topological comparison.\nEqual-budget loop-structured sampling shows no stable advantage.  In an\nexploratory \\(10\\)-meV band-matched study, all \\(276\\) evaluations valid at\nboth endpoints preserve topology, and no target-valid plane becomes newly\nunsafe.  Together, these results expose a certification gap between predictive\naccuracy and topological fidelity without implying that such failures are\nprevalent under generic small spectral perturbations.","keywords":"learned electronic Hamiltonians; topological fidelity; topology certification; electronic structure; topological materials; occupied subspaces; Chern and Z2 invariants","topics":["electronic"]},{"note_id":"321sdPH4RF","number":"24017","title":"Tuning Multimodal Large Language Model for Microstructure Generation","abstract":"Although 3D material microstructure generation has achieved notable progress, existing works typically rely on domain-specific constraints, leaving research oriented to natural languages largely unexplored. Inspired by the recent success of Large Language Models (LLMs) across diverse domains, this work introduces a multi-conditional generation framework that supports text-, sketch-, and property-driven microstructure design. The proposed method employs a Vector Quantized Variational AutoEncoder (VQ-VAE) to encode microstructural representations and a visual encoder to process sketches, allowing multi-modal alignment between text, sketch and structure within an LLM-based architecture. Moreover, to ensure that the generated microstructures satisfy desired physical properties, property constraints are incorporated into the optimization process. Experimental results demonstrate that the proposed framework can produce high-quality and semantically consistent microstructures, suggesting its potential to support more intuitive and accessible microstructure design workflows.","keywords":"3D material generation; microstructure generation; text-to-microstructure","topics":["characterization","mechanics"]},{"note_id":"b84aSfg9eC","number":"24235","title":"CrystalSAE: Interpreting and Steering Crystal Diffusion Models through Sparse Autoencoders","abstract":"Crystal diffusion models perform well in crystal structure prediction, but their internal representations remain poorly understood.\nTo improve model interpretability and inform controllable generation, we propose CrystalSAE, a sparse autoencoder (SAE) framework for identifying and probing crystallographic features in crystal diffusion models.\nSpecifically, we apply SAEs to the layer-wise residual updates of DiffCSP, a typical crystal diffusion model, and relate the resulting feature activations to crystallographic concepts.\nWe then intervene along selected feature directions to examine their influence on generation.\nExtensive experiments on MP-20 dataset confirm that sparse features selected on training data retain statistically significant associations with 17 crystallographic concepts on held-out data.\nCrystal visualizations further illustrate associations between selected features and 68 space groups.\nMoreover, our intervention experiments show that stronger perturbations of selected features produce larger average changes in the lattice parameters and density of generated crystals.\nThese findings reveal crystallographically aligned features within DiffCSP and suggest a path toward more interpretable and controllable crystal generation.","keywords":"sparse autoencoders; crystal structure prediction; diffusion models; mechanistic interpretability; concept discovery; causal steering","topics":["generation"]},{"note_id":"jmfv0Ppl8R","number":"24717","title":"Stepwise Refinement and Label-Free Error Ranking for Kohn–Sham Hamiltonians","abstract":"Machine-learned Kohn–Sham Hamiltonians can bypass costly self-consistent density functional theory (DFT) calculations, but their practical use requires identifying predictions with large errors that should be recomputed with DFT. In this work, we introduce HIVE (Hamiltonian Iterative Velocity Estimator), an equivariant Hamiltonian prediction model that also provides an error ranking at no additional cost. During training, the model sees one randomly sampled point on a deterministic path from zero to the target Hamiltonian. At inference, we repeatedly apply the same field to its evolving Hamiltonian prediction, a process we call the rollout. With this strategy, averaging the stepwise estimates gives the final Hamiltonian, while their dispersion provides a label-free score for ranking likely failures without additional evaluations beyond the rollout. We test HIVE across four periodic benchmarks with PBE and HSE06 labels, and the results improve the best reported Hamiltonian mean absolute error on three and match it on the fourth. More steps improve accuracy without retraining, mainly because the finer rollout produces better estimates rather than because averaging cancels noise. On newly DFT-labelled structural shifts, the dispersion ranks per-structure error with Spearman correlations of 0.98–0.99 across all three PBE systems. Overall, HIVE provides both an accurate Hamiltonian prediction and a practical uncertainty signal without training a separate model.","keywords":"Hamiltonian prediction; equivariant neural networks; density functional theory; uncertainty quantification; error ranking; neural ODE; self-ensembling; materials science","topics":["electronic"]},{"note_id":"YjEs9V0ZlJ","number":"25773","title":"MiAD: Mirage Atom Diffusion for De Novo Crystal Generation","abstract":"In recent years, diffusion-based models have demonstrated exceptional performance in searching for simultaneously stable, unique, and novel (S.U.N.) crystalline materials. \nHowever, most of these models don't have the ability to change the number of atoms in the crystal during the generation process, which limits the variability of model sampling trajectories. \nIn this paper, we demonstrate the severity of this restriction and introduce a simple yet powerful technique, mirage infusion, which enables diffusion models to change the state of the atoms that make up the crystal from existent to non-existent (mirage) and vice versa. \nWe show that this technique improves model quality by up to $\\times2.5$ compared to the same model without this modification. \nMirage infusion also improves MatterGen and FlowMM, suggesting that the benefits are not limited to a single generative architecture. \nThe resulting model, Mirage Atom Diffusion (MiAD), is an equivariant joint diffusion model for de novo crystal generation that is capable of altering the number of atoms during the generation process. \nMiAD achieves an $8.2\\%$ DFT S.U.N. rate on MP-20 under our evaluation protocol, the highest among the models in Table-1.","keywords":"diffusion models; de novo crystal generation; generative models; material science; deep learning","topics":["generation"]},{"note_id":"rP59823YbY","number":"25801","title":"GEMBench: Separating Distribution Matching from Discovery in Crystal Generation","abstract":"Generative models for crystals can serve two distinct aims: reproducing the distribution embodied in the training dataset, or discovering new stable materials beyond it.\nClassical generative metrics (Fr\\'echet distances, kernel MMD, and related feature-space distances) evaluate only the first aim, while widely used S.U.N.-style metrics (fraction of stable, unique, and novel structures) are often reported as discovery progress without declaring the discovery aim.\nWe make this split explicit as the *generative discovery dilemma*: the two aims share the same notion of stability, yet prescribe different optimal output distributions, so evaluation must declare the aim.\nWe then introduce GEMBench (Generative Evaluation for Materials), which scores the two aims separately as $\\mathrm{GEM}\\text{-}\\mathrm{match}$ and $\\mathrm{GEM}\\text{-}\\mathrm{disc}$ under explicit choices of stability probe and crystal-similarity measure.\nA shared multi-probe stability panel (energy above hull, phonon, and finite-temperature checks) replaces the single energy-above-hull bit used by S.U.N.-style metrics.\nBoth scores exclude near-duplicates of training-set crystals to avoid rewarding memorization. Beyond that, $\\mathrm{GEM}\\text{-}\\mathrm{match}$ rewards dataset-like distributional shapes, while $\\mathrm{GEM}\\text{-}\\mathrm{disc}$ rewards a large and diverse set of stable structures.\nOn public generators trained on MP-20, $\\mathrm{GEM}\\text{-}\\mathrm{match}$, $\\mathrm{GEM}\\text{-}\\mathrm{disc}$, and CHGNet S.U.N. rank the same models differently.\nWhich generator leads depends on the declared aim and on how crystal similarity is defined.\nIn particular, the CHGNet S.U.N. leader ranks last on $\\mathrm{GEM}\\text{-}\\mathrm{disc}$, because it concentrates on a few modes of the crystal space rather than discovering many distinct crystals.","keywords":"crystal generation; materials discovery; benchmarks; generative model evaluation; distribution matching; novelty; structural stability","topics":["generation","benchmarks"]},{"note_id":"KPWdoJitkL","number":"26457","title":"Reliability-Aware Constitutive Learning for Materials Discovery","abstract":"Accurate characterization of material behavior at elevated temperatures is essential for engineering design but remains costly and time-consuming due to the extensive experimental testing required across multiple thermo-mechanical conditions. Recent advances in high-throughput mechanical testing workflows coupled with machine learning have enabled rapid prediction of stress-strain behavior from limited experimental measurements. However, existing approaches often lack interpretability and reliability assessment, provide limited support for out-of-distribution generalization to unseen alloy families, and offer no guarantees of physically meaningful stress-strain trajectories. We present a physics-aware constitutive learning framework that combines trajectory-aware training, a shape-aware loss, and a per-temperature mean stress loss to improve trajectory fidelity while preserving temperature-dependent material response. Beyond prediction accuracy, we introduce a reliability framework that quantifies neighborhood support within a low-dimensional constitutive materials space, providing an interpretable measure of extrapolation risk for previously unseen materials. We further propose a coverage-disagreement framework that identifies under-sampled thermo-mechanical regions and provides quantitative guidance for targeted experimental data acquisition. Across leave-one-material-out evaluations and previously unseen alloy families, the proposed framework produces physically consistent stress-strain curves while achieving average prediction errors below 5\\% on previously unseen materials. Together, these contributions transform constitutive machine learning from a prediction-focused task into a reliability-aware decision-support framework capable of assessing extrapolation risk and guiding future experimentation.","keywords":"Physics-Aware Machine Learning; Material Characterization; Elevated Temperature Mechanical Testing; Out-of-Distribution Generalization; Reliability Estimation; Data Coverage Analysis; Uncertainty Quantification","topics":["properties","mechanics"]},{"note_id":"yJq9oAYILT","number":"27011","title":"When Not to Trust a Global Gaussian Process Posterior: Local Scoring and Progressive Dissonance for Multi-Modal Scientific Discovery","abstract":"Gaussian-process Bayesian optimization (GP-BO) is a standard approach to budget-constrained black-box optimization, but its acquisition decisions rely on the quality of a global GP posterior. We study when this reliance becomes unreliable in scientific discovery problems with phase boundaries, feasibility gaps, threshold-derived responses, and disconnected high-value regions. In these settings, a globally smooth posterior can be miscalibrated precisely in high-response regions: on LGPS, nominal $95$% GP coverage drops from $0.887$ overall to $0.403$ in the top response decile. We introduce two alternatives that reduce dependence on global posterior ranking: ProSe, which combines local $k$-nearest-neighbor scoring with spatial anti-clustering, and ATLAS, which searches for progressive disagreement with a hierarchy of simple models while probing spatial frontiers. Our results show a regime split rather than universal superiority. On a smooth synthetic control, several GP methods and random search attain Recall@100 — the fraction of distinct target peaks recovered within 100 evaluations — of $1.00$. In contrast, on a strict LGPS compositional-family holdout, ATLAS achieves Recall@50/100 of $0.53/0.63$ and reaches successful discoveries in a median of $23$ evaluations versus $41$ for MAP-Elites, though its advantage over MAP-Elites is directional and borderline after Holm correction ($p=0.064$). On discriminative steel search, ATLAS and SAGE — a $k$-NN-scored baseline that anchors part of its candidates on observed points — each significantly outperform eight of ten alternative GP-based acquisition, quality-diversity, and randomized-search baselines after Holm correction. Finally, an audit of five look-up benchmarks constructed from public materials datasets finds that four show no separation among methods under our protocol, due to saturation, positional-encoding collapse, or random-search matching. These results suggest using global posterior acquisition on smooth, calibrated landscapes, and favoring locality, dissonance, and diversity when its modeling assumptions are violated.","keywords":"Bayesian optimization; black-box optimization; Gaussian processes; model misspecification; sequential experimental design; materials discovery; quality-diversity; benchmark validity; compositional data","topics":["discovery"]},{"note_id":"YfO0BmTcOl","number":"27178","title":"MeanFlux: Few-Step Crystal Generation for Accelerated Materials Discovery","abstract":"Current generative models for materials discovery produce high-quality candidates but suffer from massive sampling bottlenecks, often requiring dozens to thousands of network function evaluations (NFEs) per structure. We introduce MeanFlux, a diffusion transformer that accelerates generation by learning the average velocity across intervals of a generative trajectory. Operating in the per-atom latent space of a frozen autoencoder, MeanFlux generates viable crystals in just 1 to 16 steps. On the MP-20 benchmark, a 130M-parameter model matches the state-of-the-art yield of metastable, unique, and novel candidates while using one-sixth the inference compute. This efficiency extends to crystal structure prediction, where MeanFlux requires substantially less sampling compute than prior methods and scales predictably with model size. On LeMat-GenBench, MeanFlux produces an order of magnitude more viable crystals per compute unit than comparably pretrained models. With negative-aware fine-tuning (NFT) on a crystal reward, the MP-20 model reaches 22.5\\% relaxed LeMat-GenBench mSUN, twice the conditional base model, at the same sampling cost. These results demonstrate that few-step generation preserves structural quality while unlocking the extreme throughput required for large-scale materials screening.","keywords":"generative modeling; flow matching; crystal generation","topics":["generation"]},{"note_id":"sUX6Du2b6X","number":"27898","title":"CrysPFlow: Physics-Supervised Flow Matching for Crystal Relaxation","abstract":"Crystal structure relaxation seeks stable, low-energy structures from unrelaxed configurations. First-principles methods achieve high accuracy through repeated energy and force evaluations, but incur substantial computational cost, while direct learning-based approaches largely rely on relaxed-structure supervision and underuse the local directional information encoded by the potential-energy surface (PES). We introduce CrySPFlow, a physics-supervised Flow Matching framework that combines geometric endpoint supervision with PES-derived force feedback during training. To make physical supervision reflect the model-induced relaxation dynamics, we propagate terminal force feedback through a short differentiable manifold rollout. We further introduce an endpoint-preserving gradient injection rule that incorporates physical descent information while preserving the geometric objective’s first-order descent rate in raw-gradient space. The interatomic potential is used only during training, so inference remains purely flow-based without additional potential evaluations. On $\\mathrm{SrTiO_3}$, CrySPFlow reduces coordinate and bond-length MAEs by 40.6% and 48.5%, respectively, relative to the strongest baseline for each metric. On X–Mn–O, it reduces coordinate MAE by 9.26%, while experiments with adapted FlowMM, RG-VFM, and CrystalFlow backbones show consistent benefits of physics supervision across the tested architectures.","keywords":"Crystal Relaxation; Flow Matching; Physics-Guided Learning; Geometric deep learning","topics":["generation","mechanics"]},{"note_id":"2Q0VRQhPQp","number":"27974","title":"TaoTex: Boosting Texture Detail Fidelity for Native 3D Material Generation","abstract":"Recent 3D generation models can produce accurate geometries while still struggling to reconstruct detailed textures. We propose a diffusion-based native 3D material generation model TaoTex, which faithfully recovers intricate textures through tailored strategies and improvements. First, we develop a data construction agent to create high-frequency textured 3D assets to bridge the data gap in public datasets. Training with these data significantly enhances the ability of TaoTex to recover challenging details such as text and patterns. Second, we design a multi-level feature fusion (MLFF) module to adaptively integrate local and global features of the conditional input, providing more complete texture cues for the diffusion model and thereby enhancing reconstruction fidelity. To alleviate VAE reconstruction errors, we adopt a latent-to-pixel space loss transition, further improving the pixel-level details and generation quality. Finally, we scale TaoTex to multi-view inputs by incorporating learnable viewpoint embeddings, achieving accurate and consistent material reconstruction across views. Extensive experiments demonstrate that our method significantly outperforms existing approaches in preserving texture details in both single- and multi-view settings.","keywords":"Material Generation; Diffusion; Generative Model","topics":["graphics"]},{"note_id":"HXKkgccu6h","number":"28075","title":"OneMat: Generative Optimization from Scientific Literature for Materials Design","abstract":"Materials design still relies heavily on costly physical experimentation and search over predefined candidate spaces, limiting both the efficiency and breadth of exploration. Recent generative approaches in materials science have advanced candidate-level design by proposing novel compositions and atomic structures, but executable synthesis procedures for their realization remain largely outside iterative generation and optimization. We introduce OneMat, a literature-driven framework for synthesis-oriented generative optimization, where LLMs generate and iteratively refine executable synthesis plans. To enable this paradigm, OneMat transforms scientific literature into a structured domain resource containing evidence-grounded synthesis knowledge, generation examples, and preference signals, and integrates generation with retrieval and evaluation in an iterative optimization loop. We evaluate OneMat on acidic oxygen evolution reaction (OER) catalyst design using a literature corpus of 5,642 papers across mining, synthesis-plan generation, optimization, and wet-lab validation. Evidence-first mining consistently reduces unsupported extraction across four LLMs, while literature-derived post-training improves synthesis-plan quality, increasing the evaluator score from 0.51 (Base) to 0.62 (SFT) and 0.69 (DPO), and enhancing closed-loop optimization. Finally, automated wet-lab experiments translate OneMat-generated synthesis plans into functional catalysts, with the best-performing design discovered through limited experimental exploration achieving an overpotential of 155 mV at 10 mA cm$^{-2}$ and only a 21 mV increase after 500 CV cycles. Together, these results establish a route from scientific literature to experimentally validated synthesis-oriented generative optimization for materials design.","keywords":"Generative Optimization; Materials Design; Large Language Models; Preference Learning; Scientific Literature Mining; Synthesis Planning","topics":["discovery","synthesis"]},{"note_id":"WsYwjQoIIC","number":"28362","title":"Conditioning Is Not Control: Scientific Endpoint Controllability for Tensor-Conditioned Generative Models","abstract":"Property-conditioned generators are increasingly used for scientific inverse\ndesign, but a conditioning variable need not be an action that controls the\nrequested physical response. We formalize scientific endpoint controllability\nfor tensor-valued targets by composing a generator with an independently\nspecified scientific evaluator and quotienting physically equivalent\n$\\mathrm{SO}(3)$ representatives. This formulation\nseparates three notions that are often conflated: structural recoverability,\nconditioning-path visibility, and local endpoint reachability; direct target\ntracking further requires local inverse-action calibration. On a matched\nclamped-piezoelectric benchmark, tensor orbits are strongly recoverable from\nstructure (CEITNet proper-orbit cosine 0.883), yet conditioning interventions\nreveal a distinct actuation geometry: scalar conditioning is locally rank one,\nwhereas full-tensor routes expose roughly twelve numerically visible directions\nwhile concentrating most response energy in about two stable-rank directions.\nCommon-noise swaps further show that a nonzero field response can remain nearly\northogonal to the requested correction. Independently, response-state analysis\nshows that endpoint specification materially changes the target, while DFPT\nseparates many-mode lattice dynamics from the pointwise Born-charge-visible\nresponse channel. These results provide a mechanism-level diagnostic criterion\nfor locating which stage limits endpoint control despite condition\nresponsiveness.","keywords":"generative models; controllability; scientific machine learning; inverse design; geometric deep learning; equivariant learning; symmetry quotients; tensor-valued properties; materials generation","topics":["generation"]},{"note_id":"ZLdgfW9vAu","number":"28932","title":"CrystaL: Seeing Less to Learn Better Visual Latents","abstract":"Learning visual latent states that effectively support answer generation remains challenging for multimodal large language models (MLLMs). Existing approaches often rely on explicit visual supervision or staged restrictions on image access, introducing dependencies on predefined visual targets or multi-stage training. We introduce \\textbf{CrystaL}, a single-stage dual-path framework that learns task-relevant visual latent states through their utility for answer generation. An intact path derives latent states from the original image, while a parameter-shared corrupted path leverages the transferred states to predict the same answer under degraded visual input. Joint answer supervision and cross-path consistency encourage the latent states to preserve information useful for prediction when direct visual evidence is weakened. CrystaL requires neither external visual feature targets nor intermediate visual annotations, and retains only the intact path at inference. Across nine benchmarks, CrystaL achieves relative gains of 6.0\\% and 4.6\\% over Qwen2.5-VL-7B and Qwen3-VL-4B,respectively, supporting the effectiveness of the proposed dual-path training framework in learning visual latents that support answer generation.","keywords":"MLLM; Reasoning","topics":["other"]},{"note_id":"mz2wrdVRJs","number":"30371","title":"GS-PI++: Light-Aware Generative PBR Decomposition of Objects in Gaussian Scenes","abstract":"Recovering physically based surface attributes from Gaussian scenes is an ill-posed inverse problem because observed appearance entangles intrinsic reflectance, surface orientation, and illumination. Object-level inference provides a convenient unit for reusable learned priors, but isolating an object removes contextual observations that can help interpret its appearance, including information about the source illumination and the surrounding scene. Uncertainty in surface orientation further compounds this ambiguity, since errors in normals can be partially compensated by changes in predicted material parameters. We introduce GS-PI++, a light-aware generative framework for PBR decomposition of object instances in Gaussian scenes. For each target object, we construct an object-centered scene appearance probe by removing the target instance and rendering outward from its center. The probe composites visible near-field scene content with the source far-field environment, providing a compact directional observation of the conditions under which the object was observed. Conditioned on the object observations and this probe, a point diffusion model jointly predicts base color, roughness, metallicity, and surface normals. The learned attribute predictor avoids per-scene inverse-rendering optimization. Experiments on synthetic assets and real scanned objects show substantial improvements in material recovery over the evaluated baselines, including comparisons in which source illumination is also provided to competing inverse-rendering methods. The recovered attributes further support downstream Gaussian-based relighting and material editing.","keywords":"Material Decomposition; Conditional Diffusion Models; Inverse Rendering","topics":["graphics"]},{"note_id":"WbNqPddGbp","number":"30401","title":"Reliable Self-Evolution with Imperfect Proxy Rewards","abstract":"Large language model (LLM)-based self-evolving search is a promising approach to scientific discovery. However, high-fidelity evaluation of every candidate is prohibitively expensive in some domains. Self-evolving systems in such settings therefore rely on low-cost but imperfect proxy rewards, which may assign high scores to infeasible candidates. These false positives may contaminate both the final output and the feedback used to guide subsequent generations. This motivates statistically calibrated reward intervals for more reliable self-evolving search. We propose Conformal Interval-Driven Self-Evolution (CISE), which constructs candidate-specific reward intervals using conditional conformal inference and iteration-wise online density-ratio estimation. CISE uses conservative interval-based rewards for evolutionary feedback and returns candidates only when all required property intervals lie entirely within their respective feasible regions. We derive fixed-iteration coverage results under explicit assumptions of independence and covariate shift. We evaluate CISE on three self-evolving search tasks in materials science. In our experiments, all candidates returned by CISE are true positives under high-fidelity evaluation, whereas the baselines return more candidates but include false positives. These results highlight the value of a smaller, more precise shortlist when downstream validation budgets are limited. Our anonymized repository is available at https://github.com/anonoymouscise/CISE-Reliable-Self-Evolution.git.","keywords":"Self-evolving agents; materials discovery; conformal inference","topics":["discovery"]},{"note_id":"h2q445S12D","number":"31092","title":"Semigroup Riemannian Transport Flow for Few-Step Crystal Generation","abstract":"Deep generative models are the default engine for inorganic crystal design, but each structure costs 50--5000 neural function evaluations, which dominates the cost of screening campaigns, closed-loop laboratories and inverse problems that need many samples per query. The obstacle is what the model learns: flow matching predicts an instantaneous velocity, whereas one large step needs the finite-horizon velocity---the average of that velocity over the interval the step covers. Supervising it is the hard part: distillation needs a converged teacher, and derivative-based self-consistency objectives differentiate through the model, requiring a Jacobian-vector product (JVP). The finite-horizon velocity is instead characterized by a composition law---one long transport step equals two composed shorter steps---together with a boundary condition that pins the field down as the step length goes to zero, and on the flat product manifold used for crystal generation the composition law holds exactly. It can be imposed with ordinary forward evaluations of a frozen copy of the model, with no teacher and no derivative through the model. This yields Semigroup Riemannian Transport Flow (SRTF): a semigroup consistency loss supplies the composition law, a standard flow-matching loss supplies the boundary condition, and the field is parameterized as a local velocity plus a correction proportional to the step length, so the two can be read and tested separately. We prove that the objective's population fixed point recovers the transport coefficients to leading order, so the correction is identified rather than merely fitted, and on trained networks the measured and predicted residual coefficients agree within 3%. On the four standard crystal-structure-prediction benchmarks SRTF exceeds the single-sample match rate of the published baselines considered here with only two to five sampling steps, 10--25 times fewer than the fastest of them, at flow-matching training memory, whereas our JVP implementation trains at only a third of the batch size on the same GPU memory.","keywords":"crystal generation; generative models; materials discovery; few-step generation; flow matching; Riemannian transport","topics":["generation"]},{"note_id":"60nOXGruxP","number":"31261","title":"Composable Crystals: Controllable Materials Discovery via Concept Learning","abstract":"Existing methods for de novo crystal generation largely produce complete crystal structures, either through stochastic sampling or under predefined structural constraints, providing limited mechanisms for explicitly structuring how the crystal space is explored. In this work, we introduce a concept-based compositional framework that represents crystal generation as the recombination of learned structural units. We learn a discrete vocabulary of local crystal concepts using a vector-quantized variational autoencoder, where each concept represents a recurring local atomic environment. Unlike predefined structural attributes, these concepts are automatically discovered from data, and multiple concepts can coexist and be recombined within a single crystal. Moreover, the learned concepts exhibit interpretable patterns in both local atomic environments and global crystal symmetries, and empirically transfer across crystal datasets. We further introduce a composition generator to produce novel concept combinations and refine it using high-quality samples. The resulting concept compositions guide downstream crystal generation toward structural combinations beyond those observed in the training data. Experiments on MP-20 and Alex-MP-20 show that concept composition improves the V.S.U.N. score of the base generative model by 53.2\\% and 51.7\\%, respectively, with the main gain arising from increased novelty.","keywords":"crystal generation; material discovery; compositional generation","topics":["generation"]},{"note_id":"cg11xX3W5M","number":"31391","title":"Contrastive Image-Metadata Pre-Training for Materials Transmission Electron Microscopy","abstract":"The transmission electron microscope facilitates the highest-resolution imaging of any instrument ever created, and its limiting factor is no longer spatial resolution but dose efficiency. Low electron doses avoid sample damage but produce noisy images for which, unlike in classical computer vision, there is no ground truth. Autonomous materials experimentation poses a related problem, since closed-loop instruments need representations grounded in the microscope state at acquisition. Both demand representations grounded in how an image was acquired. We release 7,330 paired high-angle annular dark-field scanning-TEM (HAADF-STEM) images and their seven-dimensional acquisition metadata, and propose Contrastive Image-Metadata Pre-training (CIMP), a CLIP-style encoder that aligns the two modalities and reaches 84.4% Top-1 cross-modal retrieval on a held-out split. All seven parameters are individually recoverable from the frozen visual embedding through a linear probe, and we use the embedding to condition a metadata-conditioned style-transfer model that re-renders experimental images under different acquisition parameters. Virtually scaling dwell time and beam current of low-dose images turns this model into a physics-informed denoiser; in a blind user study, experimental microscopists prefer it over the current state-of-the-art denoiser for STEM imagery on 70.2% of trials.","keywords":"electron microscopy; materials science; contrastive learning","topics":["characterization"]},{"note_id":"VVnpx7b69l","number":"31656","title":"Binding Crystallization: Diagnosing and Guiding Attribute Assignment in Text-to-Image Diffusion","abstract":"Text-to-image diffusion models can generate high-quality images from natural language descriptions, yet often fail to assign attributes to the intended objects. Existing training-free methods mitigate these errors by guiding attention during sampling, but the dynamics governing when and how attribute assignments can be corrected remain insufficiently understood. Through counterfactual prompt switches and step-local interventions, we identify binding crystallization: across four prompt categories and three diffusion backbones, attribute assignments become resistant to reversal before spatial refinement is complete. Late denoisers still distinguish opposite assignments, but the sampler writes less of that difference into the latent, and comparable latent writes exert weaker downstream effects on ownership. Intermediate-trajectory probes further show that object presence and attribute ownership are distinct control problems. Together, these findings prescribe when, where, and what to guide. CrystalBind is the resulting training-free framework: it sets its intervention window from observed binding transitions, refreshes spatial targets from evolving noun attention maps, and jointly controls presence and ownership through noun excitation, target attraction, and competitor suppression. On T2I-CompBench with SD v1.5, CrystalBind improves the average binding score by 21.3 points over the unguided model and by 3.4 points over CONFORM under a matched budget of 26 guidance updates, while reducing wall-clock time by 28% relative to CONFORM. The same configuration improves SD v2.1 by 14.3 points without retuning. These results show how binding dynamics inform effective and efficient compositional guidance.","keywords":"Text-to-image diffusion; compositional generation; attribute binding; binding crystallization; training-free guidance","topics":["other"]},{"note_id":"sbBIVo7VmK","number":"31802","title":"UniMaNO: Neural Operator-Based Unified Material Representations for Generalizable Thermal Modeling","abstract":"Identifying material thermophysical properties from limited temperature observations and predicting subsequent thermal evolution are key goals of thermal modeling. Neural networks offer new approaches, but methods based on per-instance reconstruction still require independent optimization for each material and lack a unified representation that can be shared and transferred across materials. To address this limitation, we propose UniMaNO: Neural Operator-Based Unified Material Representations for Generalizable Thermal Modeling, a neural operator framework centered on a unified material representation. Specifically, UniMaNO maps temperature observations to material thermophysical property functions through a two-stage framework: first constructing a shared thermophysical function basis from training conductivity curves, then using temperature reconstruction errors from a differentiable heat conduction simulator to learn the observation-to-material representation mapping and refine material representations. After training, UniMaNO identifies the thermophysical properties of unseen materials without per-instance optimization, reuses the inferred representations for thermal evolution prediction under new geometries and heat-source conditions, and further supports few-shot refinement using the input observations. Extensive experiments demonstrate that UniMaNO enables rapid property identification and physically consistent thermal evolution prediction across materials and operating conditions.","keywords":"Scientific Machine Learning;Thermophysical Property Identification;Neural Operators","topics":["properties","mechanics"]},{"note_id":"kx4aVbuDJ2","number":"32426","title":"YSNO: A Yield-Source Neural Operator for Inverse Modeling of Slope Mechanics","abstract":"Frequent landslide disasters underscore the need for monitoring-driven models that can assess slope risk before catastrophic failure. A key capability underlying such models is to infer the spatially varying strength of a slope from observed deformation, which in turn requires a differentiable forward model capable of resolving both localized yielding and its nonlocal mechanical consequences. However, existing neural operators and their benchmarks have been developed predominantly for fluid dynamics and generic PDEs, leaving heterogeneous elastoplastic slope mechanics and inversion largely underexplored. We introduce the Yield-Source Neural Operator (YSNO), an inverse-oriented neural operator for spatial material-field inference in slopes, together with SlopeBench, a paired finite-element benchmark for elastoplastic field prediction and material inversion. YSNO combines a differentiable finite-element physics lift, a plasticity-gated local operator for localized nonlinear corrections, and a finite-rank global integral operator that propagates yield-related source information across the domain. The resulting fully differentiable surrogate can be frozen and directly embedded into gradient-based inversion, establishing an end-to-end computational pathway from displacement observations to spatially distributed strength estimates. On SlopeBench, YSNO reduces full-setting displacement relative-$L_2$ error by approximately 44.9% relative to the strongest evaluated baseline and yields substantially more accurate material-field reconstruction in inverse tasks. Cross-resolution and out-of-distribution experiments further demonstrate useful generalization beyond the standard training regime. By providing a benchmark for jointly evaluating forward accuracy and inverse suitability in elastoplastic slope mechanics, SlopeBench fills an underexplored regime in scientific operator learning. More broadly, YSNO provides a computational foundation for transforming deformation monitoring into interpretable estimates of internal slope strength, with the potential to support more reliable landslide risk assessment, early warning, and disaster mitigation for vulnerable communities worldwide.","keywords":"Neural operators; Scientific machine learning; Inverse problems; Material field inversion; Geotechnical mechanics; PDE benchmarks","topics":["mechanics"]},{"note_id":"5tx1AkI0SK","number":"32813","title":"Online Surrogate Repair: Decoupling High-Fidelity Feedback from Search Length in Closed-Loop Discovery","abstract":"Closed-loop AI scientists can generate candidate designs at low marginal\ncomputational cost, whereas reliable feedback may require wet-lab synthesis,\ncharacterization, or high-fidelity computation. Addressing this imbalance\nthrough custom laboratory automation remains infrastructure-intensive and\ncostly, while replacing new experiments with a fixed surrogate leaves\npersistent model errors that can be amplified by optimization. We propose\n\\emph{online surrogate repair} (OSR), a closed-loop algorithm that uses sparse\nhigh-fidelity evaluations to update the surrogate throughout a longer agent\nsearch conducted primarily with inexpensive surrogate feedback. An acquisition\nrule selects which designs from the agent's accumulated proposals receive\nhigh-fidelity evaluation, and the resulting labels update the surrogate used\nin subsequent episodes. Across controlled synthetic environments, we\ndemonstrate that improving global surrogate fit does not necessarily reduce\nmaximum regret, whereas Q90-UCB and expected improvement (EI) substantially reduce\nregret by directing evaluations toward regions that determine the optimizer's\ndecisions. On MADE, controls receiving high-fidelity feedback after every episode require\n$6.36$--$7.23\\times$ more oracle queries to match Online EI under two LLM\norchestrators and $10.27\\times$ more under the non-LLM Chemeleon+MLIP\nworkflow. Online surrogate repair introduces a novel third\nfeedback regime between fixed-surrogate operation and high-fidelity feedback\nafter every episode, separating the frequency of high-fidelity evaluation from\nthe duration of the agent's search.","keywords":"AI for science; closed-loop AI scientists; online surrogate repair; surrogate modeling; active learning; expected improvement; materials discovery","topics":["discovery"]},{"note_id":"fJKhNhHcvB","number":"32979","title":"Learning Frequency-Transferable Radio Digital Twins with Gaussian Ray Tracing","abstract":"Emerging multi-band systems (e.g. WiFi 7) raise the importance of the multi-band radio-frequency digital twin (RFDT), a virtual replica of how radio signals propagate within a physical site, which serves numerous applications.\nHowever, existing approaches only focus on a single frequency band, and directly predicting the signal of unseen bands with these DTs does not work because RF propagation varies with frequency.\nBuilding an RFDT with multi-band data, on the other hand, incurs huge measurement overhead as the number of bands increases.\nWe therefore propose FresGRT, the first one-to-many-band RFDT built on single-band RF measurements with 3D Gaussian ray tracing.\nFresGRT first learns the frequency-invariant representation based on the Fresnel equations to achieve cross-band prediction with only single-band data.\nFresGRT then learns from the frequency-selective fading to decouple the physically coupled representation parameters, and optimizes them separately with a staged training pipeline. \nWe extensively evaluate FresGRT on real testbed and ray-tracing datasets.\nResults on the testbed show that FresGRT achieves unseen band prediction with a mean error of 4.4 dB, a 45% improvement over the best baseline, while reducing the survey time by 55%.","keywords":"radio digital twin; Gaussian ray tracing; differentiable rendering; wireless channel prediction; cross-frequency generalization; Fresnel equations; material inversion equations/","topics":["graphics"]},{"note_id":"EYa8WSk9aA","number":"33631","title":"OxiGen: Oxidation-State-Aware Crystal Generation","abstract":"Generative models have the potential to accelerate inorganic materials discovery by enabling inverse design, but generating experimentally realisable crystals remains challenging. Oxidation states are widely used to assess the compositional validity of crystals and guide inorganic materials discovery. While existing generative models for crystals can generate materials with charge-neutral oxidation-state assignments, they poorly reproduce the distributions of oxidation states observed in synthesised materials. To address this limitation, we propose OxiGen, an oxidation-state-aware crystal diffusion model that explicitly represents oxidation states during generation. OxiGen enforces global charge neutrality by construction using a structured output layer with exact inference over a finite-state automaton. Empirically, OxiGen substantially improves oxidation-state fidelity, generates the highest rate of stable, unique, and novel crystals among evaluated methods, and maintains high compositional validity even under property conditioning.","keywords":"Crystals; Materials; Diffusion Models; Generative Models; Structured Prediction","topics":["generation"]},{"note_id":"Bb6SRelZWV
