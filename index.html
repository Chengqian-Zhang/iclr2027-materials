,"mechanics"],"1aQ0OuhtdV":["other"],"rz5AvSazNN":["generation"],"4U4CospadM":["generation"],"dBEKTI1K3J":["synthesis"],"GkbXvtzovu":["graphics"],"2M6g07s7qO":["generation","discovery"],"W9HYjIkmCW":["characterization","benchmarks"],"wbey6FqqUN":["characterization","mechanics"],"oDvUG2HHHo":["discovery","benchmarks"],"7Z5isUmTiG":["generation"],"cz8V6nN1qw":["discovery","characterization","benchmarks"],"OiHIk3MiLL":["graphics"],"hXQZONZ5eS":["generation"],"FG8X06w0RL":["generation","potentials"],"GwG3mCfCht":["generation","benchmarks"],"Uyb7QHMhwc":["discovery"],"2omZ6ZXPDA":["characterization"],"6GUMNWFPfI":["generation","properties"],"jvyIZKLCMl":["discovery","synthesis","benchmarks"],"Iqm7249gqD":["generation"],"S2cQcRF30w":["discovery","synthesis"],"nVgcGyo4zD":["generation"],"1Xi9fslMSG":["discovery","synthesis","benchmarks"],"1nW3w7p6Wb":["generation","discovery"],"FjzgZh47lp":["discovery"],"FcAP7OmpII":["graphics"],"h26MTAVbRa":["mechanics","graphics"],"zXpgiPaQsT":["discovery"],"A3z58aDtoA":["other"],"PTsclw583x":["generation","benchmarks"],"1Suqp3g7V9":["properties","synthesis"],"OP1tViIkc9":["generation"],"J49TK6fvOW":["generation"],"M1ag2tCmQo":["generation"],"p8hO9Zl99q":["properties"],"rPD7JoNuMU":["generation"],"Kryd7MYvKJ":["generation"],"tTXRxvhgHm":["generation"],"Vjmz8sCDFf":["discovery"],"q0dtylmvfc":["generation","characterization"],"ZS5frw4I9w":["discovery","benchmarks"],"8dPblNkCHj":["mechanics","benchmarks"],"Vj7w5LiBae":["characterization","mechanics","benchmarks"],"5dTjdAyZTN":["mechanics"],"8NIfou0DkK":["discovery"],"jjnBHtB7zK":["generation"],"UhnzBwTnkb":["graphics"],"YfGyct6cE6":["generation"],"HKljbVg01v":["characterization"],"PHmABJP69Q":["discovery"],"nXcc3oX6VN":["mechanics","graphics"],"ZlgDCbUTRP":["mechanics","graphics"],"NS0MIuwgrg":["other"],"J4Bt3A8fqi":["mechanics"],"fyI3wb0Fnh":["generation"],"hMUB8xrbwx":["properties"],"ODFL7DgcmW":["characterization","mechanics"],"Y1NLuaSLPC":["synthesis"],"D6x9fAEEXt":["properties"],"0TYMLp5JR6":["mechanics"],"mS7J36xbKx":["generation"],"AyNWIEghR0":["graphics"],"4LaYArhYvS":["generation","potentials"],"S2aUVjgtIt":["discovery","benchmarks"],"xDewwIEoKL":["generation"],"k0DQPiBjDy":["generation","benchmarks"],"sonwIRt9hV":["other"]}},"records":[{"note_id":"ekcZahiaKy","number":"250","title":"Equivariant Deep Learning in Direct-Product Space for Electronic-Structure Hamiltonian Prediction","abstract":"Deep learning provides a promising route to efficient prediction of electronic-structure Hamiltonians, enabling high-throughput screening across large collections of materials. However, most existing equivariant architectures propagate features in direct-sum spaces of irreducible spherical tensors, whereas the target Hamiltonian is naturally an operator block in a direct-product representation over local orbital and spin bases. This representation mismatch fragments contiguous Hamiltonian blocks, obscures direct manipulation of orbital couplings, and organizes features into irregular angular-momentum components that require numerous transformations and are poorly aligned with efficient hardware execution and memory management. To address both the representation mismatch and computational bottleneck, we propose DP-Learner, an equivariant learning framework that performs message passing directly on Hamiltonian-like operator blocks in the direct-product space. Theoretically, we propose Lie-generator-based directional embedding and invariantly weighted left--right products and contractions that preserve equivariance to $SO(3)$, $SU(2)$, and  spatial inversions, without explicit Clebsch--Gordan decomposition or inverse reconstruction. Methodologically, we instantiate this principle as a Transformer architecture, in which Hamiltonian-like feature matrices or tensors evolve through equivariant operators in the direct-product space, while non-linear invariant scalar routing controls structured gating over matrix units, directional propagation, attention, and environment-embedded context interactions. We further construct MP-HAM-110K, a large-scale Hamiltonian dataset comprising more than 110,000 material structures covering 68 elements with both Hamiltonian and wavefunction data. Experiments on MP-HAM-110K and Materials-HAM-SOC demonstrate that\nDP-Learner dramatically improves Hamiltonian prediction accuracy\nand inference efficiency over the state-of-the-art method,\nwith up to a $40.6$% reduction in prediction error, an $11.2\\times$\nspeedup in neural inference, and a $95.2$% reduction in peak GPU\nmemory consumption.","keywords":"AI for Quantum Physics; AI for Materials; Equivariant Deep Learning; Electronic-Structure Hamiltonian Prediction","topics":["electronic"]},{"note_id":"H7Fq5cHA5F","number":"1521","title":"PhysWonder: Building Simulation-Ready Worlds Where Deformation Dynamics Reveal Constitutive Response","abstract":"Recent video generation models show growing potential as world simulators, but physically controlling material-dependent dynamics remains difficult. The same interaction can produce different dynamics depending on how materials deform and whether they recover, reflecting their distinct constitutive responses. Existing approaches guide video generation with simulated motion, forces, or material attributes, but leave this constitutive response implicit. Our key insight is to reveal constitutive response by jointly modeling video generation and physically aligned, appearance-decoupled deformation dynamics. We present ***PhysWonder***, combining two novel modules: ***PhysWonder-3D*** for scalable, physically aligned synthesis and ***PhysWonder-Ctrl*** for learning material control. PhysWonder-3D builds simulation-ready particle worlds from single images and uses a hybrid Material Point Method (MPM) to vary constitutive settings under fixed world and interaction conditions. This produces matched rigid, elastic, sand, and snow dynamics, with RGB videos and deformation-response supervision co-rasterized from the same simulator states. PhysWonder-Ctrl jointly trains a Control Latent Predictor and video generator with response-latent and video supervision. We condition the video generator with the predicted latents, enabling material-controllable generation from a reference image and a physical prompt without simulator rollouts at inference. PhysWonder-3D preserves simulated trajectories while achieving a 2.46× end-to-end speedup over RealWonder in single-image video synthesis. PhysWonder-Ctrl improves material controllability and motion similarity under both explicit and predicted guidance.","keywords":"Video Generation; Physics-Guided Generative Models; Physical Simulation; Material Dynamics","topics":["mechanics","graphics"]},{"note_id":"jbVN7vvlm8","number":"2592","title":"CPGN: A Coordination Polyhedron Graph Network for Multi-Scale Crystal Property Prediction Using Dual-Level Atomic and Geometric Representations","abstract":"Accurate prediction of crystal properties remains a fundamental challenge in computational materials science. Although graph neural networks (GNNs) such as CGCNN, MEGNet, ALIGNN, and SchNet have achieved consistent performance, they represent crystals solely at the atomic level, relying on message passing to implicitly capture local environments. However, many material properties are governed by coordination polyhedra rather than individual atoms. To address this limitation, we propose the Coordination Polyhedron Graph Network (CPGN), a multi-scale GNN that jointly learns from atom-, bond-, and coordination-polyhedron-level representations. CPGN integrates an atom graph, a line graph for angular interactions, and a coordination polyhedron graph connected through shared polyhedral relationships. Polyhedra are described using physically meaningful geometric descriptors, while an interleaved message-passing framework with bidirectional cross-attention enables effective information exchange across structural scales. CPGN is evaluated on three benchmark datasets: Materials Project (69,239 structures), JARVIS-DFT (75,993 structures), and QM9 (130,831 molecules) using standardized splits for fair comparison. On Materials Project, CPGN achieves a formation energy MAE of 0.054 eV/atom and the band-gap MAE of 0.251 eV, outperforming CGCNN, SchNet, MEGNet, and ALIGNN. On JARVIS-DFT, CPGN provides accurate multi-task predictions, achieving MAEs of 0.0925 eV/atom for formation energy, 0.227 eV for optical band gap, 14.01 GPa for bulk modulus, 11.28 GPa for shear modulus, and 0.088 eV/atom for stability. On QM9, CPGN achieves a HOMO MAE of 0.030 eV and competitive performance for LUMO (0.023 eV) and HOMO--LUMO gap (0.038 eV), demonstrating its effectiveness across both crystalline and molecular systems.","keywords":"Multiscale graph neural networks; Materials Informatics; Crystal Property Prediction; Geometric Deep Learning; Multi-Task Learning","topics":["properties"]},{"note_id":"eLvp9bvgj8","number":"3653","title":"MatDuet: Agentic Procedural Material Extraction from Generative Video Models","abstract":"Procedural materials are editable programs that generate surface appearance at arbitrary resolution, but authoring them requires substantial expertise. Generating them automatically is a challenging problem that involves both discrete program design and continuous parameter fitting. We introduce MatDuet, which generates executable procedural shader programs from an image of a material and/or a text prompt. In our full pipeline, a finetuned video generator acts as a \"virtual gonioreflectometer\", converting the image or text prompt into an 81-frame sequence under prescribed illuminations and viewpoints. From this sequence, we select six frontal relightings and six oblique views that instantiate a plausible target material. MatDuet then alternates discrete and continuous optimization. A coding agent writes an executable Blender program and declares its continuous parameters, which a differentiable renderer fits to the virtual gonioreflectometer relightings while holding the program fixed. The resulting program, its rendered images, matching scores, and visual critique are fed back to the coding agent, allowing fitting residuals to guide subsequent program revisions. The output is resolution-independent Blender source code whose structure and parameters remain available for rendering and editing. Across synthetic materials, authored Blender and Substance materials, and real photographs, MatDuet reduces LPIPS by 9.3–26.1% relative to the strongest baseline on each dataset. Ablations analyze input augmentation, agentic search, differentiable refinement, and test-time scaling. Our code and data will be publicly released. Project page: https://matduet-agent.github.io/","keywords":"procedural material; appearance modeling; program synthesis; LLM agents","topics":["graphics"]},{"note_id":"qPZcakh75D","number":"3928","title":"TRACE: Transition-Aware Residual Control for Multi-Objective Materials Discovery","abstract":"Multi-objective materials discovery with LLM agents is often limited not only by how many candidates can be proposed, but by how effectively each costly property evaluation informs the next search step. Existing agents mainly store evaluated candidates and their scores, so they know which materials succeeded but not which executable edits caused useful property changes. This makes local refinement difficult when objectives compete and an edit that improves one property may damage another. We propose TRACE, a transition-aware residual control framework that treats evaluated edits as the basic unit of feedback. TRACE records each local refinement as a parent-edit-child transition with observed property deltas, aggregates transition evidence to estimate reusable edit effects, and ranks future edits by their predicted ability to reduce the current candidate’s remaining constraint violations while avoiding damage to already satisfied objectives. In a controlled same-backbone comparison, TRACE improves over LLEMA, the state-of-the-art LLM-agent baseline, raising macro-average hit rate from 18.13\\% to 25.96\\%.","keywords":"LLM agents; materials discovery; multi-objective optimization; sample-efficient search; transition-level feedback","topics":["discovery"]},{"note_id":"fLokQOXhRl","number":"4481","title":"MatMicroBench: Towards Realistic Agentic Materials Microstructure Characterization","abstract":"Real-world microstructural characterization requires a continuous analysis process that \\textit{observes} relevant scientific evidence, \\textit{models} analysis rules as executable procedures, \\textit{measures} quantitative characteristics, and \\textit{reasons} from the resulting evidence and measurements to scientific conclusions. Existing benchmarks, however, largely focus on knowledge-centric or single-step tasks and provide limited coverage of such end-to-end analysis in \\textbf{realistic experimental settings}. We introduce MatMicroBench, a benchmark toward realistic agentic materials microstructural characterization, where agents operate over experimentally acquired data and complete long-horizon scientific analysis with multiple interdependent outputs. Built from controlled laboratory experiments, MatMicroBench contains 64 instances based on SEM and EBSD data and spans four complementary tasks: static defect-state analysis, temporal defect-evolution analysis, inter-grain structure analysis, and intra-grain orientation-variation analysis. Each task requires agents to jointly produce spatial evidence, executable code, numerical results, and scientific conclusions, enabling \\textbf{capability-resolved evaluation} of \\textit{Observe}, \\textit{Model}, \\textit{Measure}, and \\textit{Reason}.  We evaluate 15 frontier models under a fixed execution harness and further compare six representative models across multiple agent harnesses. Under the fixed harness, even the strongest models achieve only around 53 points overall, and different models lead on different tasks, indicating substantial room for improving end-to-end microstructural analysis. Capability analysis further reveals task-specific bottlenecks, while strong code execution does not necessarily translate into accurate scientific outputs.  These findings expose distinct failure modes across the characterization process and establish MatMicroBench as a testbed for developing more reliable agents for real-world materials analysis.","keywords":"Materials Microstructural Characterization; Agent Benchmark; Long-Horizon Scientific Workflows;","topics":["discovery","characterization","benchmarks"]},{"note_id":"WvGr2pJbmR","number":"9270","title":"Grail-AD: Request-Driven Algorithm Evolution for 2D Graphite Material Packing","abstract":"Growing large single-crystal graphite enables structural-superlubric devices, but converting grown crystals into products requires packing independently rotatable rectangular items into irregular usable regions while maintaining safe distances for laser cutting kerf. The physical crystals are expensive to acquire and their morphology is difficult to control. We release a dataset of large-scale single-crystal graphite flakes and propose Grail-AD, a closed-loop framework that connects a scale-controlled crystal image generator to a population of evolving packing algorithms. The generator combines pretrained feature alignment, scale control, and representation-based retrieval to supply diverse crystal images. The packing evolution employs an LLM-driven heuristic search with a composite objective combining geometrically valid packing count and a spacing reward — with an image-request mechanism through which algorithms query specific morphologies from the generator; cases that promote progress are retained while unsolvable ones are rejected, forming a task-directed data engine. Retrospective evaluation of 45 runs spanning three search frameworks, five image-supply schemes, and three repeats on a frozen independent 100-image test set shows that conditioned requests yield a higher retrospective maximum than matched Fixed runs in 22 of 27 comparisons. OpenEvolve improves in all nine matched comparisons; Real Request averages 34,638 versus 27,094 for Fixed, a 27.8\\% gain. MLES Request improves in all three matched comparisons, with a 10.7\\% mean gain. Because the reported score for each run is the retrospective maximum over its candidate pool, these results characterize candidate-discovery capability under a fixed search budget rather than unbiased deployment performance. This approach may extend to the product design and manufacturing of other two-dimensional crystal materials, including transferred heterostructures.","keywords":"automated algorithm design; controllable image generation; learned evaluator","topics":["discovery","synthesis","benchmarks"]},{"note_id":"li3xckb1Cc","number":"10019","title":"CrystalAR: Autoregressive Modeling for Symmetric Crystal Generation","abstract":"Deep generative modeling has achieved remarkable progress in crystal generation. Given the rich symmetries inherent in crystalline structures, recent work has increasingly sought to explicitly incorporate space-group symmetry into generative models, enabling more effective exploration of novel symmetry templates. Yet introducing symmetry templates substantially increases the combinatorial complexity of stoichiometric relationships between atomic species and crystallographic sites, while creating a fundamental tension between flexible exploration of discrete crystallographic templates and faithful realization of these templates as continuous three-dimensional structures. To address these challenges, we propose **CrystalAR**, a unified autoregressive framework that models Wyckoff symmetry templates and complete crystal structures within a single generative hierarchy. Specifically, CrystalAR reformulates continuous coordinate generation as a symmetry-conditioned hierarchy of discrete spatial localization decisions, autoregressively refining the positions of all symmetry-inequivalent sites across resolution levels while jointly modeling their spatial configuration within each level. This discrete hierarchical formulation further enables constraint-aware search over both crystallographic templates and geometric realizations. As a result, CrystalAR achieves competitive retrieval-free crystal structure prediction and de novo generation performance comparable to state-of-the-art models, while retaining strong symmetry-template novelty. To our knowledge, CrystalAR is the first symmetry-native approach to simultaneously demonstrate these capabilities, providing a promising alternative paradigm for symmetry-preserving crystal generation.","keywords":"Crystal Generation; Autoregressive Modeling; Symmetry","topics":["generation"]},{"note_id":"mJr4tXbGvH","number":"10464","title":"Symmetry-Breaking De Novo Crystal Generation via Markovian Jump Diffusion","abstract":"Generating crystals has recently attracted significant interest due to their broad applications in materials science. However, existing generative models struggle to produce complete crystallographic specifications, limiting their ability to capture full crystal symmetries and structural dependencies. In particular, current state-of-the-art approaches generate crystals only up to site symmetries and rely on sampling space groups from empirical distributions during inference. Inspired by \\emph{spontaneous symmetry breaking} in physics, where crystals break symmetries of the underlying system, we propose a novel diffusion-based framework that generates full crystallographic specifications by reversing from the lowest-symmetry priors. Our method leverages a Markovian jump-diffusion process to model these symmetry-breaking dynamics, enabling it to traverse different space groups in a physically motivated manner. Our model, dubbed \\emph{Symmetry-breaking Crystal Diffusion} (SbCD), introduces a principled approach to explicitly incorporate inter-space-group transitions into the generative process. In de novo crystal generation experiments, SbCD substantially outperforms its symmetry-preserving counterpart and achieves state-of-the-art thermodynamic stability on MPTS-52, offering a promising perspective for generative modeling of crystalline materials.","keywords":"de novo crystal generation; jump diffusion models; symmetry breaking; space group transition dynamics","topics":["generation"]},{"note_id":"iNY9SJtCH7","number":"10615","title":"Complete Neural Electronic Initialization Accelerates Materials DFT","abstract":"We present the first complete machine learning method for accelerating plane-wave density functional theory (DFT) in materials under the projector augmented wave (PAW) formalism. We formalize seven criteria that a \\textit{Complete Neural Electronic Initializer} must satisfy for practical end-to-end PAW DFT acceleration. Applying these to prior work reveals two structure-dependent components, augmentation occupancies and spin initialization, whose absence prevents existing acceleration methods from providing complete reference-free initialization. We show that omitting these components can eliminate or reverse the acceleration obtained via models that only predict the smooth valence density. We satisfy the missing requirements by introducing AugNet, a general equivariant model for PAW augmentation occupancies, and the first general spin density model for materials, which predicts the smooth spin-difference density and spin-difference PAW augmentation occupancies using predicted magnetic moments to constrain the global magnetic state. Combined with existing valence density models, our full method satisfies all seven criteria and forms a fully reference-free electronic initializer for materials DFT, requiring no electronic quantities from a converged target calculation. We show that perfect initialization could cut PAW DFT wall time by 40-52 %, and our method recovers up to 62 % of this saving, reducing end-to-end DFT wall time by up to $\\sim25$ % on unseen structures while preserving converged energies.","keywords":"electronic structure; charge density; charge; spin; equivariant; periodic; materials; crystals; dft; paw; machine learning potentials","topics":["electronic"]},{"note_id":"axMSdpe80b","number":"10684","title":"Touch2Predict: Learning Physical Properties from a Single Tactile Interaction","abstract":"Estimating physical properties of deformable objects is essential for predictive robotic manipulation, but remains difficult in contact-rich interactions where visual deformation is small, localized, and often occluded. Tactile sensing provides direct measurements of mechanical response, yet these observations are highly sensitive to uncertain robot--object contact configuration, coupling pose and material estimation. We introduce Touch2Predict, a structured tactile inverse-modeling framework that separates these two factors according to their physical roles. Contact-establishment cues guide a low-dimensional derivative-free search over contact-relevant pose variables, while the full spatiotemporal pressure sequence drives adjoint-based material refinement through differentiable contact simulation. Alternating the two stages progressively recovers the interaction-specific contact state and object-level physical properties. Across eight synthetic scenes with translational, rotational, and coupled pose uncertainty, \\method recovers Young's modulus with an average per-scene median relative error of 6.05\\%. Real-robot experiments further demonstrate its practical feasibility, with the modulus identified for a test object within 12.4\\% of an independent reference measurement. Together with qualitative predictions under unseen interactions, these results highlight the potential of tactile inverse physics to recover transferable physical models for understanding and predicting physical interactions.","keywords":"Tactile Sensing;Material Parameter Identification;Contact Pose Uncertaint;Differentiable Simulation","topics":["mechanics"]},{"note_id":"83rOPPn3as","number":"11209","title":"SGCR: Structure-Gradient Coupled Replay for Continual Crystal Property Prediction","abstract":"Crystal structures and property distributions can evolve continuously as new material families and chemical spaces are explored, making continual learning essential for crystal property prediction. We study this problem under limited historical memory and propose \\modelname, a structure-gradient coupled framework that jointly considers structural relevance and optimization interference. \\modelname first constructs a frozen structural reference space to index a domain-balanced random memory of historical crystals. For each incoming batch, it retrieves historical samples according to both their structural relevance and their conflict with the current prediction objective, enabling more informative use of limited memory. We further introduce a calibrated structural-novelty signal that adaptively modulates gradient correction when current and historical objectives disagree, allowing the model to balance adaptation to newly arriving crystal distributions with retention of previously learned knowledge. Extensive experiments across multiple datasets demonstrate that \\modelname consistently improves predictive performance and effectively alleviates catastrophic forgetting.","keywords":"Crystal Property Prediction; Continual Learning; AI for science","topics":["properties"]},{"note_id":"01hZuBp7qm","number":"11316","title":"Probing Material Cues in Video Foundation Models","abstract":"General-purpose video foundation models (VidFMs) generate realistic videos that capture how surface appearance evolves across viewpoints and illumination conditions, suggesting that their internal representations may encode intrinsic material information even without explicit material supervision. Motivated by this observation, we investigate the material information embedded in pretrained VidFMs through a lightweight probing framework. We keep the foundation models frozen and measure how well material properties can be recovered from their intermediate representations. Through systematic experiments across synthetic and real-world scenes, together with feature-source ablations, we find that VidFM features provide material cues beyond those available from strong image representations. In controlled settings requiring fine-grained material discrimination, video features show a pronounced advantage over DINOv2 features, while the two representations provide complementary information in more complex scenes. Further analyses show that material recoverability benefits from broader viewpoint coverage and is influenced by object-level semantics. Qualitative synthetic-to-real results further suggest that these material cues remain useful beyond the supervised training domain. Together, these findings provide evidence that large-scale video generative models learn reusable representations containing material-relevant information and characterize the conditions under which these representations offer advantages over image features.","keywords":"material estimation; relighting; domain adaptation","topics":["graphics"]},{"note_id":"dYHnnnBcW7","number":"11486","title":"DynaCrys: Crystal Generation with Dynamic Space-Group Diffusion","abstract":"The search for new crystalline materials spans an enormous compositional and structural space. Generating candidates in this space requires modeling the relationships between elemental composition, crystallographic symmetry, and crystal geometry. The space group specifies the crystal's symmetry and determines the admissible Wyckoff positions and geometric degrees of freedom; fixing it in advance prevents this global symmetry choice from being revised using information from evolving Wyckoff occupations and elemental composition. We introduce DynaCrys, the first framework for complete crystal generation in which the space group co-evolves with Wyckoff occupations and elements. We develop physics-informed space-group diffusion that explicitly incorporates crystallographic group–subgroup relations, and a legality-constrained stochastic decoder that jointly samples compatible space groups, Wyckoff occupations, and elements, followed by symmetry-constrained geometry generation. In large-scale evaluations on standard benchmarks, DynaCrys achieves state-of-the-art performance in symmetry-aware crystal generation while supporting fast sampling.","keywords":"crystal generation; diffusion models; crystallographic symmetry; space groups; materials discovery","topics":["generation"]},{"note_id":"7pz6dTWTzX","number":"11869","title":"GlassBench: Benchmarking Large Language Models for Domain-Specific Glass Materials","abstract":"Large language models (LLMs) have shown substantial potential for scientific question answering, reasoning, and knowledge integration, yet materials science still lacks standardized benchmarks for assessing domain-specific capabilities. This limitation is especially pronounced in glass science, where terminology is specialized, composition-structure-property relations are highly nonlinear, and most available resources are structured numerical databases rather than natural-language evaluation sets. Here, we introduce GlassBench, a multitask benchmark for evaluating LLMs in glass materials science. Based on this, GMatLLM is constructed as a domain-specific LLM for the glass research. First, GlassBench was constructed by extracting question-answer pairs from authoritative textbooks and research literature, followed by multistage quality control combining LLM-based scoring, confident-learning-based screening, domain-consistency checks, and expert review. The resulting dataset contains 19,974 quality-screened samples spanning judgement, single-choice, multiple-choice, short-answer, and open-ended tasks. To test the benchmark's sensitivity to domain adaptation, we used Qwen2.5-7B-Instruct as the base model and applied supervised fine-tuning with LoRA through the LLaMA-Factory framework, yielding GMatLLM. We then evaluated general-purpose, chemistry-specific, materials-specific, and encoder-only models on GlassBench and complementary general benchmarks. GMatLLM achieved approximately 0.72 accuracy on GMat-MCQ and 0.31 on GMat-QA, while its reduced scores on several general benchmarks exposed a domain-specialization/general-capability trade-off. These results indicate that GlassBench can distinguish model families and quantify both the gains and costs associated with domain adaptation. GlassBench therefore provides a reproducible framework for evaluating and developing LLMs for glass materials research.","keywords":"large language models; benchmark; question-answering dataset; supervised fine-tuning; materials science","topics":["discovery","benchmarks"]},{"note_id":"AxUIIXUgnY","number":"12004","title":"Mat2GS: Feed-Forward Relighting with Explicit Materials on 2D Gaussians","abstract":"Relighting is essential for seamlessly integrating 3D assets into diverse environments, enabling applications such as augmented reality, simulation, and digital content creation. However, existing relighting methods often rely on implicit appearance modeling or image-space material prediction coupled with deferred shading, and struggle to faithfully reproduce specular highlights and shadows under novel illumination. To mitigate this issue, we propose a feed-forward relighting framework based on 2D Gaussian Splatting (2DGS) that directly attaches explicit material attributes to 2D Gaussians, establishing a unified representation of geometry and materials. Through accurate geometry and material prediction, our method produces realistic specular highlights and shadows under novel environment lighting. We further construct a large-scale synthetic dataset by rendering a nearly 110K object subset from Objaverse, providing images with various viewpoints and illumination under corresponding material and geometry. Experiments demonstrate that our method outperforms existing open-source state-of-the-art approaches in relighting quality.","keywords":"inverse rendering; relighting; feedforward reconstruction","topics":["graphics"]},{"note_id":"kRxfqXyHFh","number":"12644","title":"Few-Step Crystal Generation via Composition-Conditioned Moment Matching","abstract":"Deep generative models offer a scalable route to explore the vast composition--structure search space underlying materials discovery. Existing diffusion- and flow-based crystal generators, however, still rely on long iterative sampling trajectories, limiting their use in high-throughput settings where large candidate libraries must be generated efficiently. We propose \\textsc{CoMMat} (\\textbf{Co}mposition-conditioned \\textbf{M}oment matching for \\textbf{Mat}erial generation), a few-step crystal generation framework that separates chemical composition modeling from geometric refinement. Given a composition, \\textsc{CoMMat} obtains a composition-conditioned structural latent, predicts the lattice once, and refines only atomic coordinates while keeping species and lattice fixed, reducing iterative generation to a continuous geometric transport problem. To solve this problem in only a few network evaluations, we adapt inductive moment matching to periodic crystal geometry through a lattice-normalized Cartesian transport space coupled with periodic coordinate evaluation in wrapped fractional coordinates. Conditioning the structural prior on composition eliminates the need to encode target geometry, enabling a unified few-step generator for both crystal structure prediction and de novo generation. Across the MP-20, Perov-5, Carbon-24, and MPTS-52 benchmarks, \\textsc{CoMMat} retains strong generation quality with only 2--8 neural function evaluations. Under matched few-step budgets, it achieves favorable CSP and de novo generation performance relative to recent diffusion- and flow-based baselines, with particularly strong results at the lowest sampling budgets. At its 32-NFE setting, \\textsc{CoMMat} remains competitive with much higher-budget baselines while substantially reducing inference cost. These results demonstrate a practical route toward scalable few-step crystal generation.","keywords":"Crystal generation; Crystal structure prediction; Few-step generative modeling; Inductive moment matching; Composition-conditioned generation; Periodic generative models; Materials discovery.","topics":["generation"]},{"note_id":"DthGr5uRaR","number":"12802","title":"MADField: Multi-fidelity Amortized Density Field for Adsorption in Nanoporous Materials","abstract":"High-throughput computational screening of nanoporous materials for gas storage and separation requires fast and accurate characterization of adsorption equilibrium. Particle-based grand canonical Monte Carlo (GCMC) and density-based classical density functional theory (cDFT) provide simulation-based estimates of gas uptake and adsorbate density fields, but their speed-accuracy tradeoff remains insufficient for large-scale screening. In this work, we address this gap with Multi-fidelity Amortized Density Field (MADField), which reframes adsorption prediction as equilibrium density-field estimation. MADField learns from two complementary fidelities, combining broad and scalable cDFT density supervision with GCMC density labels, and recovers gas uptake by integrating the predicted density field. MADField improves uptake accuracy over the strongest baselines by 5.7× for cDFT and 3.35× for GCMC, and its predicted fields accelerate cDFT solvers with a 5.7× reduction in walltime while recovering 37.78% of cases that fail under standard settings. We also evaluate MADField under realistic screening scenarios for CH4 working-capacity and low-pressure CO2 uptake screening, where it reduces the number of required GCMC candidate evaluations to obtain the top 0.1% pool by 8.0 and 11.5 times, respectively.","keywords":"AI/ML for physical sciences; Metal-organic Framework(MOF); adsorption surrogate model; material screening","topics":["properties"]},{"note_id":"Pf5tw7MuGc","number":"12882","title":"PhysMAS: Physics-Grounded Multi-Agent Synthesis of Compositional 4D Gaussians","abstract":"Efficient, fully automatic, and physically plausible 4D Gaussian synthesis is an important goal for dynamic scene generation. Recent physics-based methods couple 3D Gaussians with the Material Point Method (MPM) to generate physically driven motion, but extending this paradigm to heterogeneous multi-part objects and interacting multi-object scenes remains challenging. Object-level physical assignment collapses distinct parts into a single material state, while one-shot predictions from large language models, vision-language models, or agents neither reliably bind different materials to identified parts nor verify that the resulting MPM configuration is executable. Score Distillation Sampling (SDS)-based parameter optimization, meanwhile, requires repeated per-scene score evaluations and gradient backpropagation, incurring lengthy optimization and potentially yielding suboptimal or unstable solutions. We therefore present PhysMAS, a physics-grounded multi-agent framework. From a motion prompt and four scene views, an Object-Part Scene Agent establishes persistent identities and calls a Material Reasoning Agent for part-wise profiles. It invokes solver-aware skills to bind these identities and profiles to per-particle MPM fields and execute all objects in a shared domain; the framework then screens candidate forward-simulation results. This supports heterogeneous multi-part and interacting multi-object scenes without per-scene diffusion-score backpropagation. Extensive experiments demonstrate that, compared with recent physics-based 4D Gaussian baselines that rely on SDS, PhysMAS achieves better semantic alignment and perceived physical plausibility while requiring less runtime.","keywords":"Physics-Grounded 4D Generation; Gaussian Splatting; Multi-Agent Systems; part-aware physical simulation; Material Reasoning","topics":["mechanics","graphics"]},{"note_id":"ocKfgQrIUt","number":"13186","title":"CrystalBench Dynamics:   A Multimodal Benchmark for dynamic reasoning in crystal systems","abstract":"Scientific reasoning over crystals requires connecting structural\nperturbations to changes in symmetry, relaxation response, and\nfinite-temperature evolution.\nExisting materials-science benchmarks evaluate domain knowledge, property\nprediction, multimodal interpretation, or structure manipulation, but rarely\nconnect controlled perturbations with their simulated physical consequences.\nWe introduce \\textbf{CrystalBench Dynamics}, a simulation-grounded benchmark\ncontaining 4,016 questions across 18 text and multimodal tasks derived from\n1,500 real crystal structures.\nOur generation pipeline applies five structural perturbations, including lattice\nstrain, vacancy creation, atomic substitution, interstitial insertion, and\natomic displacement, followed by geometry relaxation and finite-temperature\nmolecular dynamics.\nThe resulting tasks are organized into four capability families:\nPerception, Symmetry Reasoning, Symmetry--Response Reasoning, and Dynamics\nPrediction.\nAll reference answers are computed programmatically from crystal structures,\noptimization records, and simulation trajectories rather than generated by\nlanguage models.\nAcross contemporary language and vision-language models, the strongest system\nachieves only 51.96\\% task-macro accuracy on the Full Track,\nremaining more than 20 percentage points below the\nexpert performance.\nEnabling thinking raises Gemma-4-31B-IT from 31.26\\% to 43.04\\%, demonstrating\nthe value of inference-time reasoning while leaving substantial headroom.\nThese results show that recognizing crystal structures does not imply the\nability to predict how their symmetry and physical state evolve under\nperturbation.","keywords":"Crystal structures; materials science; multimodal reasoning; foundation models; atomistic simulation; molecular dynamics; benchmark evaluation","topics":["discovery","mechanics","benchmarks"]},{"note_id":"NAAFb7xEae","number":"13276","title":"Texture Space Material Diffusion","abstract":"We present a method for generating high quality materials for 3D objects entirely in texture space. We finetune a diffusion transformer for text-guided material generation, multi-view material generation, and material upscaling. Our key insight is to use the known projection from image space to texture space, enabling the diffusion process to generalize across arbitrary geometries and texture parameterizations. This approach also avoids the view consistency issues inherent in video and multi-view diffusion models. Because texture space is two dimensional, we can reuse the strong priors of pretrained video diffusion models. We apply our method to high quality material reconstruction from posed photos captured under unknown lighting, as well as to text- and image guided material generation. Our method can scale to high resolutions (8K), 100+ input views and neural material representations. In quantitative and qualitative evaluations we show state-of-the-art results for material generation and reconstruction.","keywords":"Generative models; surface materials; content creation","topics":["graphics"]},{"note_id":"Xh8FY5LwDg","number":"13428","title":"Extracting Neural Materials from Images","abstract":"Neural materials can represent complex specular reflections and scattering effects in a compact, universal basis. However, acquiring and authoring such materials remains challenging. We present NeuMatEx, a differentiable inverse rendering method for extracting spatially varying neural materials from images. The nonlinear structure of neural material latent spaces makes optimization with naive inverse rendering infeasible. To address this, we train a Large Material Reconstruction Model (LMRM) that directly predicts initial base color, neural material latents, and aleatoric uncertainty guides from images. This material prior provides a good initialization and better constrains our subsequent optimization using inverse path tracing. The predicted uncertainty further helps by anchoring high-confidence regions more tightly to the LMRM prediction, preventing lighting and complex specular effects from being baked into materials. Experiments on synthetic and real assets show that NeuMatEx extracts complex materials with better visual quality and material decomposition than PBR-based methods.","keywords":"Neural materials; Inverse rendering; Large reconstruction model; Test-time optimization","topics":["graphics"]},{"note_id":"JkZRwaIzFS","number":"13635","title":"PhysVerse: Deformable Simulation-Ready 4D World Modeling from Monocular Videos.","abstract":"World modeling aims to predict future observations while retaining a scene state for downstream use. Existing reconstruction and generation-centric methods mainly capture geometry and visual dynamics, and rarely represent the spatially varying material parameters a soft-body simulator requires, so the retained state cannot be used directly for deformable simulation. We present PhysVerse, a deformable simulation-ready 4D world model that links reconstruction, video generation, and deformable simulation through a shared scene state. Given monocular video, a feed-forward reconstructor jointly predicts depth, dynamic Gaussian primitives, and dense maps of Young's modulus, Poisson's ratio, and density in a single pass. The reconstructed geometry and material maps initialize MPM-based deformable simulation, while the same depth and material maps condition future video prediction. Generated frames can be passed once again through the reconstructor to recover geometry and material maps. We evaluate PhysVerse on both surgical and general robotic video benchmarks. Experiments show that the reconstructed state supports deformable rollout under MPM, and that depth and material conditioning improve video fidelity and temporal consistency. Our demo is available at: https://anonymous.4open.science/w/doaneqzp-0DBD/.","keywords":"Material Property Prediction; World Model; Deformable Simulation","topics":["mechanics","graphics"]},{"note_id":"jlypuX7Xh3","number":"13833","title":"Pairformer-H: An E(3)-Equivariant Pairformer for Electronic Hamiltonian Prediction","abstract":"Learning electronic Hamiltonians from atomic structures offers a route to electronic-property prediction without costly self-consistent density functional theory (DFT) calculations. However, accurately capturing how the surrounding atomic environment shapes orbital couplings between atom pairs remains a central challenge. We introduce Pairformer-H, a sparse E(3)-equivariant architecture that incorporates the Hamiltonian’s orbital-block structure into pairwise information exchange through learned orbital-operator compositions. Along each path connecting a target pair through an intermediate atom, the model composes two pair operators with an environment-dependent operator acting on the intermediate orbital space. This composition contracts over intermediate orbital indices, producing a contribution with the orbital dimensions of the target pair. Adaptive aggregation combines contributions across periodicity-consistent paths to update the target-pair representation. Across seven datasets without spin–orbit coupling and two with spin–orbit coupling, Pairformer-H achieves Hamiltonian matrix-element mean absolute errors of 0.166–0.356~meV and the lowest reported errors among the evaluated baselines on five without spin–orbit coupling datasets and both with spin–orbit coupling datasets. Relative to the best baseline for each dataset, errors decrease by 51.7\\% on bilayer  Bi$\\_2$Te$\\_3$ without spin–orbit coupling and 35.4\\% on bulk $T\\_{\\mathrm d}$\\-WTe$\\_2$. Representative band structures, densities of states, and optical responses closely agree with DFT references. These results show that aligning a network’s internal interactions with the orbital-block structure of the Hamiltonian yields accurate predictions across materials and spin settings.","keywords":"Electronic-structure Hamiltonian prediction; Equivariant neural networks; AI for materials science","topics":["electronic"]},{"note_id":"Grvbfo1MrW","number":"14101","title":"DATE: Dual-scale Adaptive Temporal Encoding for Tactile Property Perception","abstract":"Vision-based tactile sensing enables robots to infer physical properties from contact interactions. Yet the cues needed for different properties unfold at different temporal scales. Hardness is reflected in deformation accumulated during pressing, whereas roughness is revealed by local texture and shear changes during sliding. Models that rely on a single global summary or a fixed short window can miss complementary evidence needed for these properties. To address this, we propose Dual-scale Adaptive Temporal Encoding DATE, which jointly models local contact changes and full-sequence dynamics. A frozen tactile backbone provides patch and frame-level features. A local branch applies spatiotemporal attention over patch tokens within short windows to preserve texture and shear transitions, while a global branch encodes the deformation history across the observed sequence. Property-specific gated fusion combines these temporal representations with statistical cues, allowing hardness and roughness to draw on different temporal evidence across pressing, sliding, and twisting. We further integrate the learned tactile representation with a frozen vision-language model for material description and property reasoning. Evaluations on two benchmarks with graded property labels demonstrate the effectiveness of DATE. On VitaSet, it improves hardness and roughness classification accuracy over AnyTouch by 7.38 and 5.14 percentage points, respectively. The downstream extension achieves an overall TVL description score of 5.66, exceeding TVL-LLaMA (ViT-Base) by 0.63 points.","keywords":"Vision–tactile fusion; Temporal feature modeling; Material property recognition; Hardness and roughness classification; Multimodal perception","topics":["mechanics"]},{"note_id":"Aa1wl1HwvW","number":"14692","title":"Fourier-Latent Diffusion for Constrained Generation of Triply Periodic Minimal Surfaces","abstract":"We present a generative framework for the constrained design of $D_{2h}$-symmetric triply periodic minimal surfaces (TPMS) with low residual mean curvature.\nExisting TPMS design pipelines either explore a limited set of canonical analytical families or rely on computationally expensive numerical procedures, \nmaking it difficult to efficiently generate diverse candidates under geometric and/or mechanical requirements.\nOur approach learns a distribution of solver-generated TPMS in a compact Fourier space \nwhere periodicity and $D_{2h}$ symmetry are guaranteed by construction.\nThis representation eliminates the need for a learned geometric decoder and enables the training of an effective diffusion model that generates low-mean-curvature candidates \nconditioned on sparse geometric constraints, selected homogenized elastic properties, or their combination.\nA subsequent coefficient-space refinement further reduces the residual mean curvature.\nExperiments show that our approach outperforms trigonometric, SDF-based, and standard Fourier-space baselines \nand enables controllable, high-quality generation under geometric and low-dimensional mechanical constraints.\nOverall, the proposed framework provides a compact and efficient design space for generating near-minimal periodic structures under user-specified requirements.","keywords":"triply periodic minimal surfaces (TPMS); diffusion model; generation model; metamaterial","topics":["characterization","mechanics"]},{"note_id":"FNnjijLUaI","number":"15019","title":"Bounding Retraining Equivalence and the Deletion Floor in Materials Machine Unlearning","abstract":"In materials machine learning, closely related retained structures can support accurate property predictions even after a specific record is removed. Post-deletion prediction error is therefore an ambiguous measure of machine unlearning. We define the deletion floor as the expected loss on a deletion request under a specified retraining procedure. Standard indistinguishability constraints give a sharp interval bounding an unlearning update’s target loss around this reference. A conditional neighbor bound links a low deletion floor to retained-data fit, prediction regularity, and local label agreement; an exact ridge identity separates residual fit from the prediction change caused by deletion. In controlled redundancy sweeps, retaining just one related structure reduces median normalized retraining loss by approximately eightfold. In a paired Materials Project study spanning two fitting regimes, the regime with the lower deletion floor also shows a larger prediction change on more than 50% of shared requests. Comparisons with approximate updates and the original model distinguish deliberate suppression of target predictions from preservation of overall utility. Request-level unlearning evaluations should therefore report retraining reference loss, prediction change, and retained utility together, interpreting post-deletion accuracy in light of what retraining itself leaves behind.","keywords":"machine unlearning; retraining equivalence; data redundancy; leave-one-out stability; exact unlearning; ridge regression; materials informatics; materials property prediction; formation energy; crystal structure representation; deletion floor; retained utility; bounded-loss transfer; target suppression","topics":["properties"]},{"note_id":"D3o11BIhap","number":"15034","title":"Physical survival and provenance limits on watermarking AI-generated crystals","abstract":"When crystals are generated, they are relaxed and standardized before scientific use. This processing can erase or alter structural evidence of how they were produced. We ask what a structure-only watermark can preserve through this process, how an auditor should calibrate the surviving evidence, and which provenance claims the resulting decision supports. BasinMark connects a deposited structure to a collection-level audit by selecting generated candidates according to keyed structural fingerprints. Exact relaxation to the same basin minimum erases coordinate marks, so the protocol selects among alternatives whose fingerprint distinctions may survive deposition. Across the evaluated generators and interatomic potentials, cell-shape bins account for much of the observed fingerprint instability. Removing these bins in two generator populations substantially improves fingerprint-label survival while preserving structural diversity. Under a key-independent null, counting each unique fingerprint class once provides exact false-positive control. Detection operates at the structural-class level, however, so collections with identical fingerprints remain indistinguishable. Watermark evidence can therefore be copied or reused across datasets. Physical processing, fingerprint design, and the handling of structural duplicates determine how much watermark evidence survives and what that evidence can establish.","keywords":"watermarking; crystal generation; materials generative models; provenance; relaxation robustness; fingerprint auditing; collision-aware testing","topics":["generation"]},{"note_id":"ze600GlifV","number":"15066","title":"Optimal Crystal Flow for Fast and Reliable Crystal Generation","abstract":"$\\textit{De novo}$ crystal generation aims to discover novel materials by exploring the vast combinatorial space of atomic species and lattice geometries.\nWhile recent models based on diffusion and flow matching have shown strong generative capabilities, they often require a large number of sampling steps. More importantly, they struggle to generate reliable structures in out-of-distribution regimes, especially for systems larger than those seen during training.\nTo address these limitations, we introduce $\\textbf{Optimal Crystal Flow}$ (OCFlow), a flow matching framework that reduces unnecessarily long and curved coordinate paths by resolving $\\textit{intra-sample}$ ambiguity within each crystal. \nExperiments on the MP-20 and MPTS-52 benchmarks show that OCFlow is superior to or competitive with state-of-the-art baselines in sample validity and stability, with particularly strong performance on larger out-of-distribution systems while remaining effective with as few as ten network function evaluations.\nTogether, these results show that per-structure optimal couplings provide both efficient sampling and robust generalization in crystal generation.","keywords":"De novo Crystal Generation; Flow matching; Few step generation","topics":["generation"]},{"note_id":"yNxVtp6jwy","number":"15258","title":"SB-HyperGS: Spectral--Spatial Representation Capacity Reallocation for Sparse Hyperspectral Gaussian Splatting","abstract":"Hyperspectral 3D reconstruction aims to recover dense spectral radiance fields from sparse spectral observations. However, directly extending 3D Gaussian Splatting typically requires assigning an independent spectral representation to each Gaussian primitive, resulting in substantial spectral parameter redundancy and limiting spatial representation capacity under a finite parameter budget. We propose a material-efficient hyperspectral Gaussian Splatting framework that replaces independent per-Gaussian spectral storage with a compact material representation. By learning shared material spectral bases and Gaussian-specific local mixing coefficients, our method reduces redundant spectral parameters and reallocates the saved representation capacity to spatial primitives. We further introduce material-aware optimization and adaptive spatial refinement to improve reconstruction from sparse spectral observations. Experiments on multi-scene hyperspectral benchmarks show that our method achieves a better quality--parameter trade-off than direct hyperspectral Gaussian Splatting. Under matched parameter budgets, our method improves reconstruction quality while substantially reducing per-primitive spectral representation overhead, demonstrating the effectiveness of compact material representations for scalable hyperspectral neural rendering.","keywords":"3D Gaussian Splatting; Hyperspectral Imaging; Sparse Reconstruction; Neural Rendering; Material Representation Learning; Spectral Compression","topics":["graphics"]},{"note_id":"K8PWb781VM","number":"15359","title":"Drawing the Light of Image via Material Decoupled Illumination Representation","abstract":"Controllable image relighting is an important problem in image editing, and hand-drawn scribbles provide an intuitive interface for specifying the desired illumination. However, existing methods do not establish a consistent and effective mapping between scribble inputs and relighting results, limiting their ability to control illumination intensity, chromaticity, and complex spatial distributions. We address this limitation by introducing a material-decoupled illumination representation, termed the Lumi Map, which establishes an explicit mapping between user scribbles and the resulting illumination, thereby improving both relighting accuracy and controllability. Specifically, we use \na renderer to synthesize source image-Lumi Map-relit image triplets and train the model to predict the target relighting result conditioned on the Lumi Map. To mitigate the domain gap introduced by synthetic data, we further perform reconstruction training on real relighting pairs, improving the model's generalization to real-world images. Finally, we present Dior-Light, an image relighting method controlled by hand-drawn strokes. Extensive experiments demonstrate that our method outperforms existing approaches in relighting accuracy and enables effective control over illumination intensity and chromaticity on in-the-wild images.","keywords":"Image relight; Image Editing","topics":["graphics"]},{"note_id":"WjTLpG2rF6","number":"15520","title":"Style2Shape: Image Style Guided 3D Shape Material Generation","abstract":"We present Style2Shape, a framework for generating editable physically-based rendering (PBR) materials for a 3D mesh from a single reference image. Compared with text-guided methods, images provide high-bandwidth appearance cues but introduce two key difficulties: (i) faithfully transferring fine-grained visual style while preserving the target shape's structure, and (ii) producing physically-plausible, standard PBR assets rather than implicit, non-editable representations. To address these challenges, we propose a hybrid material representation that couples a retrieved procedural material (for physically-consistent reflectance) with a generated texture (for rich, instance-specific details), combined via learnable blending. Our pipeline consists of three stages: (1) structure-guided appearance transfer to synthesize pixel-aligned supervision, (2) hybrid initialization via physics-based retrieval and texture generation, and (3) physics-based optimization that jointly refines procedural parameters, UV transforms, and blending weights through differentiable rendering. Experiments show that Style2Shape produces high-fidelity, physically-plausible materials exported as standard PBR maps, making the results directly compatible with existing rendering workflows.","keywords":"procedural materials; texture synthesis; 3D material generation; physically-based ren dering; differentiable rendering","topics":["graphics"]},{"note_id":"92PBBdTtX5","number":"16268","title":"AtomWorld-Mirror: Macro-Step World Modeling of Critical Evolution Backbones for Materials Dynamics","abstract":"Atomistic simulation is a fundamental tool for studying long-term materials evolution, from diffusion and defect dynamics to interfacial reactions and fracture. Yet conventional simulators typically advance at microscopic resolution, spending substantial computation on low-impact local updates before reaching structurally consequential states---an {evolutionary-resolution bottleneck} that limits long-horizon simulation. \n  We propose AtomWorld-Mirror, a time-aware macro-step world model for the critical evolution backbone of atomic systems. For Step-Wise atomistic simulation, AtomWorld-Mirror distills short micro-event segments into physically reachable transitions between key states, jointly predicting sparse structural edits and accumulated physical time through latent macro-step dynamics. Local reachability, inventory conservation, and continuous-time consistency constrain each transition. By amortizing local atomic physics into a reusable latent macro model and replacing explicit micro-event replay with macro-step inference, this formulation provides a path toward substantially faster prediction of long-term materials evolution while preserving structural validity and time semantics. Across five atomic systems, spanning Cu-rich RPV steel irradiation aging, Cu--Zr metallic glass, and Li$_3$N-based anti-perovskite solid electrolyte, macro-step inference delivers a speed up of $10^3$ to $10^4$ times over event-by-event simulation.","keywords":"world models; atomistic simulation; AI for science","topics":["mechanics"]},{"note_id":"aPe7FanGrn","number":"16475","title":"MOTIF: LLM-Defined Material Taxonomies for OOD Property Prediction via Invariant Feature Selection","abstract":"Out-of-distribution (OOD) generalization remains a central challenge in materials property prediction, where models must extrapolate to novel chemistries beyond the training distribution. While large language models (LLMs) have demonstrated strong scientific reasoning, their direct use for quantitative prediction remains limited. To address this, we systematically evaluate multiple roles for LLM assistance, finding that only taxonomy-based grouping consistently improves OOD generalization over a strong kNN+GBT baseline. Building on this, we here propose MOTIF, a framework that leverages LLMs not as predictors, but as generators of candidate taxonomies that partition materials into chemically meaningful environments. These taxonomies are evaluated via training-only pseudo-OOD validation, and only those that improve generalization are retained. Invariant feature selection is then applied within each accepted taxonomy, followed by gated aggregation across taxonomies. We evaluate on 2D halide perovskites, where bandgap prediction must generalize across distinct organic spacer families. This poses a realistic OOD challenge due to the strong influence of spacer chemistry on electronic structure. On this benchmark, MOTIF reduces mean OOD MAE from 0.122 to 0.111 eV. Under a frozen dev/test protocol, the deployable configuration further improves errors from 0.123 to 0.117 eV (electronic bandgap) and from 0.181 to 0.173 eV (optical bandgap). Beyond this primary task, we validate transferability across additional materials datasets, including 3D perovskite solar cell efficiencies and Matbench benchmarks with structure-based splits. Across domains, MOTIF consistently improves robustness under distribution shift, outperforming expert-defined groupings, rule-based heuristics, and clustering baselines, while remaining competitive with strong classical selection methods. These results demonstrate that LLMs are most effective not as predictors, but as tools for discovering structure in data. This enables improved generalization in materials science tasks under realistic OOD conditions.","keywords":"perovskites; out-of-distribution generalization; materials property prediction; large language models; invariant learning; environment discovery; chemical taxonomy; invariant feature selection; materials informatics; distribution shift; scientific machine learning","topics":["properties"]},{"note_id":"gmLJ3n1dU9","number":"16824","title":"CRYSTALMO-TURBO: MULTI-OBJECTIVE TRUST- REGION BAYESIAN OPTIMIZATION FOR HIGH- PRECISION JOINT CRYSTAL STRUCTURE REFINEMENT","abstract":"Crystal structure refinement is a fundamental inverse problem in materials characterization, where structural parameters are optimized to reproduce experimental diffraction data. Conventional approaches, such as least-squares and likelihood-based optimization, rely on local search and often struggle with non-convex, noisy, and highly correlated parameter landscapes, particularly when integrating multiple diffraction modalities. Joint refinement of X-ray and neutron data is especially challenging due to their complementary but competing sensitivities, which are typically combined through scalarized objectives requiring manual weighting and leading to suboptimal solutions. We propose \\textbf{CrystalMO-TuRBO}, a multi-objective trust-region Bayesian optimization architecture for joint crystal structure refinement. The method models X-ray and neutron discrepancies as separate objectives and transforms the problem into a normalized maximization setting. A two-phase optimization strategy is introduced: Phase~1 performs global exploration using parallel trust-region Bayesian optimization across multiple scalarizations to identify promising regions of the parameter space, while Phase~2 conducts localized refinement within a shrinking region to achieve high-precision solutions. This design explicitly separates global search from fine-grained optimization, addressing the unique accuracy requirements of refinement tasks. We evaluate the proposed method on experimentally collected X-ray and neutron diffraction data from single-crystal Ho$_2$Ti$_2$O$_7$. Results demonstrate improved convergence, robustness, and parameter precision compared to classical refinement methods and Bayesian optimization baselines on refinement of a single-crystal pyrochlore material system.","keywords":"Bayesian optimization; crustallographic refinement; materials characterization","topics":["characterization"]},{"note_id":"EcisugBbcw","number":"16936","title":"MultiPhaseWorld: A Multimodal Benchmark for Structural Evolution in Multiphase Systems","abstract":"Large language models (LLMs) and multimodal large language models (MLLMs) are increasingly applied to scientific problems. However, existing scientific benchmarks primarily evaluate factual knowledge and static structure understanding, leaving evolution reasoning in diverse chemical environments underexplored. We introduce $MultiPhaseWorld$, a multimodal benchmark for evaluating scientific reasoning over structural evolution in multiphase systems. Multiphase systems involve complex interactions across phases and diverse chemical environments, making structural evolution challenging to understand. At the same time, this complexity provides a rich setting for evaluating the reasoning capabilities of LLMs and MLLMs across multiple scales, including adsorbate, surface, interface, layer, and bulk environment. MultiPhaseWorld contains 11,075 text and multimodal questions across 28 tasks and 14 capability dimensions, organized into four progressive levels: $Multiphase$ $Structure$ $Perception$, $Perturbation$ $Response$ $Reasoning$, $Structural$ $Evolution $ $Reasoning$, and $Structural$ $Prediction$. The benchmark is built from 336 solid-solid and 400 solid-gas systems. Controlled structural perturbations, structural optimization, and molecular dynamics simulations are used to generate structural responses, evolved structures, and evolution trajectories. The strongest models achieve only 58% average accuracy on text tasks and 51% on multimodal tasks, remaining more than 20 percentage points below the expert performance. Fine-grained results further reveal limitations in integrating physicochemical knowledge, reasoning about evolution relationships, and resolving subtle structural changes. Overall, current models show partial understanding of chemical information, but remain limited in linking explicit perturbations to structural responses, tracking state evolution, and predicting perturbation effects.","keywords":"Structural Evolution Reasoning; Multimodal Scientific Benchmark; Foundation Model Evaluation; Multiphase Materials","topics":["discovery","mechanics","benchmarks"]},{"note_id":"tIn6guAGic","number":"16991","title":"LP$^{2}$SLat: Learning Physical Priors on Structured Latents for Single-Image Generated 3D Assets","abstract":"Single-image 3D generators produce textured assets, but physical simulation requires material properties that vary across object parts. We introduce LP$^{2}$SLat, a dual-branch network that predicts material type, density, Young’s modulus, and Poisson’s ratio for single-image generated 3D assets. The network combines complementary information from structured 3D latents and the source image: the latent branch predicts a base physical field using local features and object context, while the image branch refines it through gated appearance-based corrections. The predicted properties are attached directly to the generated mesh, without additional 3D reconstruction or per-object optimization. For training, we transfer reference-part annotations through the shared source view, accommodating geometric differences between reference and generated assets and filtering ambiguous correspondences. Together, these components connect single-image asset generation with spatial physical-property prediction and downstream physics-based simulation.","keywords":"physical-property prediction; structured latent representations; single-image 3D generation; material estimation; multimodal learning; physics-based simulation","topics":["graphics"]},{"note_id":"myhhe2Rweg","number":"17154","title":"DreamRealm: Exploring and Materializing Hallucination Worlds for Trustworthy Vision-Language Models","abstract":"Multimodal large language models (MLLMs) remain prone to visual hallucinations when correct responses depend on subtle visual details. One line of post-training methods constructs visual contrasts through image retrieval, generation, or editing to improve fine-grained perception. However, these contrasts are not built around the model’s own hallucinations, making it difficult to ensure that supervision targets its actual perceptual confusions. Another line suppresses hallucinated outputs through response correction or preference learning under fixed image conditions, but leaves the design of supervision signals on the image-input side underexplored. Inspired by how humans correct misconceptions, we introduce DreamRealm, a post-training framework that explores diverse latent hallucinated responses, minimally edits original images to make them valid, and trains the model to assign each response to its supporting image. Our data construction pipeline, RealmForgePipe, mines observed and latent hallucinations from a target model and materializes them through image editing. Using hallucinations mined from Qwen3.5-9B, we construct the Realized Hallucination Dataset (RealmSet). Our training objective, RealmMatch, constructs a likelihood score matrix across image–response combinations and combines supervised learning with bidirectional contrastive losses to reinforce correct matches and suppress mismatches. Compared with the original Qwen3.5-9B model, DreamRealm improves performance across six visual perception and hallucination benchmarks, including gains of 7.76 percentage points in HallusionBench accuracy and 11.34 percentage points in MMVP pair accuracy. Together with ablation studies on data construction and training methods, these results demonstrate that hallucination assignment is a promising paradigm for improving visual perception and mitigating hallucinations. Our code is available at https://anonymous.4open.science/r/dreamrealm-3145.","keywords":"multimodal large language models; visual hallucination","topics":["other"]},{"note_id":"E6MRXk805b","number":"17343","title":"ELECTROLYTEMD-BENCH: HOW WELL DO AI AGENTS CONDUCT MOLECULAR DYNAMICS STUDIES ACROSS ELECTROLYTE SOLVATION REGIMES?","abstract":"AI agents are advancing the automation of molecular dynamics (MD) research, with the potential to accelerate discovery and design of lithium-battery electrolytes. However, whether they can autonomously complete scientifically reliable electrolyte MD studies remains insufficiently evaluated. We introduce ElectrolyteMD-Bench, which unifies dilute, high-concentration, and localized high-concentration electrolytes in a comparative study across distinct solvation regimes. The benchmark connects local coordination, ionic association, single-particle dynamics, and collective transport within one continuous research process. Agents autonomously perform system construction, equilibration, production sampling, property analysis, and cross-system interpretation, while deciding whether to correct errors, continue sampling, or stop. We audit each study along four dimensions: simulation validity, analysis validity, evidence integrity, and outcome calibration. Across eight model–harness configurations, all 24 system runs produced valid production trajectories, yet none of the eight studies satisfied all scientific requirements. Failures included missing analyses, incorrect physical definitions or numerical implementations, insufficient statistical support, and completion claims inconsistent with retained evidence. These results expose a gap between successful MD workflow execution and reliable scientific study completion. ElectrolyteMD-Bench therefore provides a foundational test and defines a key capability threshold that autonomous electrolyte simulation must cross to advance toward computation-first materials exploration.","keywords":"AI for Science; AI Agents; Electrolyte Materials; Molecular Dynamics Simulation; Benchmarking","topics":["discovery","benchmarks"]},{"note_id":"eSlrVOxFVe","number":"17851","title":"CrystalReasoner: Reasoning and RL for Property-Conditioned Crystal Structure Generation","abstract":"Generative modeling has emerged as a promising approach for crystal structure discovery. However, existing LLM-based generative models struggle with low-level atomic precision, while diffusion-based methods fall short in integrating high-level scientific knowledge. As a result, generated structures are often invalid, unstable, or do not possess desirable properties. To address this gap, we propose CrystalReasoner (CrysReas), an end-to-end LLM framework that generates crystal structures from natural language instructions through reasoning and alignment. Before emitting atomic coordinates, CrysReas writes a thinking trace that states the crystallographic symmetry, the local coordination environments and the physical properties of the target structure, so that the textual knowledge a language model already carries is turned into constraints on the coordinates it is about to write. CrysReas then employs reinforcement learning (RL) with a multi-objective, dense reward function to align generation with downstream desired properties such as physical validity, chemical consistency, and thermodynamic stability. For property-conditioned tasks, we design task-specific reward functions and train specialized models for discrete constraints (e.g., space group) and continuous properties (e.g., elasticity, thermal expansion). On the MP-20 benchmark, CrysReas raises the share of generated structures that are stable, unique and novel from $2.5\\%$ to $3.7\\%$ over the strongest prior language-model baseline re-implemented in the same pipeline, and each of three property specialists improves adherence to its target constraint over the unconditioned model. Our work demonstrates the potential of leveraging thinking traces and RL for generating valid, stable, and property-conditioned crystal structures. Code is available at: https://anonymous.4open.science/r/CrystalReasoner/","keywords":"Crystal structure generation; Large language models; Generative models; Reinforcement learning; Scientific reasoning; Property-conditioned generation; Materials discovery","topics":["generation","discovery"]},{"note_id":"YwCg2BlHGZ","number":"18197","title":"CRAFT: Reference-Guided Surface-Addressed Texture Generation for Composable 3D Assets","abstract":"While progress in native 3D texture generation can complete appearance beyond an observed view, existing texture generators often suffer from appearance bleeding when distinct geometric parts touch or intersect. This is because spatial voxelization can aggregate texture samples from multiple surfaces into a single texture state. Reference-image conditioning introduces a second ambiguity: features observed on a visible surface may be incorrectly transferred to nearby or occluded surfaces that share the same voxel. We introduce CRAFT, a native 3D texture-generation framework that augments each voxel coordinate with a discrete surface identity derived from UV-chart connectivity. This surface address preserves independent texture features for different surfaces throughout encoding, generation, and decoding. We further introduce visibility-routed reference conditioning, to establish accurate correspondence between visible surface tokens and reference-image features according to surface address and visibility. These designs preserve surface-level texture correspondence while retaining the efficiency of a sparse voxel-based representation. As a result, CRAFT reproduces the reference appearance more faithfully while reducing cross-surface color leakage and keeping distinct surface regions more clearly separated for component-level editing, separation, and recombination.","keywords":"Native 3D generation; PBR material generation; 3D texture generation; sparse voxel representation; visibility-routed conditioning; multi-view image conditioning","topics":["graphics"]},{"note_id":"DXlPmSof08","number":"18235","title":"TrussOrbit: Edge-Orbit Sequence Modeling for Truss Metamaterial Inverse Design","abstract":"Inverse design of periodic truss metamaterials requires accurate stiffness matching, physically valid generation, and a representation that spans diverse topologies. We present TrussOrbit, a structural language model conditioned on nine effective-stiffness components. Its Edge Orbit Truss Representation (EOTR) encodes node geometry and connectivity through Pmmm symmetry orbits. A unified data pipeline consolidates four public sources into 1.49 million canonical structures with common finite-element labels. We introduce Setwise Marginal Credit Optimization (SMCO) to optimize stiffness matching and binary validity across fixed-size candidate groups through sequence-level marginal credit. On the unified benchmark, TrussOrbit achieves the lowest NMAE, NRMSE, and MAPE among the compared models while covering the full dataset; it generates candidates 6.6 times as fast as the fastest external baseline. Representation and policy-objective ablations show complementary gains: EOTR shortens sequences and reduces invalid generation, while SMCO improves stiffness matching over supervised fine-tuning in both single-candidate and best-of-16 evaluation.","keywords":"inverse design; truss metamaterials; autoregressive generative models; symmetry-aware representations; reinforcement learning; set-level policy optimization","topics":["characterization","mechanics"]},{"note_id":"OXmqozKrvO","number":"18516","title":"CrystalGPD: Benchmarking the Capability Boundaries of Crystal Large Language Models","abstract":"Crystal large language models (LLMs) have emerged as a flexible paradigm for crystal structure generation, yet their capabilities remain difficult to characterize due to heterogeneous tasks, interfaces, representations, datasets, and evaluation protocols.\nTo brid
