","number":"34015","title":"Learning Topology-Aware Representations for Mechanics-Relevant TPMS Metamaterials","abstract":"Learning informative representations of mechanical Triply Periodic Minimal Surface (TPMS) metamaterials is important for mechanics analysis and structural design, yet existing methods have rarely explicitly supervised learned representations with information about global structural connectivity that is relevant to mechanical response. We propose a topology-aware representation learning framework that integrates persistent homology into a DMAE backbone to explicitly encode global structural connectivity. A persistence-guided masking strategy prioritizes patches associated with persistent topological features, while an auxiliary persistent-homology decoder encourages the latent representation to retain information about topological feature counts across connected components, tunnels, and voids. We evaluate the learned representations on two complementary TPMS datasets using family classification, mechanical-property classification, unsupervised clustering, and regression. Across the two datasets, our method demonstrates strong performance in both structural family and mechanical-property classification, improving family classification by up to 3.9% while achieving the best linear-probe performance. More notably, unsupervised property-clustering performance improves by up to 26.7% and 51.5\\% across the two datasets, while strong regression performance is retained with $R^2=0.993$. These results establish persistent topology as an effective inductive bias for representation learning of complex three-dimensional mechanical metamaterials.","keywords":"3D representation learning; AI4Science; Mechanical metamaterials; Persistent homology; Triply periodic minimal surfaces (TPMS)","topics":["properties","characterization","mechanics"]},{"note_id":"sZyzLB3n00","number":"34121","title":"Before the Furnace: Training LLM Agents for Inorganic Retrosynthesis","abstract":"Inorganic retrosynthesis connects materials discovery with synthesis planning by identifying precursor sets for a target composition. Effective recommendations require models to acquire evidence beyond composition and use it to assess and revise precursor candidates. We introduce PreWeave, an LLM agent trained for inorganic precursor recommendation through tool interaction. We train its interaction policy through supervised fine-tuning on distilled trajectories followed by agentic reinforcement learning. The policy learns to select tools and use their feedback to guide subsequent precursor decisions. Agentic training improves precursor-set Pass@1 accuracy from 53.81% for the base agent to 73.02%. PreWeave achieves competitive performance with task-specific models and tool-augmented frontier LLMs. Further analyses show that training makes reference-matching recommen- dations more consistent across runs and shifts tool use toward candidate construction, with retrieval contributing most to accuracy among the available tools. We will release tools, interaction trajectories, and training and evaluation code to support further research on agent policy training for materials synthesis.","keywords":"Inorganic retrosynthesis; LLM agents; Material discovery","topics":["discovery","synthesis"]},{"note_id":"wD2AKOEkZo","number":"34623","title":"Accelerating SO(2)-Equivariant Materials Models through Low-Precision Emulation","abstract":"Rotationally equivariant architectures improve the physical fidelity of machine-learned (ML) universal materials models based on graph neural networks (GNNs). However, their scalability is limited by the use of non-trivial, high-precision tensor operations during both training and inference. Adopting the reduced-precision formats of matrix multiplication units (MMUs), e.g., FP8 instead of FP32, provides massive increases in throughput, up to 30× (60×) on NVIDIA Hopper (Blackwell) GPUs, but may lead to drastic loss of accuracy. Here, we introduce tailored ‘emulated’ low-precision operations under the integer Ozaki scheme to accelerate the ‘SO(2)-equivariant’ processing layers of GNNs, which dominate the runtime of (1) many state-of-the-art ML interatomic potentials (MLIPs) and (2) most universal ML Hamiltonian (MLH) models. Our framework, FlashSO(2), outperforms TF32, the most accurate native low-precision MMU format, in throughput, accuracy, and memory footprint at once. At the SO(2) layer level, it reaches 40× (7×) the throughput of MALOQ’s (UMA’s) reference implementation, an MLH (MLIP) model, sustaining up to 236 (232) effective Tflop/s on an NVIDIA GH200, 3.5× the FP32 peak. At the model level, FlashSO(2) helps train MALOQ 3.9× faster than its pure-FP32 version while reducing peak memory by 58% at no loss in accuracy. In molecular dynamics simulations with UMA, the speedup factor is 3.3×, and the peak memory is reduced by 51%. FlashSO(2) thus pushes the speed-accuracy Pareto frontier of equivariant materials models beyond the native low-precision formats and substantially lowers the resources required to exploit their scaling laws.","keywords":"precision emulation; mixed-precision training; tensor cores; GPU kernels; kernel fusion; equivariant graph neural networks; machine learning Hamiltonians; machine learning interatomic potentials","topics":["potentials","electronic"]},{"note_id":"Ii3eF2LEYQ","number":"35057","title":"XRDBench: Benchmarking AI Agents on Experimental X-ray Diffraction Analysis","abstract":"Frontier multimodal large language models (MLLMs) increasingly demonstrate strong scientific-reasoning and coding capabilities, but whether these capabilities translate into reliable execution of domain-specific experimental workflows remains unclear. We investigate MLLM agents for X-ray diffraction (XRD) analysis, a widely used materials-characterization technique whose interpretation remains labor-intensive and expertise-dependent. We introduce XRDBench, a benchmark of 14 tasks organized into four tiers spanning peak-level perception, scientific unit analyses, multi-step characterization, and complex workflows such as phase identification, quantitative phase analysis, and Rietveld refinement. The tasks use predominantly expert-labeled experimental thin-film and powder data and are executed through a sandboxed agentic harness that provides multimodal inputs and access to scientific and crystallographic tools. We evaluate five proprietary frontier models and one open-weight model using task-specific outcome metrics and seven-axis process rubrics. We find that frontier models demonstrate strong XRD knowledge, although no single frontier model consistently outperforms the others, while the evaluated open-weight model remains behind. Removing visual access generally degrades performance, emphasizing the multimodal nature of XRD analysis. Agentic analysis may be particularly valuable for high-throughput and autonomous laboratories, where jointly analyzing related patterns across a compositional gradient reduces token use per pattern without accuracy loss. These findings highlight both the current limitations and the potential of agentic materials characterization.","keywords":"Benchmark; Agentic; AI4Science; Scientific Reasoning; X-ray Diffraction; Materials Science","topics":["discovery","characterization","benchmarks"]},{"note_id":"7616Ld0g9b","number":"35464","title":"PartSynth: Generative Sparse Part Structures for Compositional 3D Generation with PBR Materials","abstract":"High-fidelity compositional 3D assets require separable parts, detailed geometry, and physically based rendering materials. Existing methods either constrain part counts or incur inference costs that grow with the number of parts. Monolithic material generators also lack explicit part awareness. We introduce PartSynth, an image-conditioned framework for compositional 3D geometry and native part-aware PBR generation. Its core representation, the Sparse Part Structure (SPS), uses reusable set-indexed latent slots to represent multi-part structure, jointly generating each slot's activity and feature. Multiple active slots at the same spatial location represent overlapping components, while reusing set indices across disconnected components supports flexible part counts. Connected components of the decoded set-indexed volumes define individual parts. The SPS-guided geometry and PBR stages adapt pretrained monolithic generators to produce detailed multi-part geometry with PBR materials. Experiments show improved part-level geometry and PBR material quality over part-generation baselines, while maintaining competitive whole-shape fidelity.","keywords":"Compositional 3D generation; PBR generation; Sparse Part Structures","topics":["graphics"]},{"note_id":"S05Fx0fE93","number":"36217","title":"From Evidence to Action: Experience- and Knowledge-Grounded Evolution for Materials Discovery","abstract":"Iterative materials discovery entails a loop of evaluating generated candidates and feeding the results back into search. Yet evaluation alone does not determine which evidence a task should use or which action a changing search state should trigger. We study this evaluation-to-action gap in heterogeneous, budget-constrained materials discovery. We propose Evidence-to-Action (E2A), an evidence-grounded decision framework for iterative materials discovery that converts internal search experience and retrieved external knowledge into task-conditioned workflows and state-conditioned search actions. The Workflow Policy selects an evidence-use pathway once per run, while within the Full-evidence pathway, the Evolution Policy periodically selects an executable search action from the available state and evidence. In experiments across fourteen tasks, E2A improves hit rate and stable-success rate on eleven tasks each under matched GPT-4o run-native evaluation. Task-conditioned routing exceeds every fixed workflow on the historical return table, while a matched three-task controller study shows task-dependent gains from learned state-conditioned search actions. Together, these findings show how evaluated outcomes become useful through task-appropriate evidence pathways and state-conditioned actions.","keywords":"materials discovery; large language models; closed-loop discovery; reinforcement learning; retrieval-augmented generation; autonomous scientific discovery","topics":["discovery"]},{"note_id":"VY7VJTvJZW","number":"36681","title":"PartNeXt-Mat: Learning Pipeline-Authored Material Priors on Structured 3D Assets","abstract":"We introduce PartNeXt-Mat, a material-prior layer aligned with PartNeXt geometry, part masks, and hierarchy: 333,152 part assignments in 23,221 objects across 50 categories. Evidence fusion assigns a material, traceable grade resolution attaches applicable density and elastic priors, and verification-aware routing records solver caveats. A frozen 4,054-object visual benchmark studies part prediction and fixed-query completion. On its original split, category/name lookup reaches 82.9\\% accuracy, exposing near-total exact-key overlap. In an exploratory protocol withholding exact category/name keys from supervision, a fused visual-and-semantic model reaches 63.9\\% accuracy and 31.0\\% Macro-F1, compared with 57.8\\%/7.3\\% for a global prior, 54.5\\%/21.6\\% for train-only name/category backoff, and 57.8\\%/23.4\\% for a size-matched semantic MLP. The fused-minus-matched F1 gain is 7.60 points (key-cluster 95\\% interval 0.96--12.72). In name-disjoint completion, three observed labels raise set-attention accuracy by 1.67 points (0.70--2.63), although a support-aware table remains competitive. Numerical targets contain only 26 complete property tuples. The resource supports learning and completing authored, provenance-recorded part priors; it does not establish asset-specific measured mechanics.","keywords":"3D part understanding; material prediction; physical property priors; simulation-ready 3D assets; dataset and benchmark; shortcut learning; set attention; conditional label completion","topics":["graphics"]},{"note_id":"NVrYoaG9Ih","number":"37222","title":"A Journey to the Edge of Stability","abstract":"It has recently been found that deep learning often occurs at the \"edge of stability (EoS),\" where the maximum Hessian eigenvalue of the model is stabilized at a value reciprocal to the learning rate. However, what happens before we reach that regime? We fix a deep learning problem and vary first order optimization methods with dense learning rate sweeps. We then track the characterizing quantities of a learning trajectory: the loss, the sharpness, and the alignment between consecutive gradients. To our surprise, if we scale the learning rate by the dc gain of the optimizer, these traces from the sweeps from different optimizers almost perfectly overlap across a large range of learning rates. The dc-normalized optimizers have another role that only becomes apparent in high learning rates: they select when the sharpness value detaches from this universal curve and enters the edge of stability. Upon this discovery, we specify three distinct regimes with respect to the dc-adjusted learning rate: the low-LR regime where the trajectory is nearly insensitive to the optimizer, the high-LR regime, where the optimizer governs the sharpness according to the EoS reciprocal rule, and the in-between mid-LR regime where so-called progressive sharpening originates independently of the optimizer. This distinguishes the role of the optimizer, the learning rate, and the model in shaping the learning progress.","keywords":"optimization; edge of stability; root locus; sharpness; Hessian; curvature curriculum; learning rate; learning rate sweep; material property","topics":["other"]},{"note_id":"NCBhGVnZKb","number":"37281","title":"RMD: Relaxation-Inspired Masked Diffusion Language Model for Crystal Generation","abstract":"Language models offer a promising approach to crystal generation through unified sequence representations and flexible conditional modeling.\nHowever, standard autoregressive generation follows a unidirectional, left-to-right order, restricting predictions to the generated prefix and typically preventing earlier outputs from being revised using later structural information.\nTo address these limitations, we present the first application of a discrete masked diffusion language model to crystal structural text generation, enabling bidirectional prediction and iterative recovery.\nTo further address the challenge of identifying token positions that require continued adjustment, we propose Relaxation-inspired Masked Diffusion (RMD).\nInspired by the assess--update--reassess organization of physical relaxation, RMD combines relaxation-score-driven position selection with selective state updates, allowing existing content to be revised as the visible context evolves.\nState-of-the-art results on the evaluated de novo generation and composition-conditioned crystal structure prediction benchmarks, support RMD's potential to produce high-quality candidates for stable crystal discovery.\nOur code and datasets are available at https://anonymous.4open.science/r/RMD.","keywords":"Mask diffusion; Language model; Crystal structure prediction","topics":["generation"]},{"note_id":"GAHQHYQdqq","number":"37569","title":"2D-FET-BENCH: FROM SPATIAL REASONING TO FET DESIGN ON FLAKES","abstract":"Field-effect transistor (FET) layouts on exfoliated two-dimensional ﬂakes are typ-\nically drawn by hand for each ﬂake, placing contacts and gates to match its posi-\ntion and outline in optical micrographs. To our knowledge, no executable bench-\nmark tests whether language-model agents can perform this ﬂake-speciﬁc con-\nstruction reliably. We introduce 2D-FET-Bench V2, a benchmark of 128 lay-\nout tasks built from microscopy-derived ﬂake contours, including hole-containing\nﬂakes and multi-ﬂake tasks. Each task supplies a textual device speciﬁcation and\ncontour coordinates. An agent generates typed polygon and path operations ren-\ndered to GDSII. A deterministic veriﬁer checks geometric and structural require-\nments, and a separate integrity check veriﬁes that the supplied contours remain\nunchanged. Scripted reference layouts pass all 128 tasks, showing that every task\nis solvable. We evaluate six models and seven workﬂow and scaffold variants of\nGPT5.6-Luna, with ﬁve attempts per task. The best-performing conﬁguration in\nthe six-model panel, GPT5.6-Luna with ReAct-3, passes 62.3% of attempts and\nsolves 80.5% of tasks at least once (coverage) and 43.8% in all ﬁve attempts (con-\nsistency). ReAct-3 exceeds the one-pass Plan-and-Execute by 27.0 pass@1 points\nat 2.46× the tokens. An expert audit of one sampled veriﬁer-passing layout per\ncovered task, across ﬁve ReAct-3 conﬁgurations, accepts 56.4%–63.5% of them.\nThe benchmark evaluates geometric and structural FET layout construction.","keywords":"language model agents; benchmarking; geometric reasoning; constrained geometric construction; layout generation; electronic design automation; 2D materials; reliability evaluation","topics":["discovery","synthesis","benchmarks"]},{"note_id":"CuI49ixOax","number":"38086","title":"Transferable Boltzmann Generator for Direct Air Capture","abstract":"Screening metal–organic frameworks (MOFs) for direct air capture requires efficient estimation of dilute-limit CO$_2$ adsorption. Conventional Widom insertion spends many energy evaluations on unfavorable configurations, limiting the scale of screening with machine-learned interatomic potentials (MLIPs). We introduce a transferable MOF-conditioned Boltzmann generator for estimating the Henry coefficient without per-material retraining. The model uses equivariant MOF features from a pretrained MLIP to construct a normalized proposal over CO$_2$ position, orientation, and internal deformation, enabling importance-weighted estimation with flexible molecules. Periodically wrapped Gaussian position mixtures and conditional orientation and deformation mixtures support direct sampling and density evaluation, while MOF features are computed once and reused across draws. Across unseen MOFs spanning weak to strong adsorption, our model maintains high sampling efficiency and closely matches reference configuration and energy distributions after reweighting. It estimates flexible-gas Henry coefficients at roughly 700-fold lower inference cost than rigid-gas Widom insertion while capturing systematic effects of molecular deformation that additional rigid-gas sampling cannot recover.","keywords":"boltzmann generator; metal-organic framework; free energy estimate; material discovery","topics":["potentials","mechanics"]},{"note_id":"1aQ0OuhtdV","number":"38358","title":"Bicameral: Memory-Efficient Transformer via Latent Tensor Rematerialization","abstract":"Memory capacity limits the size of language models that can be trained and served on given hardware.\nQuantization lowers the precision of each weight, but leaves the number of trainable parameters unchanged, and with it the gradients and optimizer states that dominate training memory.\nWe introduce \\textbf{Latent Tensor Rematerialization} (LTR), which generates each weight matrix on demand from compressed latent codes with small learned generators, and in doing so converts a standard matrix into a recomputable activation. This reduces memory usage by directly storing fewer parameters and optimizer states, as an alternative to lowering precision. Moreover, LTR leverages underutilized compute to reduce the number of parameters that must be stored, and its full-precision parameters remain compatible with quantization.\nWe validate the effectiveness of LTR with \\textbf{Bicameral}, a LLaMA-style transformer architecture whose weight matrices are generated on demand by small decoders.\n%When trained to 10B tokens, a Bicameral model with half the stored parameters of a 2B-parameter transformer matches its validation perplexity and outperforms a standard transformer with the same number of stored parameters.\nWe train Bicameral models with 2B effective parameters to 10B tokens, and find that Bicameral matches the uncompressed baseline on perplexity and zero-shot benchmarks, while reducing stored parameters by 50\\% and training memory usage by up to 48\\%.","keywords":"Large Language Models; Transformer Architecture; Tensor Rematerialization; Memory Efficient Training; Model Compression; Hypernetworks","topics":["other"]},{"note_id":"rz5AvSazNN","number":"38424","title":"FlexMOF: Joint Composition and All-Atom Coordinate Generation for Metal Organic Frameworks","abstract":"Metal--organic frameworks (MOFs) are porous crystals assembled from metal nodes and organic linkers, offering tunable chemistry and pore structures for gas storage, carbon capture, and catalysis. Their vast design space presents an opportunity for AI-assisted discovery, but useful generation requires more than selecting building blocks: these building blocks must assemble into a periodic crystal with appropriate atomic conformations and pore geometry. Existing approaches often restrict the internal geometry of building blocks or learn composition independently of structure, limiting the connection between composition generation and its three-dimensional realization. We introduce FlexMOF, a unified model for joint composition and all-atom structure generation. Its coordinate diffusion process incorporates molecular topology and periodic interactions while allowing every atomic coordinate and the lattice to evolve. Building on this structural representation, joint training uses a composition encoder shared by the composition and structure pathways, together with latent features, to propagate coordinate supervision into the graph representation used for composition generation. This enables composition learning to benefit directly from modeling three-dimensional structures. FlexMOF achieves significantly better single-sample crystal structure recovery than the reported state-of-the-art all-atom baseline. Joint composition and structure generation also yields chemically and structurally valid, novel, and unique MOF candidates. By connecting flexible all-atom modeling with composition learning, FlexMOF represents an important step toward AI-assisted MOF discovery through the unified design of composition and all-atom periodic structure.","keywords":"Metal–organic frameworks; Crystal structure generation; Diffusion models","topics":["generation"]},{"note_id":"4U4CospadM","number":"38471","title":"Coarse-to-Fine MOF Generation with Periodic U-DiT and Verifier-Guided Linker Editing","abstract":"Generating novel metal–organic frameworks (MOFs) with application-relevant pore architectures is a vital challenge, requiring both diverse structural exploration and precise geometric control. Small pore apertures are particularly compelling targets given their prevalence in experimental MOFs and critical role in selective molecular separation. To pursue this objective, we introduce CoFi-MOF, a coarse-to-fine framework combining global MOF generation with target-directed linker editing for fine-grained control of small pore apertures, and evaluate its performance in the challenging ultra-microporous regime. At the global scale, a periodic diffusion Transformer generates pore geometry conditioned on the target pore-limiting diameter within a signed-distance-field latent space, which a learned topology-aware Constructor translates into discrete MOF structures. At the local scale, geometric measurements identify promising structures for local refinement by Multi-Edit-Former, which proposes chemically feasible linker modifications to adjust their apertures. Reassembly and verification establish whether these edits improve the realized pore match. Experiments convincingly show that CoFi-MOF generates structurally diverse MOFs with pore distributions concentrated around targets. We further expand PORMAKE’s linker library with carboxylate-based building blocks and introduce MOF-Edit-DB, a large-scale dataset of edited MOFs to train and evaluate target-directed structural editing models. Together, CoFi-MOF enables precise small pore targeting in assembled MOFs and provides a reusable foundation for learning structural refinement.","keywords":"metal-organic framework; material generation; AI for science; Periodic Diffusion Transformers; Verifier-Guided Refinement","topics":["generation"]},{"note_id":"dBEKTI1K3J","number":"38527","title":"Condition-Informed Prediction and Resource-Aware Selection for Inorganic Materials Synthesis Planning","abstract":"Materials synthesis planning (MSP) connects AI-driven materials discovery to\nexperimental realization by proposing precursors, synthesis operations, and\nprocessing conditions for a target material. Existing approaches predict\nthese components separately or in pairs and treat conditions only as a\nprediction target. Consequently, MSP remains centered on recipe prediction: it leaves\nunexplored how conditions can serve as process context for constructing\nsynthesis routes, and it does not address which candidate routes should be\nexecuted under limited experimental resources. We propose CondMSP, which\nextends MSP from recipe prediction to execution-aware planning. CondMSP\npredicts temperature, time, and atmosphere by combining a joint predictor\nwith variable-specific experts, and then uses these predictions both as\nprocess context, grounding the generation and retrieval of operation\nsequences, and as execution requirements, specifying which thermal stages\ncan share a furnace run and at what cost. This specification is held\nfixed across all compared methods; within it, CondMSP ranks routes across\nprecursor sets by a common utility and, under furnace budgets, jointly selects\nroutes and allocates their thermal stages by constrained optimization.\nCondMSP improves condition and operation prediction and, under this\nshared constraint, raises reference-recipe recovery from 27.9\\% to 32.9\\% at\nthree simulated furnace runs per target and from 34.7\\% to 40.0\\% at 30\ntrials, while a new evaluation set of 2,344 targets supports generalization\nbeyond oxide-dominated training chemistry.","keywords":"Materials Synthesis Planning; Inorganic Materials Synthesis","topics":["synthesis"]},{"note_id":"GkbXvtzovu","number":"39978","title":"Native Generation of Tileable Pixel-Art Textures from a Material Name and a Target Colour","abstract":"Game and mod textures are authored natively at tiny canvases: a 16×16 tile is not a downscaled photograph but a grid in which every pixel is a design decision, the palette holds at most a handful of slots, and the tile must stay continuous across its own wrap boundary because it is used tiled. We study the task of painting a solid-colour region of an image with a tileable pixel-art texture given only a material name and the region's colour, and we generate it natively at the target resolution rather than rendering large and downsampling. Our model decodes palette-index and luminance-rank tokens in parallel, keeps tileability by construction through a toroidal relative attention bias that adds no parameters, and conditions on palettes retrieved from a memory of artist palettes. Against the strongest render-and-downsample pipeline, annotators prefer our 16×16 tiles in 73.6% of decided pairs; on the region-colouring task the de-biased judge prefers them 60.3% (family interval excludes 0.5), and that judge's 57.3% on the name-to-texture comparison is a lower bound on the same human reading. The tiles also win the majority of judge comparisons against a same-data pixel diffusion model, score distillation, and artist-tile retrieval. Measured end to end, a tile takes 0.51 s, 28× faster than the strongest render pipeline and four orders of magnitude faster than score distillation. Getting these comparisons to mean anything required repairing the rulers: we show that render-and-downsample baselines collect a structural gain purely from a larger canvas, that a widely used tiling score awards a perfect value to a flat fill, and that a pairwise judge's resolvable-rate floor is far below chance.","keywords":"pixel art generation; tileable texture synthesis; masked generative transformer; retrieval-augmented generation; color-conditioned image generation; relative position bias; evaluation of generative models","topics":["graphics"]},{"note_id":"2M6g07s7qO","number":"40770","title":"Harness Meets Diffusion: Single-ReAct-Guided Crystal Generation and Knowledge-Grounded Superconductivity Search","abstract":"Scientific crystal discovery requires generators that can adapt their search to\n  explicit property targets. We introduce a single-ReAct controller for a frozen\n  LLM-diffusion crystal generator. The controller uses batch summaries and\n  retrieved materials knowledge to guide subsequent LLM proposals. Selected\n  candidates then undergo diffusion refinement. In open-ended generation, it raises\n  the stable, unique, and novel fraction ($\\mathrm{SUN}$) from $0.2131 \\pm 0.0015$\n  to $0.3436 \\pm 0.0749$ across three matched seeds, with a gain in every seed and\n  a decline in reference-distribution fidelity. We then apply the controller to\n  superconductivity screening using a frozen $T_c$ predictor and a separate\n  structural predictor for evaluation. In comparisons with the same generator and\n  candidate budget, the controller achieves $\\mathrm{SUN} = 0.455 \\pm 0.040$ across\n  four seeds, compared with $0.257 \\pm 0.007$ for best-of-$k$ and $0.241 \\pm 0.009$\n  for verifier-only selection. Across six seeds, it generates $2.26\\times$ as many\n  candidates with predicted $T_c \\ge 20$ K and nearest-training-composition Jaccard\n  distance at least $0.20$ as a knowledge-only policy. Adding a superconductivity-\n  tuned generator further increases the joint stable, unique, novel, and\n  predicted-$T_c \\ge 20$ fraction from $0.1723$ to $0.2843$ in a matched run. These\n  results show that feedback-driven control improves the computational screening\n  yield of an existing crystal generator across two scientific objectives.","keywords":"Crystal Generation; Diffusion Models; Large Language Models; Materials Discovery; Superconductivity Search; Verifier-Guided Generation; ReAct Agents; Scientific Machine Learning; Inverse Materials Design","topics":["generation","discovery"]},{"note_id":"W9HYjIkmCW","number":"40921","title":"PXRD-Bench: How Close Are We to Determining Crystal Structures from Powder Diffraction?","abstract":"Determining crystal structures from powder X-ray diffraction (PXRD) would enable routine characterization of newly synthesized materials, including those absent from reference databases. Generative models offer a promising approach, but existing evaluations remain fragmented and largely assume single-phase samples with known composition. To fill this gap, we introduce PXRD-Bench, a unified benchmark that extends evaluation to unknown per-element atom counts and recovery of both structures in two-phase mixtures. It provides approximately 4.1 million training structures with simulated PXRD, tests generalization to unseen compositions and structural prototypes, and evaluates recovery from experimental PXRD after excluding structurally matching training entries. To provide a strong reference baseline, we also introduce Bragglite, a PXRD-to-structure model developed through a systematic study of PXRD modeling choices. It achieves a 44.2\\% Top-1 match rate on experimental RRUFF patterns with known composition, 24.6\\% above the strongest prior baseline. Further analysis yields several key findings: some models fail to benefit from experimental PXRD, while generalization to unseen structural prototypes and recovery from two-phase mixtures remain challenging. Together, our benchmark, systematic studies, and Bragglite clarify the capabilities and limitations of current PXRD-to-structure models.","keywords":"Powder X-ray diffraction (PXRD); Crystal structure determination; Sim-to-real transfer; Benchmarking","topics":["characterization","benchmarks"]},{"note_id":"wbey6FqqUN","number":"41181","title":"Tokenize the Physics, Not the Pixels: TessTok and Fold-Flow Quantization for Material Microstructures","abstract":"Visual tokenizers compress images into the tokens that latent generative models learn from. Existing tokenizers are built for natural images: a fixed latent grid, a codebook or straight-through estimator, and a perceptual objective. A physical field is instead a set of objects that a simulation reads directly. *Can a discrete tokenizer compress a material microstructure field by two orders of magnitude and return a field a crystal-plasticity solver can run?* We present **TessTok**, which encodes a polycrystal as sparse quantized Laguerre grain seeds and regrows it deterministically. Its **Fold-Flow Quantizer (FFQ)** needs no codebook or straight-through estimator and learns where to place its levels. At $10.4$ kbit per $256{\\times}256$ field reconstruction, TessTok reaches $24.4$ dB and $8.9$ rFID and matches $93\\%$ of the grains, against $22.1$ dB, $45.1$ and $69%$ for ViT-VQGAN at $13.3$ kbit. At matched bits, FFQ beats every codebook and binary quantizer on all pixel and orientation metrics  with no codebook to collapse. TessTok also keeps $90\\%$ of grain area at $4.4$ kbit, below the rate of MAGVIT-v2. On ImageNet, with its grain-specific parts switched off, the same code gives the highest PSNR among the latest tokenizers, though not the best perceptual scores and compression rate. Tokenizing physical-object fields instead of pixels, lets our model work at many bit budgets, and lets a reconstruction be governed by the physical simulation needs.","keywords":"visual tokenizer; vector quantization; Laguerre tessellation; representation learning; inverse design; materials science","topics":["characterization","mechanics"]},{"note_id":"oDvUG2HHHo","number":"41854","title":"OneResearchBench: Benchmarking Research Agents for Research Synthesis from Real-World  Source Materials","abstract":"Progress toward general-purpose AI agents requires capabilities beyond isolated question answering. Agents must operate reliably across diverse domains, handle complex user-provided materials, and complete long-horizon knowledge tasks that involve gathering evidence, integrating information, and producing trustworthy outputs. Existing research-agent benchmarks, however, largely start from research questions or open information needs, and give limited attention to research that begins from real-world source materials. We define source-grounded research synthesis, a task in which an agent must first understand provided materials, then conduct external research, integrate the resulting evidence, and produce a grounded long-form report. To evaluate this capability, we introduce OneResearchBench, containing 101 human-constructed tasks across six domains and 3,671 expert-written, task-specific rubric rules. The rubrics evaluate source understanding, external research, evidence grounding, technical accuracy, citation traceability, and structure quality. Our criterion-level evaluator achieves a Pearson correlation of 0.909 with expert scores on the human calibration subset. We evaluate eight model–harness configurations. Under direct report generation, no system scores above 44.75/100, with external research and citation traceability emerging as the largest capability gaps. A structured skill-driven research workflow improves Claude Opus 4.8 with Claude Code from 44.75 to 53.07 (+8.32), and GPT-5.5 with Codex from 43.03 to 47.90 (+4.87). These results show that source-grounded research synthesis remains challenging for current research agents. OneResearchBench provides a benchmark for measuring progress on this task.","keywords":"Research Agents; Agent Skills; Deep Research","topics":["discovery","benchmarks"]},{"note_id":"7Z5isUmTiG","number":"42230","title":"Autonomous Weighted Schema Direct Preference Optimization for Materials Discovery","abstract":"Generative artificial intelligence can create candidate molecules and materials for tasks in the physical and biological sciences, but it can be limited in producing better candidates along characterized properties than those of the systems in the training data. Reinforcement learning, in particular Direct Preference Optimization (DPO) on chemical language models (CLMs), can shift output chemical distributions in desirable ways, but constructing preference datasets in an autonomous manner presents further challenges. Here, we outline a novel methodology for multi-objective optimization where a defined target region of chemical properties is compared to generated distributions and used for the updating of preference weights that partition generated molecules into a cohesive, multi-object preference dataset. In this process, termed autonomous weighted schema (AWS) DPO, we observe enhancements to generated distributions beyond that observed without autonomous weight updating as well as reward functions that put the multi-objective frontier into a single score, and we thereby present a general algorithm for tuning generative models for materials discovery.","keywords":"reinforcement learning; preference optimization; multi-objective optimization; materials discovery; chemical language models","topics":["generation"]},{"note_id":"cz8V6nN1qw","number":"42296","title":"The TMEX Benchmark and a Fixed-Topology Multi-Agent Extraction Framework for Building an AI-Ready Topological Magnetism Database","abstract":"Traditional scientific databases have largely relied on experimental data collected and curated by researchers. As data-driven and AI-assisted research has expanded, large language models and multi-agent systems have made it feasible to construct AI-ready databases by extracting structured information from scientific literature at scale. However, topological-magnetism papers span diverse material systems, experimental methods, and physical descriptions, so deciding which scientific dimensions to preserve and how to organize the evidence still requires domain expertise. Together with physics experts, we develop TMEX (Topological Magnetism EXtraction), an expert benchmark that integrates a domain schema, expert-annotated gold records, and a semantic judge. Guided by TMEX, we iteratively refine a fixed-topology multi-agent workflow that routes single-material and multi-material papers, indexes figure evidence to schema fields, and assigns seven scientific dimensions to parallel specialists. The judge's field-level scores localize extraction errors and guide targeted revisions to the agent topology and prompts. Instantiated on GPT-5.5, the fixed topology reaches 0.924 F1 on TMEX (0.942 precision, 0.910 recall). On Eval 53, with the backbone held fixed, DeepSeek-V4-Pro improves from 0.773 to 0.927 F1 (+15.4) at $0.19 per paper. We release TMEX, the pipeline code, and the TMEX database of 8,082 papers.","keywords":"large language models; scientific information extraction; datasets and benchmarks; materials database; topological magnetism","topics":["discovery","characterization","benchmarks"]},{"note_id":"OiHIk3MiLL","number":"42376","title":"DSTex: Dense Surface Decoding for Native PBR Texture Generation","abstract":"Given a mesh and a reference image, native physically based rendering (PBR) texture generation synthesizes relightable surface materials directly in 3D. Latent-based frameworks typically compress these materials with an autoencoder and learn to generate the resulting latents through diffusion. Reconstructing fine lettering and intricate patterns from compact latents remains challenging, while increasing their number raises diffusion costs during training and sampling. We present DSTex, a native PBR texture generation framework that improves reconstruction by expanding the decoder's spatial feature capacity at a fixed latent count. Its autoencoder, DS-VAE, encodes material point samples into compact anchor tokens and expands them at finer locations sampled from the known mesh. Shared feature projection and relative-position modulation adapt each latent's content to these locations, constructing fine anchor tokens for continuous material queries without adding diffusion tokens. An image- and geometry-conditioned rectified-flow model generates the compact latents, which DS-VAE decodes into PBR materials on the input mesh. Quantitative and qualitative evaluations demonstrate that DSTex improves material reconstruction at matched latent counts and outperforms the evaluated open-source baselines in PBR texture generation.","keywords":"Native 3D Texture Generation; Latent Diffusion Model; PBR Material Generation","topics":["graphics"]},{"note_id":"hXQZONZ5eS","number":"42570","title":"Multi-property Feynman-Kac Steering of Crystal Diffusion Models","abstract":"Pretrained diffusion models provide powerful priors for generating new materials, including inorganic crystals, but generating useful materials requires satisfying specific chemical and physical properties, from conductivity to band gaps. Existing approaches either retrain models for new target properties  or steer only the atom coordinates and lattice during generation, leaving composition unchanged despite its fundamental role in determining physical properties.  We present FK-ReMask, an inference-time, gradient-free method that steers both the continuous and discrete channels of a pretrained crystal diffusion model. During generation, FK-ReMask  maintains multiple denoising trajectories and replicates promising candidates using Feynman--Kac particle selection. However, selection alone is insufficient: in the atom-type channel, committed elements cannot be revised, so cloning propagates existing compositions and limits the population's ability to explore new ones. We address this with an atom re-masking mechanism, which reopens committed sites during the generation process and allows alternative compositions to emerge. Across four electronic, photovoltaic, and mechanical objectives, our method improves the yield of SUN (stable, unique, novel) and property-on-target materials. We further demonstrate joint steering of three photovoltaic properties, showing that multiple physical objectives can be specified entirely at inference time without retraining.","keywords":"inference-time steering; diffusion models; multi-objective optimization; generative materials design","topics":["generation"]},{"note_id":"FG8X06w0RL","number":"42686","title":"REPAIRING CORRUPTED CRYSTAL STRUCTURES WITH GEOMETRY-GUIDED MULTI-BRANCH RELAXATION","abstract":"Crystal repair complements generation: recovering the intended structure from a corrupted input at fixed composition, using the geometry that survives corruption. Every atom is still there; which positions may be trusted is not known in advance. A shared collision projection reads short-range separations in the input and proposes where to start. Five CHGNet refinement routes relax that start under different degrees of freedom and tolerances. A frozen ExtraTrees selector reads observable geometric changes and candidate-level energy, force, and stress, then emits one structure. Clean structures and corruption labels stay hidden at inference and inform matching and subgroup analysis only after every prediction is fixed. On 2,520 corrupted test inputs, multi-branch repair matches 76.35\\% (1,924/2,520), against 44.01\\% (1,109/2,520) for relaxation-only and 29.96\\% (755/2,520) for the unchanged input, the share already inside the matcher tolerance; the 32.34-point gain over relaxation-only is bought with five relaxations against one. Match is highest for atom overlaps and lattice distortions, and lower for coordinate noise and coordination defects.","keywords":"artificial intelligence for science; crystal structure refinement; materials discovery; feedback-conditioned editing; reflection; structured repair plans","topics":["generation","potentials"]},{"note_id":"GwG3mCfCht","number":"42774","title":"Atomistic Language Models Understand and Generate Materials","abstract":"Atomistic structure and natural language have long been modeled separately, with language models either calling atomistic models as tools or being fine-tuned on lossy textual encodings that discard atomistic information. We introduce **Atomistic Language Models (ALMs)** to pursue native multimodality, in which a single language backbone understands atomistic structures, generates materials from natural language, and optimizes crystal structures as instructed by text. By unifying a pretrained atomistic encoder, large language model, and denoising diffusion model through purely continuous projectors and staged training, ALMs achieve state-of-the-art results on crystal structure prediction and *de novo* generation. ALMs are enabled by a *continuous bridge that maps language model embeddings directly into the steering space of atomistic diffusion*, and are assisted by **Text-to-Crystal Feynman–Kac (T2C-FK)**, a particle-based sampler that scores partial denoising trajectories to enforce stoichiometric targets at inference time. We also introduce **ALM Bench**, the first benchmark for language-instructed crystal generation and materials optimization. ALMs beat frontier LLMs, including GPT-5.6 Sol, on inorganic crystalline doping, inverse design, and generation for desired applications. We release all code, training data, and model weights.","keywords":"Multimodal machine learning; materials inverse design; large language models; inorganic crystals","topics":["generation","benchmarks"]},{"note_id":"Uyb7QHMhwc","number":"42790","title":"When Feedback Is Not Reward: Active Search under Pool-Dependent Utility","abstract":"Active search typically assumes that querying an item reveals the label used by\n\tthe search objective. In many scientific settings, however, a query returns a\n\tlocal measurement, while whether the queried item counts as a discovery depends\n\ton a shared latent pool. We formalize this setting as active search with\n\tpool-dependent utility. Under additive terminal utility and equal query costs,\n\tthe one-step Bayes action ranks candidates by posterior terminal-success\n\tprobability. With two queries remaining, an exact decomposition shows that\n\tlookahead improves the first action only when observation-induced decision value\n\toffsets the posterior-utility gap from leaving a higher-ranked candidate.\n\tRepeated greedy search can be arbitrarily suboptimal in the worst case, while a\n\tweak-posterior-movement condition bounds its loss. On 230 MatPES PBE-to-r2SCAN\n\tsystems, using complete-pool rather than history-visible membership to define\n\tterminal success improves first-query utility by $0.657$ confirmations and\n\tbudget-curve area by $6.617$. Once the terminal event is fixed, posterior\n\tintegration provides little additional utility over a deterministic\n\tcomplete-pool score. An anchored two-step rollout selects a different action in\n\t$91.7\\%$ of systems at $B=6$, but improves terminal utility by only $0.039$\n\tconfirmations per system at $46.9\\times$ the measured wall-clock cost. These\n\tresults separate the effect of specifying the terminal event from the value of\n\tdeeper planning.","keywords":"active search; Bayesian decision-making; sequential experimental design; uncertainty quantification; pool-dependent utility; materials discovery","topics":["discovery"]},{"note_id":"2omZ6ZXPDA","number":"42801","title":"From Localization to Quantification: Structure-Guided Attribute Prediction under Weak Supervision","abstract":"Quantitative microstructural analysis often relies on instance segmentation to estimate material attributes. However, dense instance annotations are costly to obtain, whereas image-level attribute labels are widely available in the literature and technical reports. This supervision gap hinders the effective use of abundant attribute labels while preserving essential structural information. To address this challenge, we propose Structure-Guided Attribute Prediction (SGAP), a two-stage framework that leverages scarce structural annotations alongside abundant image-level attribute labels. In the first stage, SGAP learns structural representations from a limited set of instance masks. In the second stage, a frozen structural pathway provides localization priors, while a LoRA-adapted attribute pathway extracts task-specific features for attribute prediction. SGAP uses segmentation-derived spatial priors to guide feature aggregation and predicts attributes through learned heads, without explicit per-instance geometric measurement. Experiments across two distinct scenarios and domains show that SGAP consistently outperforms both segment-then-measure approaches and direct prediction baselines, achieving state-of-the-art performance. These results support the use of segmentation-derived localization priors for attribute learning under heterogeneous supervision.","keywords":"Microscopy Image Analysis; Microstructure Quantification; Material Attribute Regression; Structure-Guided Learning","topics":["characterization"]},{"note_id":"6GUMNWFPfI","number":"43924","title":"A Unified Framework for Joint Crystal Generation and Property Prediction","abstract":"Crystal generation and property prediction are two fundamental tasks in the discovery of novel materials. Recently, AI-based frameworks have shown substantial promise for both tasks; however, they have largely evolved as separate paradigms, since each requires distinct representations and inductive biases. Predictive models typically rely on local, neighborhood-based multigraph representations, whereas generative models often operate on global three-dimensional crystal representations. In this work, we investigate whether these complementary representations can be unified to jointly support crystal generation and property prediction. To this end, we propose CrysUniNet, a unified framework that learns a shared embedding space by integrating local and global representations of crystal structures, enabling a single latent representation to support both generative and predictive tasks. We first train a VAE with a unified encoder and a multi-task decoder that maps crystals into this latent space, after which a latent diffusion model learns to generate new latent embeddings. Once trained, CrysUniNet can generate novel crystal materials via the latent diffusion model, while the VAE's property-prediction head enables property prediction for any target material. Empirically, CrysUniNet performs strongly on both tasks, generating $\\mathbf{39.15\\%}$ more SUN crystals than the strongest SUN baseline while also predicting the properties of existing structures more accurately.","keywords":"ML4Materials; Latent Diffusion Models; Crystal Materials; Material Generation; AI4Science; Crystal Property Prediction","topics":["generation","properties"]},{"note_id":"jvyIZKLCMl","number":"44243","title":"MatEval: A Benchmark for LLMs from Knowing to Doing in the Materials Preparation Research Loop","abstract":"Large language models (LLMs) hold promise for materials science, yet existing benchmarks fall short of covering the full research loop of real-world materials preparation. To bridge this gap, we present MatEval, a comprehensive benchmark assessing LLMs across the materials preparation research loop: from foundational competencies (Materials Knowledge QA and Instruction Understanding) through five stages (Literature Understanding, Data Retrieval, Experimental Planning, Experimental Execution, and Experimental Result Analysis). MatEval contains 24 tasks with a total of 2,135 expert-curated instances and stage-specific scoring protocols for evaluating model capabilities from knowing to doing. We evaluate 24 general-purpose and materials-specialized LLMs. Results reveal systematic performance differences across stages, with no model performing consistently across the full loop. Notably, materials-specialized models show no consistent advantage over general-purpose models. MatEval redefines evaluation from answering materials questions to operating across the materials preparation research loop, providing evidence that current LLMs remain unable to complete the full research loop.","keywords":"Benchmark; Materials Science; Large Language Models; AI4Science","topics":["discovery","synthesis","benchmarks"]},{"note_id":"Iqm7249gqD","number":"44300","title":"AnchorPose: Geometry-Aware MOF Assembly through Meso-Grained Pose Generation","abstract":"Predicting metal-organic framework (MOF) structures from given building blocks requires recovering their positions and orientations in a periodic crystal. The spatial effects of rotation errors are geometry-dependent and anisotropic: the same angular error can produce different atomic displacements depending on block size, shape, and rotation axis. Angular error alone, without reference to the specific block geometry, therefore cannot fully describe the spatial consequences of a pose error. We introduce AnchorPose, a meso-grained pose generation framework that explicitly incorporates building-block geometry. AnchorPose uses a small set of representative atoms as anchors, combines local shape with the current spatial state for pose prediction, and generates anchor positions with Bayesian Flow Networks. Rigid alignment with the known local geometry then recovers the poses of complete building blocks. This representation connects point-level spatial prediction with block-level structural constraints, bringing block geometry directly into generation while preserving intra-block structure without treating all atomic coordinates as assembly variables. Experiments on the MOF structure prediction benchmark show that AnchorPose achieves higher structure match rates than existing methods.","keywords":"metal-organic frameworks; crystal structure prediction; generative modeling","topics":["generation"]},{"note_id":"S2cQcRF30w","number":"44351","title":"Towards Literature-Grounded Agentic Co-Crystal Synthesis Design","abstract":"Co-crystallization has become an important approach for modulating the physicochemical properties of drug molecules, yet experimental development remains challenging. While recent machine-learning methods have advanced co-crystal screening, the downstream problem of synthesis design remains largely unresolved. We present CoSyn, a literature-grounded LLM-based agentic framework for supporting co-crystal synthesis design that combines (i) hierarchical extraction of method-specific synthesis information, (ii) a large-scale machine-readable database of 20,783 co-crystal synthesis records across multiple methods, and (iii) method-specific starting-condition prediction for new molecular pairs. We systematically evaluate each component using manually annotated datasets and prospectively validate recommended conditions, achieving phase-pure co-crystals for three of four held-out pairs. At the system level, tool-augmented orchestration improves the average score on our targeted domain benchmark from 1.88 for an LLM without tool use to 3.58 on a 1–5 scale. These results demonstrate that structured, literature-derived experimental evidence can support co-crystal synthesis decision-making beyond pair-level screening.","keywords":"Co-crystals; Synthesis design; Large language models; Agentic AI; Information extraction; Condition prediction","topics":["discovery","synthesis"]},{"note_id":"nVgcGyo4zD","number":"44562","title":"GLASS: Global Latent Aggregation with Slot-based Set Decoding for Scalable All-Atom Crystal Generation","abstract":"Generative models for crystals enable the discovery of novel structures, but scaling all-atom generation to larger systems such as metal–organic frameworks remains challenging. We connect this difficulty to the correspondence problem of particle-space generation. Even on a single fixed target set, index-free permutation-equivariant particle flows require substantially more training for reliable generation as set size and density increase, under both independent and optimal-transport couplings. To resolve this challenge, we introduce GLASS—Global Latent Aggregation with Slot-based Set Decoding, which encodes structures in a permutation-invariant global latent space and learns their distribution via flow matching. A learned-slot decoder constructs all atoms in parallel, removing atom-wise correspondence from generative transport. On MP20, GLASS is competitive with particle-space models, and flow training can reach the validity of the training data at every structure size. On a QMOF subset, GLASS generates MOFs with up to 150 atoms per unit cell without conditioning on building blocks, topology, or composition, and approaches the structural validity of the training data. On both datasets, flow training exposes a validity–novelty tradeoff, and MOF novelty remains limited by autoencoder generalization on the available data. These results show that separating correspondence assignment from generative transport provides a simple route toward high-validity generation of larger atomistic systems.","keywords":"generative models; flow matching; set generation; metal-organic frameworks; latent flow matching; crystal generation","topics":["generation"]},{"note_id":"1Xi9fslMSG","number":"45343","title":"MatGym: An Agent-Centric Environment Bridging Materials Discovery and Reproducible Synthesis","abstract":"Materials discovery requires exploring how composition and processing affect performance when these relationships are only partly known. We introduce MatGym, an agent-centric environment for evaluating autonomous exploration and reproducible delivery across five simulated materials laboratories. Given a material specification and a resource budget, agents conduct open-ended exploration: they select candidates, control preparation steps, and choose computations and measurements to inform subsequent actions. Each task ends with a sample and a recipe, evaluated for service performance, agreement with the sample's preparation history, and replication on fresh batches. Across 52 tasks using the largest implemented candidate libraries, with three attempts per task, Codex and Claude Code achieve success rates of 43.6% and 41.0%, respectively. Similar overall rates mask different strengths across laboratories, and each system solves fewer than 30% of tasks successfully in all three attempts. Separate delivery checks distinguish material performance, process traceability, and batch reproducibility. In auxiliary transfer tests with an earlier Codex configuration, success on new ALD tasks increases from 30.6% without memory to 55.6% with prior campaign memory, while gains across material systems vary. MatGym provides a controlled setting for evaluating how agents explore unfamiliar material processes, deliver reproducible outcomes, and reuse experience on new tasks.","keywords":"benchmark; LLM agents; materials discovery; autonomous experimentation; reproducible synthesis","topics":["discovery","synthesis","benchmarks"]},{"note_id":"1nW3w7p6Wb","number":"45661","title":"Let CSP Be Your ANCHOR: Adaptive Crystal Search over Frozen Structure Priors","abstract":"De novo crystal generation (DNG) models decide where to search in composition space and how to generate structures with one set of weights. We argue that discovery is better served by separating the two. A crystal structure prediction (CSP) model is a physical prior that should be improved by likelihood training, while rewards, including novelty measured against the search's own history, should act on a search over compositions. We introduce ANCHOR, a GRPO composition policy trained with multi-objective rewards around a frozen CSP model, and continuous adaptive novelty (CAN), a graded novelty score against known structures and a growing discovery history. Using the frozen CSP model as a fixed ruler under one evaluator, we test where adaptation should act. Replacing DNG compositions with ANCHOR's policy on the same CSP backbone raises MSUN from 11.4% to 47.6% and SUN from 1.1% to 22.1% at 99.9% formula uniqueness. Fine-tuning DNG models directly on the same rewards instead moves their composition marginal without raising their on-hull fraction. We show that KL-regularized fine-tuning of a DNG model can only reweight chemistry the pretrained model already supports by a bounded factor, while unregularized DNG fine-tunes move toward known or less stable chemistry. Even a stability-only reward routed into ANCHOR's CSP backbone roughly halves SUN relative to the frozen backbone, whereas likelihood training on structures found during search can improve a CSP backbone. Under MatterGen's evaluation pipeline, ANCHOR raises state-of-the-art MSUN from 29.2% to 41.3%, transfers without retraining to two further CSP backbones, and reaches 47.1% after distillation into Crystalite-CSP. As with any model optimised against a potential, its on-hull rate depends on that potential.","keywords":"reinforcement learning; generative models; materials discovery; crystal structure prediction; de novo generation; crystal generation","topics":["generation","discovery"]},{"note_id":"FjzgZh47lp","number":"45739","title":"C4: Evidence-Aware Search for LLM-Guided Materials Discovery","abstract":"Historical results guide candidate generation in materials discovery, but a limited evaluation budget leaves many directions in the vast composition and structure space rarely or never tried. Search must therefore use successful experience while distinguishing insufficient observation from low potential. We introduce C4, a framework that coordinates four complementary tools: Open expands candidate support, Element identifies promising chemical directions, Explore probes underexplored alternatives, and Refine develops promising parents. C4 combines evaluated outcomes and shared visit records as search evidence, drawing on the exploration–exploitation principle of considering observed returns together with the evidence behind them. An LLM proposes tool-call proportions and branch-scoring weights from structured feedback. The Harness turns these proposals into budgeted calls and concrete substitution choices. Across fourteen multi-property tasks and three seeds with Qwen3-8B, C4 averages 448.33 new feasible compositions, compared with 105.67 for LLEMA, and leads all five baselines in each seed’s total. Component studies and parent reuse illustrate the roles of the tools and their coordination. The advantage also extends to GPT-4o and longer search, while knowledge-guided cases show how additional context redirects the same search process.","keywords":"LLM-guided materials discovery; multi-granularity search; adaptive search; materials discovery; large language models; finite-evidence decision making","topics":["discovery"]},{"note_id":"FcAP7OmpII","number":"45759","title":"MAGS: Mask Augmented Gaussian Splatting for reflective scenes","abstract":"Novel view synthesis of reflective scenes remains challenging because different combinations of geometry, materials, and illumination can explain similar observed appearances. \nThis ambiguity can lead to inconsistent material estimates within regions that share a common material, potentially degrading reflection rendering at novel viewpoints. \nWe introduce Mask-Augmented Gaussian Splatting (MAGS), a framework that improves reflective novel view synthesis through mask-guided material regularization. \nBuilding on a physically based 2D Gaussian Splatting framework, MAGS uses segmentation masks as regional priors and penalizes deviations of rendered material attributes from their mask-level means. \nThe resulting gradients propagate through differentiable rasterization to the underlying Gaussian material parameters, encouraging regional material consistency while allowing rendered appearance to vary across viewpoints. \nExperiments demonstrate competitive performance on the real-world Ref-Real benchmark and the best average PSNR, SSIM, and LPIPS among the compared methods on the synthetic ShinyBlender benchmark.","keywords":"Gaussian Splatting; Inverse Rendering; Mask-guided Regularization; Material Consistency","topics":["graphics"]},{"note_id":"h26MTAVbRa","number":"46569","title":"DreamCloth : Structural Counterfactual Score Factorization for Behavioral System Identification","abstract":"Frozen generative models are increasingly used as differentiable objectives for inverse problems, but their scores often mix together multiple changes in a scene. This makes it difficult to guide an inverse solver when we want to control a specific factor, such as garment appearance or body motion. We introduce **structural counterfactual score factorization**, which addresses this problem by rendering a set of matched counterfactual scenes in which the relevant factors are changed independently. A frozen video model then scores all of these scenes using the same stochastic draw. By comparing the four resulting scores, we cancel the effects of each factor in isolation and retain the part of the score that reflects how the two factors interact. This procedure does not require the frozen model to be linear or its internal representations to be semantically disentangled.\n\nWe apply this idea in **DreamCloth**, where garment appearance and body motion are the two factors of interest. The resulting interaction signal is used to guide a differentiable cloth simulator and recover material parameters. We further distinguish behavioral identification from unique physical-parameter identification: successful held-out rollouts support the former, but do not by themselves establish the latter. Experiments on ActorsHQ and 4D-DRESS show that factorized guidance improves held-out geometry and rendering compared with direct SDS, while our analyses reveal when the objective provides reliable guidance and when the available evidence is insufficient to uniquely determine the underlying parameters. Overall, our approach provides a way to isolate garment–motion interactions from frozen generative models and use them to guide cloth simulation.","keywords":"score distillation; video diffusion prior; differentiable simulation; material point method; cloth simulation; inverse problems; system identification; identifiability; physics-based generative priors; variance reduction","topics":["mechanics","graphics"]},{"note_id":"zXpgiPaQsT","number":"46621","title":"Struct-R1: Material Structure Search with Multi-Fidelity Measurement in Agentic Loops","abstract":"Materials discovery requires a research loop in large structure space with multi-tier measurements with different fidelity and costs, from machine-learned surrogates to DFT calculations and experiments. Manual exploration can be time-consuming, while statistical search methods and existing agent designs struggle to achieve high search efficiency with trade-off between fidelity and cost.\n\nWe present Struct-R1, a self-evolving agentic framework with two coupled loops. The inner search loop performs physics-grounded reasoning and perturbation proposal, and manages cross-tier relationships to improve search efficiency. The outer evolution loop reflects on individual search steps and converts their feedback into reusable knowledge. Through the two loops, Struct-R1 progressively refines both where to explore and how to allocate search budget on the measurements. We evaluate Struct-R1 on representative material-property search tasks, such as Raman and phonon properties, and further validate it using real research data for well-studied materials to assess its effectiveness in realistic scientific settings.","keywords":"AI for Science; Automatic Research Loop; Material Science; Material Structures","topics":["discovery"]},{"note_id":"A3z58aDtoA","number":"47330","title":"Exam2Teach: Can LLM Agents Turn Exam Results into Teaching Materials?","abstract":"High-quality teaching materials empower teachers to bridge learning gaps and provide highly targeted student support. Preparing such materials from exam results requires accurately interpreting student answers, translating identified needs into targeted instruction, and producing clear, coherent multimodal documents. In this work, we introduce Exam2Teach, a benchmark for evaluating whether autonomous LLM agents can generate high-quality, personalized teaching materials. Exam2Teach spans five core subjects shared by university-entrance curricula worldwide, using real exam papers, grading rubrics, de-identified student answers and scores. We design an open-source multi-agent framework for composing multi-step agent workflows. It powers our entire benchmark: agents generate documents, and evaluation workflows combine rule-based checks with agentic inspection of source evidence and rendered documents to assess task completion, layout quality, factual correctness, and personalization. The framework is general-purpose and extends readily to new tasks. An extensive evaluation of 10 agent configurations across 150 runs reveals uneven performance across four dimensions: the task completion threshold was met in 45.3% of runs, layout quality in 62.0%, factual correctness in 12.7%, and personalization in 26.7%. Only 7.3% passed all four dimensions, with no passing runs for review slides, and no single model consistently produced high-quality teaching materials of all categories. Even the strongest model overall, GPT-5.5, passed all four dimensions in only 40.0% of its runs. These results indicate a clear gap for frontier LLM agents in teaching material generation for AI-assisted education. Code and data are available at https://anonymous.4open.science/r/Exam2TeachAnonymous-8E75/.","keywords":"LLM agent benchmark; AI for education; teaching material generation; pedagogical personalization; multimodal document generation","topics":["other"]},{"note_id":"PTsclw583x","number":"47490","title":"What Defines a High-Quality Generated Material? Stress-Testing Generative Models on Amorphous Matter","abstract":"Generative models for materials excel at producing crystals and molecules with targeted properties. However, most technologically relevant materials are metastable, defected, or disordered systems that challenge the definitions of uniqueness, stability, and novelty on which typical metrics and benchmarks rest. Here, we introduce AmorphBench, a protocol that evaluates how well generative models sample inorganic amorphous structures according to physical principles. We define 6 metric families and 21 quality metrics covering short- and medium-range order, topology, spectroscopic observables, mechanics, energetics, and phase-space coverage. By scoring properties and experimental observables rather than structural agreement alone, we expose multiple limitations of the learned distributions, where even single outlying atoms lead to outright unphysical behavior. Applying the protocol to 8 generative and structure-fitting methods across 5 systems and 14 density and composition conditions, we show that generative model quality for materials is far from saturated. Scaling tests indicate that performance improves with training data, a promising signal for amorphous systems, where reference datasets are expensive to obtain. We release the benchmark and its reference datasets to guide the development of generative models that meet the bars for data efficiency and sample quality required by real-world applications.","keywords":"generative models; sampling; physical sciences; materials science; datasets and benchmarks","topics":["generation","benchmarks"]},{"note_id":"1Suqp3g7V9","number":"47544","title":"Synthon-CGR: Co-crystal Formation Prediction with Crystal-Supervised Synthon Reasoning","abstract":"Co-crystallization offers a practical way to tune the physicochemical properties of molecular compounds without changing their covalent structure, but finding compatible molecular pairs still requires substantial experimental effort. Most machine-learning approaches treat this problem as binary classification and are trained only on pair-level formation labels. As a result, they provide limited information about the intermolecular motifs that support a predicted co-crystal. We introduce Synthon Candidate Graph Reasoner (Synthon-CGR), a graph neural network that predicts co-crystal formation together with a ranked set of candidate supramolecular synthons. The model combines molecular graph representations, functional motifs, and crystal-derived supervision so that intermolecular interactions become explicit prediction targets rather than post-hoc explanations. We curate literature and crystallographic data, augment the training pool to 27,718 molecular pairs to address the scarcity of reported negatives, and derive synthon labels from resolved crystal structures. On a pair-disjoint held-out test set, Synthon-CGR reaches F1 = 0.893 for co-crystal formation and HitRate@5 = 0.935 on the synthon-ranking subset. We also evaluate the model on an independent dataset obtained from co-crystallization experiments conducted in our laboratory and compare predicted interaction motifs with expert annotations for experimentally confirmed co-crystals. Together, these experiments show that crystal-derived interaction supervision can extend pair-level co-crystal prediction with explicit and experimentally testable hypotheses about molecular recognition.","keywords":"graph neural network; transfer learning; co-crystal prediction; supramolecular synthon; interpretability","topics":["properties","synthesis"]},{"note_id":"OP1tViIkc9","number":"47923","title":"Reinforcement Learning on the Discrete Composition Channel of a Crystal Generator: Validated Gains and Reward Hacking","abstract":"Inverse materials design is a long-standing goal of computational materials discovery. Generative models for crystalline materials are typically trained to match the distribution of a structure database, while nothing in their training objective points them at specific design goals such as targeted properties. We use group-relative policy optimization (GRPO) to align a generative model based on stochastic interpolants and discrete flow matching with general black-box reward functions through reinforcement learning. Atom types are generated by a discrete flow and the policy gradient of our generalization of GRPO directly acts on the likelihoods of the atom-type transitions, which differentiates our work from previous reinforcement-learning approaches for diffusion and flow-based generative models of crystalline materials. We introduce a reward function that raises the yield of metastable, unique and novel structures (mSUN) from 13.4\\% for the pretrained model to 45.5\\% for the reinforced model, as evaluated by a community benchmark. Our reward also improves the performance of a reinforcement learning framework for crystalline materials based on latent denoising diffusion models. At the same time, we find that directly reinforcing atom-type transition likelihoods enables reward exploitation that has to be prevented with explicit guards. The same analysis also exposes a gap in the community metric. Single-element structures in distinct packings are counted as metastable, unique and novel materials and inflate mSUN without yielding any new compounds. A stability claim is only as good as its reference hull. We report every result split by the number of reference phases behind it and argue that benchmarks should do the same.","keywords":"reinforcement learning; GRPO; generative models; materials discovery; crystal structure generation; discrete flow matching; stochastic interpolants; reward hacking","topics":["generation"]},{"note_id":"J49TK6fvOW","number":"48483","title":"Generating Materials with Excellent Properties via Actor-Critic Diffusion","abstract":"Diffusion models, as the basis for state-of-the-art foundation models for materials discovery, potentially signal a paradigm shift from the expensive, manual trial-and-error industrial practice. Technology across multiple fields is powered by materials with desirable and often rarely seen properties. Classifier-free (or guided) diffusion has been the main approach in generating materials with these conditioned properties, however, these approaches tend to fall back to existing materials when conditioned on extreme property values. This poses significant hurdles in discovering novel, stable materials with excellent properties. Instead of formulating the problem as conditional diffusion, we define a novel Reinforcement Learning (RL) process for the reverse diffusion to maximize property values as rewards. RL explores the composition space freely, hence not bounded by existing materials in the training dataset. We present CrystRL, a reinforcement learning-based method that can generate novel, stable materials with excellent properties. CrystRL fine-tunes the unconditional reverse diffusion using an actor network, which suggests denoising moves to good materials. It is supplemented by a critic network, which predicts the best property values from a noisy state. Experimental results show that CrystRL discovers novel and stable crystals with out-of-training-distribution ML-predicted bulk moduli of up to 408 GPa and DFT-verified bulk moduli of up to 397 GPa more consistently than classifier-free guided generation.","keywords":"AI for scientific discovery; Reinforcement learning; Diffusion; Materials discovery; Actor-critic reinforcement learning; Guided diffusion; Conditional diffusion; Superhard materials","topics":["generation"]},{"note_id":"M1ag2tCmQo","number":"48729","title":"OMatG-flash: An All-Atom Flow Map with Reinforce Adjoint Matching for Scalable Materials Discovery","abstract":"The discovery of novel inorganic materials drives technological breakthroughs in critical fields such as computing and energy storage. Generative AI has promised to accelerate the materials discovery pipeline, but state-of-the-art flow and diffusion models remain bottlenecked by the cost of proposing candidate materials. To address this, we introduce OMatG-flash, an all-atom flow map for inorganic crystal structure prediction (CSP) and de novo generation (DNG). OMatG-flash is a Pareto-optimal inference engine for materials, sampling candidate materials with an order of magnitude fewer inference steps and less wall-clock time than existing flow and diffusion models while demonstrating benchmark performance on par with the state-of-the-art. To enable post-training fine-tuning we apply Reinforce Adjoint Matching to flow maps, further improving performance on the CSP task. OMatG-flash showcases the potential of flow maps to accelerate generation of high-quality candidate inorganic materials and demonstrates a step forward in sample throughput necessary for data-hungry materials discovery workflows.","keywords":"Generative AI; Materials Discovery; Flow Map; Flow Matching; Reinforcement Learning","topics":["generation"]},{"note_id":"p8hO9Zl99q","number":"48861","title":"Multimodal Domain-Adaptive Language Models for Materials Discovery in Metal–Organic Frameworks","abstract":"Accurate and data-efficient prediction of metal--organic framework (MOF) properties requires representations that capture both chemical and structural information. We propose a two-stage framework that continually pretrains the Granite language model on PubChem records and MOF literature, and then fuses its frozen MOFid representations with 18 interpretable CIF-derived descriptors through cross-attention. Continued pretraining alone improves QMOF band-gap and HMOF gas-adsorption prediction, and structural grounding adds further gains. Controlled ablatio
